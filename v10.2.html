<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strawberry Mocha Planner v10.2 🍓</title><style>html,body{margin:0;background:#fbf4f1}iframe{display:block;width:100%;height:100vh;min-height:700px;border:0}</style></head><body><iframe id="v10" src="./v10.html" title="Strawberry Mocha Planner v10"></iframe><script>const frame=document.getElementById('v10');let done=false;function patch(){try{const v=frame.contentWindow,p=v.document.getElementById('pf');if(!p||!p.contentWindow||!p.contentDocument||done)return;const w=p.contentWindow;w.eval(`(function(){if(window.__smDayEditor)return;window.__smDayEditor=true;const original=window.openDay;window.openDay=function(k){const h=hist(k),ts=d.tasks.filter(x=>x.date===k),ws=d.wins.filter(x=>x.date===k),r=['morning','night'].map(q=>{const a=d.routines[q]||[];return a.filter(x=>x[1]&&x[1][k]).length+'/'+a.length});document.getElementById('dayTitle').textContent=new Date(k+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});document.getElementById('dayBody').innerHTML='<div class="card"><div class="section"><h3>✏️ Edit Day</h3><span class="label">'+k+'</span></div><div class="two"><label class="mini">Mood<input id="smEditMood" class="input" value="'+esc(h.mood||'')+'" placeholder="How did you feel?"></label><label class="mini">Energy<input id="smEditEnergy" class="input" type="number" min="1" max="10" value="'+(h.energy||5)+'"></label></div><label class="mini" style="display:block;margin-top:8px">Movement<input id="smEditMovement" class="input" value="'+esc(h.movement||'')+'" placeholder="Walk, Pilates, treadmill…"></label><label class="mini" style="display:block;margin-top:8px">Day Notes / Reflection<textarea id="smEditNotes" class="input" placeholder="What happened today? What do you want to remember?"></textarea></label><div class="row"><button class="btn primary" id="smSaveDay">💾 Save Changes</button><button class="btn" id="smViewReview">👀 View Review</button></div></div><div class="card">🧩 <b>Tasks</b><br>'+ts.map(x=>(x.done?'✅ ':'▫️ ')+esc(x.text)).join('<br>')+(ts.length?'':'None')+'</div><div class="card">🌷 <b>Wins</b><br>'+ws.map(x=>esc(x.text)).join('<br>')+(ws.length?'':'None')+'</div><div class="card">🌸 <b>Routines:</b> Morning '+r[0]+' · Evening '+r[1]+'</div>';document.getElementById('smEditNotes').value=h.notes||'';document.getElementById('smSaveDay').onclick=function(){h.mood=document.getElementById('smEditMood').value;h.energy=+document.getElementById('smEditEnergy').value||5;h.movement=document.getElementById('smEditMovement').value;h.notes=document.getElementById('smEditNotes').value;save();document.getElementById('dayModal').classList.remove('open')};document.getElementById('smViewReview').onclick=function(){document.getElementById('dayBody').innerHTML='<div class="card">🧩 <b>Tasks</b><br>'+ts.map(x=>(x.done?'✅ ':'▫️ ')+esc(x.text)).join('<br>')+(ts.length?'':'None')+'</div><div class="card">🌷 <b>Wins</b><br>'+ws.map(x=>esc(x.text)).join('<br>')+(ws.length?'':'None')+'</div><div class="card">😊 <b>Mood:</b> '+esc(h.mood||'—')+' · <b>Energy:</b> '+(h.energy||'—')+'</div><div class="card">🌸 <b>Routines:</b> Morning '+r[0]+' · Evening '+r[1]+'</div><div class="row"><button class="btn primary" id="smEditAgain">✏️ Edit This Day</button></div>';document.getElementById('smEditAgain').onclick=function(){window.openDay(k)}};document.getElementById('dayModal').classList.add('open')}})()`);done=true}catch(e){console.log('V10.2 waiting',e)}}frame.addEventListener('load',()=>{setTimeout(patch,500);setTimeout(patch,1500);setTimeout(patch,3000)});setInterval(patch,1000);</script></body></html>
