<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf5f2">
<title>Strawberry Mocha Planner V15 🍓</title>
<style>
:root{--pink:#e99ab7;--dark:#b96c88;--soft:#fff0f5;--cream:#fffaf6;--bg:#fbf5f2;--ink:#674941;--muted:#99817a;--line:#eadbd6;--green:#b8d9b2;--shadow:0 10px 30px rgba(103,73,65,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:15px;padding:10px 13px;font-weight:850;cursor:pointer}button.primary,.nav button.active{background:var(--soft);border-color:#efbfd0;color:var(--dark)}button.danger{color:#a35f6f}.app{max-width:1280px;margin:auto;padding:8px 14px 45px}.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 10px}.brand{font-weight:950;color:var(--dark);font-size:20px}.badge{font-size:9px;color:var(--dark);border:1px solid var(--line);border-radius:99px;padding:7px 10px;background:#fff}.nav{display:flex;gap:7px;overflow-x:auto;overscroll-behavior-x:contain;position:sticky;top:0;z-index:30;padding:8px 0 12px;background:rgba(251,245,242,.94);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,#f6d6e2,#fff8ef);border-radius:30px;padding:25px;margin-bottom:12px;position:relative;overflow:hidden}.hero:after{content:'🍓';position:absolute;right:20px;bottom:-28px;font-size:110px;opacity:.72}.ey{font-size:9px;letter-spacing:.16em;font-weight:950;color:var(--dark)}h1{font-size:36px;margin:7px 0}h2,h3{margin:5px 0 10px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.stat{background:#fff;border:1px solid var(--line);border-radius:23px;padding:17px;box-shadow:var(--shadow);margin:9px 0}.stat{background:var(--cream);margin:0}.stat small{display:block;color:var(--muted);font-size:9px;font-weight:950}.stat b{display:block;font-size:24px;margin-top:4px}.ringrow{display:flex;gap:14px;align-items:center}.ring{width:94px;height:94px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--pink) var(--pct,0%),#f0e4e6 0);flex:none}.ring:after{content:'';width:68px;height:68px;border-radius:50%;background:#fff}.ring span{position:absolute;z-index:1;font-weight:950;color:var(--dark)}.garden{min-height:205px;border-radius:22px;padding:18px;background:linear-gradient(#fffaf6 0 55%,#f0ded3 55%);overflow:hidden}.plant{display:inline-flex;flex-direction:column;align-items:center;margin:5px 7px;font-size:38px}.plant small{font-size:9px;color:var(--dark);font-weight:900}.input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink)}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}.calendar{background:#fff;border:1px solid var(--line);border-radius:25px;padding:15px;box-shadow:var(--shadow)}.calhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.calhead h2{flex:1;text-align:center}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.dow{text-align:center;color:var(--dark);font-size:10px;font-weight:950;padding:6px 0}.day{min-height:82px;padding:8px;text-align:left;border-radius:14px;overflow:hidden}.day.today{background:var(--soft)}.day.selected{outline:2px solid var(--pink)}.day.empty{visibility:hidden}.eventdot{display:block;font-size:9px;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.eventItem{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:15px;padding:10px;margin:6px 0;background:var(--cream)}.eventItem .grow{flex:1}.pill{display:inline-block;background:var(--soft);border-radius:10px;padding:5px 8px;font-size:10px;color:var(--dark);font-weight:850}.progress{height:11px;background:#f0e3e5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--pink);border-radius:99px}.bars{height:150px;display:flex;align-items:end;gap:7px;border-bottom:1px solid var(--line);padding:10px}.bar{flex:1;background:#efbfd0;border-radius:8px 8px 0 0;min-height:7px}.bar span{display:block;transform:translateY(-18px);font-size:9px;text-align:center}.goal{border:1px solid var(--line);border-radius:22px;padding:16px;margin:9px 0;background:linear-gradient(135deg,#fff,#fff7fa)}.goalbar{height:9px;background:#f1e5e7;border-radius:99px;overflow:hidden;margin-top:9px}.goalbar i{display:block;height:100%;background:var(--pink);border-radius:99px}.habit{border:1px solid var(--line);border-radius:20px;padding:14px;background:#fff;margin:8px 0}.checks{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.check{width:31px;height:31px;padding:0;border-radius:10px}.check.on{background:var(--soft);border-color:#efbfd0;color:var(--dark)}.empty{padding:18px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center;background:#fffaf8}.toast{display:none;position:fixed;right:14px;bottom:14px;z-index:100;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 15px;box-shadow:0 12px 35px rgba(103,73,65,.12)}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}h1{font-size:31px}.day{min-height:64px;padding:6px}.hero{padding:21px}.row{flex-wrap:wrap}.row>*{min-width:120px}}
@media(max-width:480px){.grid{grid-template-columns:1fr}.app{padding:7px 11px 30px}.nav button{font-size:11px;padding:9px 10px}.day{min-height:56px}.eventdot{font-size:8px}.badge{display:none}.brand{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">🍓 Strawberry Mocha</div><div class="badge">V15 • ONE FILE™</div></header>
<nav class="nav" id="nav"></nav>
<main id="pages"></main>
</div>
<div id="toast" class="toast">☁️ Saved</div>
<script>
const KEY='sm_v10';
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>'$'+(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
let db=load();
db.v15=db.v15||{};
const D=db.v15;
D.events=D.events||[];D.reminders=D.reminders||[];D.tasks=D.tasks||[];D.routines=D.routines||[];D.habits=D.habits||[];D.goals=D.goals||[];D.wins=D.wins||[];D.archive=D.archive||[];D.courses=D.courses||[];D.days=D.days||{};D.money=D.money||{income:0,funds:0,bills:0,spend:0,saving:0,debt:0};D.totalClasses=D.totalClasses||0;D.brain=D.brain||'';
function save(msg='☁️ Saved'){db.v15=D;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){};toast(msg);render()}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.style.display='none',900)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let active=localStorage.getItem('sm_v15_page')||'home';
const tabs=[['home','🏠 Home'],['planner','📅 Planner'],['tasks','📝 Tasks'],['garden','🌷 Garden'],['school','🎀 School'],['money','☕ Money'],['reminders','🔔 Reminders'],['brain','📝 Brain Dump'],['wellness','🌸 Wellness'],['goals','✨ Goals'],['wins','🏆 Wins'],['archive','🗄️ Archive']];
function nav(){document.getElementById('nav').innerHTML=tabs.map(([id,t])=>`<button class="${active===id?'active':''}" data-page="${id}">${t}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{active=b.dataset.page;localStorage.setItem('sm_v15_page',active);render()})}
function shell(id,title,sub,body){return `<section id="${id}" class="page active"><div class="hero"><div class="ey">${title}</div><h1>${sub}</h1></div>${body}</section>`}
function home(){const done=D.courses.filter(c=>['Completed','Transferred'].includes(c.status)).length;const degree=D.totalClasses?Math.round(done/D.totalClasses*100):0;const habitPct=D.habits.length?Math.round(D.habits.reduce((a,h)=>a+(h.checks?.[today()]?1:0),0)/D.habits.length*100):0;const upcoming=[...D.events,...D.reminders.filter(r=>!r.completed)].filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);const flowers=habitPct<25?'🌱':habitPct<50?'🌿':habitPct<75?'🌷':'🌸';return shell('home','🍓 STRAWBERRY MOCHA • V15','Good morning, Kat ♡',`<div class="grid"><div class="stat"><small>🎓 DEGREE</small><b>${degree}%</b></div><div class="stat"><small>🌷 HABITS</small><b>${habitPct}%</b></div><div class="stat"><small>☕ AVAILABLE</small><b>${money(D.money.funds)}</b></div><div class="stat"><small>🏆 WINS</small><b>${D.wins.length}</b></div></div><div class="split"><div class="card"><div class="ringrow"><div class="ring" style="--pct:${degree}%"><span>${degree}%</span></div><div><h3>🎓 Degree Journey</h3><p class="muted">WGU + Sophia, one bachelor's path.</p></div></div></div><div class="card"><div class="ringrow"><div class="ring" style="--pct:${habitPct}%"><span>${habitPct}%</span></div><div><h3>🌷 Habit Garden</h3><p class="muted">Consistency over perfection.</p></div></div></div></div><div class="card"><h2>🌱 Growing Garden</h2><div class="garden">${D.habits.length?D.habits.map(h=>`<span class="plant">${h.icon||flowers}<small>${esc(h.name)}</small></span>`).join(''):'<span class="plant">🌱<small>Add a habit in Garden</small></span>'}<p class="muted">Your real habit progress lives here too.</p></div></div><div class="split"><div class="card"><h3>📌 Upcoming</h3>${upcoming.length?upcoming.map(x=>`<div class="eventItem"><span>${x.type==='bill'?'💸':x.type==='reminder'?'🔔':'📌'}</span><span class="grow"><b>${esc(x.title)}</b><br><small>${esc(x.date)}</small></span></div>`).join(''):'<div class="empty">Nothing scheduled yet. Blank canvas ♡</div>'}</div><div class="card"><h3>✨ Tiny win</h3><p class="muted">Pick one thing you did today that counts.</p><button class="primary" onclick="addWin()">＋ Celebrate a win</button></div></div>`)}
function addWin(){const t=prompt('What tiny win are we celebrating?');if(t){D.wins.push({id:uid(),text:t,date:today()});save('🏆 Win saved')}}
let calCursor=new Date();let selected= today();
function planner(){const y=calCursor.getFullYear(),m=calCursor.getMonth();const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=first.getDay();let cells='';['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(x=>cells+=`<div class="dow">${x}</div>`);for(let i=0;i<offset;i++)cells+='<div class="day empty"></div>';for(let d=1;d<=days;d++){const date=new Date(y,m,d).toISOString().slice(0,10);const items=[...D.events,...D.reminders.filter(r=>r.date===date)].filter(x=>x.date===date);cells+=`<button class="day ${date===today()?'today ':''}${date===selected?'selected':''}" data-date="${date}"><b>${d}</b>${items.slice(0,2).map(x=>`<span class="eventdot">${x.type==='bill'?'💸':x.type==='reminder'?'🔔':'•'} ${esc(x.title)}</span>`).join('')}</button>`}const items=[...D.events,...D.reminders.filter(r=>r.date===selected)].filter(x=>x.date===selected);const day=D.days[selected]||{};return shell('planner','📅 PLANNER • V15','Your calendar, without the clipping.',`<div class="calendar"><div class="calhead"><button onclick="moveMonth(-1)">‹</button><h2>${calCursor.toLocaleString(undefined,{month:'long',year:'numeric'})}</h2><button onclick="moveMonth(1)">›</button></div><div class="calgrid">${cells}</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="ey">SELECTED DAY</div><h2>${new Date(selected+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</h2></div><button onclick="selected=today();calCursor=new Date();render()">Today</button></div>${items.length?items.map(x=>`<div class="eventItem"><span>${x.type==='bill'?'💸':x.type==='reminder'?'🔔':'📌'}</span><span class="grow"><b>${esc(x.title)}</b>${x.time?`<br><small>${esc(x.time)}</small>`:''}</span><button class="danger" onclick="archiveItem('${x.id}')">🗄️</button></div>`).join(''):'<div class="empty">No events yet. Blank canvas. ♡</div>'}<div class="plannerActions row"><button class="primary" onclick="addEvent()">＋ Add Event</button><button onclick="addBill()">💸 Add Bill</button></div><div class="row"><input id="dayMood" class="input" placeholder="Mood" value="${esc(day.mood||'')}"><input id="dayNote" class="input" placeholder="Day note" value="${esc(day.note||'')}"><button class="primary" onclick="saveDay()">💾 Save Day</button></div></div></div>`)}
function moveMonth(n){calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+n,1);render()}
function addEvent(){const title=prompt('Event name?');if(!title)return;const time=prompt('Time? (optional)')||'';D.events.push({id:uid(),title,date:selected,time,type:'event'});save('📌 Event added')}
function addBill(){const title=prompt('Bill name?');if(!title)return;const amount=prompt('Amount?');const recurring=confirm('Repeat every month until you delete it?');D.reminders.push({id:uid(),title:`${title}${amount?' • '+money(amount):''}`,date:selected,type:'bill',amount:Number(amount)||0,recurring,completed:false});save('💸 Bill added')}
function saveDay(){D.days[selected]={mood:document.getElementById('dayMood').value,note:document.getElementById('dayNote').value};save('📝 Day saved')}
function archiveItem(id){const x=[...D.events,...D.reminders].find(a=>a.id===id);if(!x)return;D.archive.push({...x,archivedAt:today()});D.events=D.events.filter(a=>a.id!==id);D.reminders=D.reminders.filter(a=>a.id!==id);save('🗄️ Archived')}
function tasks(){const ts=D.tasks.filter(t=>t.date===today());return shell('tasks','📝 TASKS • V15','Little things, one at a time. ♡',`<div class="card"><div class="ey">✨ ADD A TASK</div><div class="row"><input id="taskText" class="input" placeholder="Task name"><select id="taskCat" class="input"><option>Personal</option><option>School</option><option>Home</option><option>Work</option></select><button class="primary" onclick="addTask()">＋ Add task</button></div></div><div class="split"><div class="card"><div class="ey">🌷 TODAY</div><h2>Today's tasks</h2>${ts.length?ts.map(t=>`<div class="eventItem"><button onclick="toggleTask('${t.id}')">${t.done?'✓':'○'}</button><span class="grow" style="${t.done?'text-decoration:line-through;opacity:.55':''}"><b>${esc(t.text)}</b><br><small>${esc(t.category)}</small></span><button onclick="deleteTask('${t.id}')">🗑️</button></div>`).join(''):'<div class="empty">🌱 Nothing here yet. Tiny is allowed.</div>'}</div><div class="card"><div class="ey">🎀 ROUTINES</div><h2>My routines</h2><div class="row"><input id="routineText" class="input" placeholder="Routine name"><select id="routineFreq" class="input"><option value="daily">Every day</option><option value="weekdays">Weekdays</option><option value="weekly">Weekly</option></select><button class="primary" onclick="addRoutine()">＋ Add</button></div>${D.routines.length?D.routines.map(r=>`<div class="eventItem"><button onclick="toggleRoutine('${r.id}')">${r.checks?.[today()]?'✓':'○'}</button><span class="grow"><b>${esc(r.name)}</b><br><small>${r.frequency}</small></span><button onclick="deleteRoutine('${r.id}')">🗑️</button></div>`).join(''):'<div class="empty">🎀 No routines yet.</div>'}</div></div>`)}
function addTask(){const text=document.getElementById('taskText').value.trim();if(!text)return;D.tasks.push({id:uid(),text,category:document.getElementById('taskCat').value,date:today(),done:false});save('📝 Task added')}
function toggleTask(id){const x=D.tasks.find(t=>t.id===id);if(x){x.done=!x.done;save('✓ Task updated')}}function deleteTask(id){D.tasks=D.tasks.filter(t=>t.id!==id);save('🗑️ Task removed')}
function addRoutine(){const name=document.getElementById('routineText').value.trim();if(!name)return;D.routines.push({id:uid(),name,frequency:document.getElementById('routineFreq').value,checks:{}});save('🎀 Routine added')}function toggleRoutine(id){const x=D.routines.find(r=>r.id===id);if(x){x.checks=x.checks||{};x.checks[today()]=!x.checks[today()];save('🌷 Routine updated')}}function deleteRoutine(id){D.routines=D.routines.filter(r=>r.id!==id);save('🗑️ Routine removed')}
function garden(){return shell('garden','🌷 HABIT GARDEN','Grow what matters.',`<div class="card"><p class="muted">Pick 1–2 habits and call that enough. Your Home garden mirrors these exact habits.</p><div class="row"><input id="habitName" class="input" placeholder="Habit name"><select id="habitIcon" class="input"><option>🌱</option><option>🌷</option><option>🌸</option><option>🌺</option><option>🍓</option><option>☕</option></select><button class="primary" onclick="addHabit()">＋ Plant habit</button></div></div>${D.habits.length?D.habits.map(h=>`<div class="habit"><div style="display:flex;justify-content:space-between;align-items:center"><div><span style="font-size:30px">${h.icon||'🌱'}</span> <b>${esc(h.name)}</b></div><button onclick="deleteHabit('${h.id}')">🗑️</button></div><div class="checks">${Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const k=d.toISOString().slice(0,10);return `<button class="check ${h.checks?.[k]?'on':''}" onclick="toggleHabit('${h.id}','${k}')">${d.toLocaleDateString(undefined,{weekday:'narrow'})}</button>`}).join('')}</div></div>`).join(''):'<div class="empty">🌱 Your garden is waiting for its first seed.</div>'}`)}
function addHabit(){const name=document.getElementById('habitName').value.trim();if(!name)return;D.habits.push({id:uid(),name,icon:document.getElementById('habitIcon').value,checks:{}});save('🌱 Habit planted')}function toggleHabit(id,date){const h=D.habits.find(x=>x.id===id);if(h){h.checks=h.checks||{};h.checks[date]=!h.checks[date];save('🌷 Garden updated')}}function deleteHabit(id){D.habits=D.habits.filter(x=>x.id!==id);save('🗑️ Habit removed')}
function school(){const done=D.courses.filter(c=>['Completed','Transferred'].includes(c.status)).length;const pct=D.totalClasses?Math.round(done/D.totalClasses*100):0;return shell('school','🎀 SCHOOL HUB','School, but actually interactive.',`<div class="grid"><div class="stat"><small>COMPLETED</small><b>${done}</b></div><div class="stat"><small>WGU</small><b>${D.courses.filter(c=>c.school==='WGU').length}</b></div><div class="stat"><small>SOPHIA</small><b>${D.courses.filter(c=>c.school==='Sophia').length}</b></div><div class="stat"><small>PROGRESS</small><b>${pct}%</b></div></div><div class="card"><div style="display:flex;justify-content:space-between"><b>🎓 Bachelor's Progress</b><b>${pct}%</b></div><div class="progress"><i style="width:${pct}%"></i></div><div class="row"><input id="totalClasses" class="input" type="number" placeholder="Total classes" value="${D.totalClasses||''}"><button class="primary" onclick="saveTotal()">Save</button></div></div><div class="card"><h3>➕ Add Course</h3><div class="row"><input id="courseName" class="input" placeholder="Course name"><select id="courseSchool" class="input"><option>WGU</option><option>Sophia</option></select><select id="courseStatus" class="input"><option>Not Started</option><option>In Progress</option><option>Completed</option><option>Transferred</option></select><button class="primary" onclick="addCourse()">＋ Save</button></div></div><div class="card"><h3>📚 Courses</h3>${D.courses.length?D.courses.map(c=>`<div class="eventItem"><span class="grow"><b>${esc(c.name)}</b><br><small>${c.school} • ${c.status}</small></span><button onclick="deleteCourse('${c.id}')">🗑️</button></div>`).join(''):'<div class="empty">No courses yet.</div>'}</div>`)}
function saveTotal(){D.totalClasses=Number(document.getElementById('totalClasses').value)||0;save('🎓 Progress saved')}function addCourse(){const name=document.getElementById('courseName').value.trim();if(!name)return;D.courses.push({id:uid(),name,school:document.getElementById('courseSchool').value,status:document.getElementById('courseStatus').value});save('🎀 Course added')}function deleteCourse(id){D.courses=D.courses.filter(c=>c.id!==id);save('🗑️ Course removed')}
function moneyPage(){const m=D.money;const left=(Number(m.income)||0)+(Number(m.funds)||0)-(Number(m.bills)||0)-(Number(m.spend)||0);const vals=[['Bills',m.bills],['Spend',m.spend],['Save',m.saving],['Debt',m.debt]];const max=Math.max(1,...vals.map(x=>Number(x[1])||0));return shell('money','☕ MONEY CAFÉ','What can I actually touch?',`<div class="grid"><div class="stat"><small>INCOME</small><input id="income" class="input" type="number" value="${m.income||''}"></div><div class="stat"><small>💗 CURRENT FUNDS</small><input id="funds" class="input" type="number" value="${m.funds||''}"></div><div class="stat"><small>COMBINED</small><b>${money((Number(m.income)||0)+(Number(m.funds)||0))}</b></div><div class="stat"><small>LEFT</small><b>${money(left)}</b></div></div><div class="card"><h2>📊 Budget Graph</h2><div class="bars">${vals.map(([n,v])=>`<div class="bar" style="height:${Math.max(7,(Number(v)||0)/max*100)}%"><span>${n}</span></div>`).join('')}</div><div class="grid"><div class="stat"><small>BILLS</small><input id="bills" class="input" type="number" value="${m.bills||''}"></div><div class="stat"><small>SPENDING</small><input id="spend" class="input" type="number" value="${m.spend||''}"></div><div class="stat"><small>SAVINGS</small><input id="saving" class="input" type="number" value="${m.saving||''}"></div><div class="stat"><small>DEBT</small><input id="debt" class="input" type="number" value="${m.debt||''}"></div></div><button class="primary" onclick="saveMoney()">💾 Save Money Snapshot</button></div>`)}
function saveMoney(){['income','funds','bills','spend','saving','debt'].forEach(k=>D.money[k]=Number(document.getElementById(k).value)||0);save('☕ Money saved')}
function reminders(){const activeR=D.reminders.filter(r=>!r.archived);return shell('reminders','🔔 REMINDERS • BILLS TOO','Future-you’s sticky notes.',`<div class="card"><div class="row"><input id="remTitle" class="input" placeholder="Reminder or bill"><input id="remDate" class="input" type="date" value="${today()}"><select id="remType" class="input"><option value="reminder">Reminder</option><option value="bill">Bill</option></select><label style="display:flex;align-items:center;gap:6px"><input id="remMonthly" type="checkbox"> Monthly</label><button class="primary" onclick="addReminder()">＋ Add</button></div></div><div class="card"><div class="ey">ALL</div>${activeR.length?activeR.map(r=>`<div class="eventItem"><button onclick="completeReminder('${r.id}')">${r.completed?'✓':'○'}</button><span class="grow"><b>${esc(r.title)}</b><br><small>${esc(r.date)} ${r.recurring?'• repeats monthly':''}</small></span><button onclick="archiveItem('${r.id}')">🗄️</button><button onclick="deleteReminder('${r.id}')">🗑️</button></div>`).join(''):'<div class="empty">🔔 No reminders yet.</div>'}</div>`)}
function addReminder(){const title=document.getElementById('remTitle').value.trim();if(!title)return;D.reminders.push({id:uid(),title,date:document.getElementById('remDate').value||today(),type:document.getElementById('remType').value,recurring:document.getElementById('remMonthly').checked,completed:false});save('🔔 Reminder added')}function completeReminder(id){const r=D.reminders.find(x=>x.id===id);if(!r)return;if(r.recurring){const d=new Date(r.date+'T12:00:00');d.setMonth(d.getMonth()+1);r.date=d.toISOString().slice(0,10);r.completed=false;D.archive.push({...r,id:uid(),date:new Date().toISOString().slice(0,10),archivedAt:today(),completed:true})}else r.completed=!r.completed;save('✓ Reminder updated')}function deleteReminder(id){D.reminders=D.reminders.filter(x=>x.id!==id);save('🗑️ Reminder removed')}
function brain(){return shell('brain','📝 BRAIN DUMP','Get it out of your head.',`<div class="card"><textarea id="brainText" placeholder="Everything floating around in my brain…">${esc(D.brain)}</textarea><button class="primary" onclick="saveBrain()">💾 Save Brain Dump</button></div>`)}function saveBrain(){D.brain=document.getElementById('brainText').value;save('🧠 Saved')}
function wellness(){const w=D.wellness||{};return shell('wellness','🌸 WELLNESS','Check in, don’t judge.',`<div class="card"><div class="row"><input id="wmood" class="input" type="number" min="1" max="10" placeholder="Mood 1–10" value="${w.mood||''}"><input id="wenergy" class="input" type="number" min="1" max="10" placeholder="Energy 1–10" value="${w.energy||''}"><input id="wsleep" class="input" type="number" min="0" placeholder="Sleep hours" value="${w.sleep||''}"></div><textarea id="wNote" placeholder="How are you feeling?">${esc(w.note||'')}</textarea><button class="primary" onclick="saveWellness()">🌸 Save Check-in</button></div>`)}function saveWellness(){D.wellness={mood:Number(document.getElementById('wmood').value)||0,energy:Number(document.getElementById('wenergy').value)||0,sleep:Number(document.getElementById('wsleep').value)||0,note:document.getElementById('wNote').value,date:today()};save('🌸 Check-in saved')}
function goals(){return shell('goals','✨ GOALS GARDEN • V15','What are you growing?',`<div class="card"><p class="muted">Big goals get tiny steps. Your goals live here, and Home shows their garden progress.</p><div class="row"><input id="goalName" class="input" placeholder="Goal name"><input id="goalTarget" class="input" type="number" placeholder="Target %" value="100"><button class="primary" onclick="addGoal()">＋ Plant goal</button></div></div>${D.goals.length?D.goals.map(g=>`<div class="goal"><div style="display:flex;justify-content:space-between;align-items:center"><div><span style="font-size:28px">${g.icon||'🌱'}</span> <b>${esc(g.name)}</b></div><button onclick="deleteGoal('${g.id}')">🗑️</button></div><div class="row"><input id="gp-${g.id}" class="input" type="number" min="0" max="100" value="${g.progress||0}"><button class="primary" onclick="setGoal('${g.id}')">Update</button></div><div class="goalbar"><i style="width:${Math.min(100,Math.max(0,g.progress||0))}%"></i></div><small>${g.progress||0}% grown</small></div>`).join(''):'<div class="empty">🌱 No goals yet. Plant one when you’re ready.</div>'}`)}
function addGoal(){const name=document.getElementById('goalName').value.trim();if(!name)return;D.goals.push({id:uid(),name,progress:0,icon:'🌱'});save('✨ Goal planted')}function setGoal(id){const g=D.goals.find(x=>x.id===id);if(g){g.progress=Math.min(100,Math.max(0,Number(document.getElementById('gp-'+id).value)||0));if(g.progress===100)D.wins.push({id:uid(),text:'Completed goal: '+g.name,date:today()});save('✨ Goal updated')}}function deleteGoal(id){D.goals=D.goals.filter(x=>x.id!==id);save('🗑️ Goal removed')}
function wins(){return shell('wins','🏆 LITTLE WINS','Proof that you are doing things.',`<div class="card"><button class="primary" onclick="addWin()">＋ Celebrate another win</button></div>${D.wins.length?[...D.wins].reverse().map(w=>`<div class="eventItem"><span>🏆</span><span class="grow"><b>${esc(w.text)}</b><br><small>${esc(w.date)}</small></span></div>`).join(''):'<div class="empty">🏆 Your wins will live here.</div>'}`)}
function archive(){return shell('archive','🗄️ ARCHIVE','Nothing disappears forever.',`<div class="card"><p class="muted">Archived bills, reminders, events, and completed recurring items stay searchable here.</p>${D.archive.length?[...D.archive].reverse().map(x=>`<div class="eventItem"><span>${x.type==='bill'?'💸':x.type==='reminder'?'🔔':'📌'}</span><span class="grow"><b>${esc(x.title)}</b><br><small>Original date: ${esc(x.date)} • Archived: ${esc(x.archivedAt||'')}</small></span></div>`).join(''):'<div class="empty">🗄️ Archive is empty.</div>'}</div>`)}
function render(){nav();const map={home,planner,tasks,garden,school,money:moneyPage,reminders,brain,wellness,goals,wins,archive};document.getElementById('pages').innerHTML=map[active]();if(active==='planner'){document.querySelectorAll('.day[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()})}}
render();
</script>
</body>
</html>
