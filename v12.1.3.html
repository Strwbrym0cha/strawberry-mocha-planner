<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner V12.1.3 🍓</title><style>html,body{margin:0;width:100%;height:100%;background:#fbf5f2;overflow:hidden}body{overscroll-behavior-y:none}iframe{display:block;width:100%;height:100dvh;min-height:100%;border:0;overflow:auto;overscroll-behavior-y:none;overscroll-behavior-x:none;-webkit-overflow-scrolling:touch;touch-action:pan-y pan-x}</style></head><body><iframe id="shell" src="./v12.1.2.html?scrollfix=1213" title="Strawberry Mocha Planner V12.1.3"></iframe><script>(()=>{const shell=document.getElementById('shell');function tune(){try{const a=shell.contentDocument;if(!a)return;const f=a.getElementById('shell');const targets=[a.documentElement,a.body,f?.contentDocument?.documentElement,f?.contentDocument?.body].filter(Boolean);targets.forEach(x=>{x.style.overscrollBehaviorY='none';x.style.overscrollBehaviorX='none';x.style.webkitOverflowScrolling='touch';});const inner=f?.contentDocument;if(inner){inner.documentElement.style.minHeight='100%';inner.body.style.minHeight='100%';inner.body.style.overflowY='auto';inner.body.style.overflowX='hidden';}}catch(e){}}shell.addEventListener('load',()=>{tune();setTimeout(tune,500);setTimeout(tune,1500)});})();</script></body></html>
