<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4dce7"><title>Strawberry Mocha Planner V13.3 🍓</title><style>html,body{margin:0;width:100%;height:100%;background:#fbf5f2;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;overflow:hidden}</style></head><body><iframe id="app" src="./v13.2.html?goalscute=133" title="Strawberry Mocha Planner V13.3"></iframe><script>(()=>{const f=document.getElementById('app');function boot(){const d=f.contentDocument;if(!d)return;const nav=d.getElementById('nav'),page=d.getElementById('goals');if(!nav||!page)return;const KEY='sm_v10';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const load=()=>{try{return JSON.parse(d.defaultView.localStorage.getItem(KEY)||'{}')}catch(e){return{}}};const save=s=>d.defaultView.localStorage.setItem(KEY,JSON.stringify(s));const V=s=>(s.v12=s.v12||{},s.v12);const style=d.createElement('style');style.textContent='.g33{background:#fff;border:1px solid #eadbd6;border-radius:24px;padding:18px;margin:10px 0;box-shadow:0 12px 35px #67494110}.g33hero{background:linear-gradient(135deg,#fff0f5,#fffaf5);border:1px dashed #e8a7bd;border-radius:22px;padding:18px;margin-top:10px}.g33head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.g33head>div:first-child{flex:1}.g33grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.g33card{background:#fffaf6;border:1px solid #f0dfe3;border-radius:20px;padding:14px;margin:9px 0}.g33top{display:flex;gap:10px;align-items:flex-start}.g33top>div:nth-child(2){flex:1}.g33percent{font-size:12px;font-weight:950;color:#b96c88}.g33meta{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.g33step{background:#fff0f5;border-radius:12px;padding:9px;font-size:12px;margin-top:9px}.g33actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.g33actions button{flex:1}.g33seed{font-size:34px;line-height:1}.g33empty{text-align:center;padding:28px;color:#99817a}.g33ring{width:70px;height:70px;border-radius:50%;background:conic-gradient(#e99ab7 var(--p),#f0e4e6 0);display:grid;place-items:center;flex:none}.g33ring:after{content:'';width:52px;height:52px;background:#fff;border-radius:50%;position:absolute}.g33ring span{position:relative;z-index:1;font-weight:950;color:#b96c88;font-size:11px}@media(max-width:650px){.g33grid{grid-template-columns:1fr}}';d.head.appendChild(style);function render(){const s=load(),g=V(s).goals||[];page.innerHTML='<div class="hero"><div class="ey">✨ GOALS GARDEN</div><h1>Grow the things you want.</h1><p class="muted">Big dreams, tiny steps, visible progress. 🌱</p></div><div class="g33hero"><div class="g33head"><div><div class="ey">🌱 PLANT SOMETHING</div><h2>What are you growing?</h2><p class="muted">Give it a reason, a next step, and a little room to bloom.</p></div><div class="g33seed">🌷</div></div><div class="g33grid"><input id="g33name" class="input" placeholder="Goal"><input id="g33why" class="input" placeholder="Why does this matter?"><input id="g33date" class="input" type="date"><input id="g33next" class="input" placeholder="Next tiny step…"></div><button id="g33add" class="primary" style="margin-top:9px;width:100%">🌱 Plant Goal</button></div><div class="g33"><div class="g33head"><div><div class="ey">🌷 YOUR GOALS</div><h2>Your little goal garden</h2></div><span class="pill">'+g.length+' growing</span></div><div id="g33list"></div></div>';const list=d.getElementById('g33list');list.innerHTML=g.length?g.map((x,i)=>{const p=Math.max(0,Math.min(100,+x.progress||0));const em=['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7];const date=x.deadline?new Date(x.deadline+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';return '<div class="g33card"><div class="g33top"><div class="g33seed">'+em+'</div><div><h3 style="margin:0">'+esc(x.goal||x.name||'Goal')+'</h3>'+(x.why?'<div class="muted">'+esc(x.why)+'</div>':'')+'</div><div class="g33ring" style="--p:'+p+'%"><span>'+p+'%</span></div></div><div class="g33meta">'+(date?'<span class="pill">📅 '+date+'</span>':'')+'<span class="pill">'+(p===100?'🌸 Bloomed!':'🌱 Growing')+'</span></div><div class="progress"><i style="width:'+p+'%"></i></div><div class="g33actions"><button data-up="'+i+'">＋10%</button><button data-down="'+i+'">−10%</button><button data-archive="'+i+'">🗄️ Archive</button></div><div class="g33step">'+(x.next||x.step?'🌱 Next: '+esc(x.next||x.step):'✨ Choose one tiny next step.')+'</div></div>'}).join(''):'<div class="g33empty">🌱 Nothing planted yet.<br>Give future-you one tiny thing to grow. ♡</div>';d.getElementById('g33add').onclick=()=>{const name=d.getElementById('g33name').value.trim();if(!name)return;const s=load();V(s).goals=V(s).goals||[];V(s).goals.push({goal:name,why:d.getElementById('g33why').value.trim(),deadline:d.getElementById('g33date').value,next:d.getElementById('g33next').value.trim(),progress:0,createdAt:new Date().toISOString()});save(s);render()};list.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const s=load(),x=V(s).goals[+b.dataset.up];x.progress=Math.min(100,(+x.progress||0)+10);save(s);render()});list.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const s=load(),x=V(s).goals[+b.dataset.down];x.progress=Math.max(0,(+x.progress||0)-10);save(s);render()});list.querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>{const s=load(),v=V(s),x=v.goals.splice(+b.dataset.archive,1)[0];v.archive=v.archive||[];v.archive.push({type:'goal',item:x,archivedAt:new Date().toISOString()});save(s);render()})}render();nav.querySelectorAll('button[data-page="goals"]').forEach(b=>b.addEventListener('click',()=>setTimeout(render,40)));}f.addEventListener('load',()=>setTimeout(boot,150));})();</script></body></html>
