<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner V12.1.9 🍓</title><style>html,body{margin:0;width:100%;height:100%;background:#fbf5f2;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;overflow:hidden}</style></head><body><iframe id="root" src="./v12.1.8.html?gardenprogress=1219" title="Strawberry Mocha Planner V12.1.9"></iframe><script>(()=>{const root=document.getElementById('root'),HIST='sm_habit_history';function findPlanner(doc){if(!doc)return null;const p=doc.getElementById('plannerFrame');if(p&&p.contentDocument)return p.contentDocument;for(const f of [...doc.querySelectorAll('iframe')])if(f.contentDocument){const x=findPlanner(f.contentDocument);if(x)return x}return null}function boot(){const d=findPlanner(root.contentDocument);if(!d)return false;const home=d.getElementById('home');if(!home)return false;const box=home.querySelector('.garden');if(!box)return false;if(d.getElementById('v1219style'))return true;const st=d.createElement('style');st.id='v1219style';st.textContent='.v1219-garden{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;min-height:185px}.v1219-plant{background:#fffaf6;border:1px solid #eadbd6;border-radius:18px;padding:10px;text-align:center}.v1219-emoji{font-size:42px;line-height:1;display:block}.v1219-name{font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v1219-meta{font-size:9px;color:#99817a;margin-top:3px}.v1219-bar{height:6px;background:#f0e4e6;border-radius:99px;overflow:hidden;margin-top:6px}.v1219-bar i{display:block;height:100%;background:#e99ab7;border-radius:99px}.v1219-empty{text-align:center;grid-column:1/-1;padding:35px 10px;color:#99817a}.v1219-footer{grid-column:1/-1;font-size:11px;color:#99817a;text-align:center;margin-top:2px}';d.head.appendChild(st);function render(){let hist={};try{hist=JSON.parse(d.defaultView.localStorage.getItem(HIST)||'{}')}catch(e){};const all=Object.values(hist||{}),today=new Date().toISOString().slice(0,10);box.innerHTML='<div class="v1219-garden">'+(all.length?all.map((h,i)=>{const days=h.days||{},week=Object.keys(days).filter(k=>days[k]&&k>=weekStart()).length,pct=Math.min(100,Math.round(week/7*100)),emoji=['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7];return '<div class="v1219-plant"><span class="v1219-emoji">'+esc(h.name?emoji:'🌱')+'</span><div class="v1219-name">'+esc(h.name)+'</div><div class="v1219-meta">'+week+'/7 this week'+(days[today]?' • ✓ today':'')+'</div><div class="v1219-bar"><i style="width:'+pct+'%"></i></div></div>'}).join('')+'<div class="v1219-footer">🌷 Live from your Habit Garden • '+all.filter(h=>(h.days||{})[today]).length+'/'+all.length+' watered today</div>':'<div class="v1219-empty">🌱 Your garden is waiting for its first habit.<br>Plant one in the Garden tab and it will grow here too. ♡</div>')+'</div>';const pct=all.length?Math.round(all.reduce((n,h)=>{const ds=h.days||{};return n+Object.keys(ds).filter(k=>ds[k]&&k>=weekStart()).length},0)/(all.length*7)*100):0;const hh=d.getElementById('hh'),hr=d.getElementById('hr');if(hh)hh.textContent=pct+'%';if(hr){hr.style.setProperty('--pct',pct+'%');const sp=hr.querySelector('span');if(sp)sp.textContent=pct+'%'}}function weekStart(){const x=new Date();x.setHours(12,0,0,0);x.setDate(x.getDate()-x.getDay());return x.toISOString().slice(0,10)}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();const nav=d.getElementById('nav');if(nav)nav.addEventListener('click',e=>{const btn=e.target.closest('button[data-page]');if(btn&&btn.dataset.page==='home')setTimeout(render,60)},false);return true}root.addEventListener('load',()=>{setTimeout(boot,500);setTimeout(boot,1500);setTimeout(boot,3000)});setTimeout(boot,1200)})();</script></body></html>
