<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner V12.1.8 🍓</title><style>html,body{margin:0;width:100%;height:100%;background:#fbf5f2;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;overflow:hidden}</style></head><body><iframe id="root" src="./v12.1.7.html?reminderfix=1218" title="Strawberry Mocha Planner V12.1.8"></iframe><script>(()=>{const root=document.getElementById('root');const KEY='sm_v10';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function findPlanner(doc){if(!doc)return null;const p=doc.getElementById('plannerFrame');if(p&&p.contentDocument)return p.contentDocument;for(const f of [...doc.querySelectorAll('iframe')])if(f.contentDocument){const x=findPlanner(f.contentDocument);if(x)return x}return null}function boot(){const d=findPlanner(root.contentDocument);if(!d)return false;let rp=d.getElementById('reminders');if(!rp)return false;if(d.getElementById('v1218style'))return true;const st=d.createElement('style');st.id='v1218style';st.textContent='.v1218-card{background:#fff;border:1px solid #eadbd6;border-radius:23px;padding:18px;margin:10px 0;box-shadow:0 12px 35px #67494110}.v1218-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.v1218-row>*{flex:1}.v1218-list{margin-top:12px}.v1218-item{background:#fffaf6;border:1px solid #f0dfe3;border-radius:18px;padding:12px;margin:8px 0}.v1218-item.done{opacity:.6}.v1218-actions{display:flex;gap:7px;margin-top:9px}.v1218-actions button{flex:1}.v1218-empty{color:#99817a;padding:10px 0}.v1218-filter{display:flex;gap:7px;overflow:auto;margin-top:12px}.v1218-filter button{white-space:nowrap}.v1218-filter .active{background:#fff0f5;border-color:#efbfd0;color:#b96c88}';d.head.appendChild(st);function render(){rp=d.getElementById('reminders');if(!rp)return;let s={};try{s=JSON.parse(d.defaultView.localStorage.getItem(KEY)||'{}')}catch(e){};s.v12=s.v12||{};s.v12.reminders=s.v12.reminders||[];const arr=s.v12.reminders;rp.dataset.v1218='ready';rp.innerHTML='<div class="v1218-card"><div class="v1218-row"><div><div class="ey">🔔 REMINDERS</div><h1>Little things, remembered. ♡</h1><p class="muted">Add reminders, check them off, and archive what you no longer need.</p></div><button id="v1218Add" class="primary">＋ Add Reminder</button></div><div class="v1218-filter"><button class="active" data-f="all">All</button><button data-f="today">Today</button><button data-f="upcoming">Upcoming</button><button data-f="done">Completed</button></div><div id="v1218List" class="v1218-list"></div></div>';let filter='all';const list=()=>{const today=new Date().toISOString().slice(0,10);let a=arr.slice();if(filter==='today')a=a.filter(x=>x.date===today&&!x.done);if(filter==='upcoming')a=a.filter(x=>x.date>today&&!x.done);if(filter==='done')a=a.filter(x=>x.done);const box=d.getElementById('v1218List');box.innerHTML=a.length?a.map(x=>'<div class="v1218-item '+(x.done?'done':'')+'"><div class="v1218-row"><button data-t="'+esc(x.id)+'">'+(x.done?'✓':'○')+'</button><b>'+esc(x.text)+'</b><span class="pill">'+esc(x.date||'No date')+'</span><button data-x="'+esc(x.id)+'">×</button></div></div>').join(''):'<div class="v1218-empty">No reminders yet. Add one above. ♡</div>';box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const x=arr.find(q=>q.id===b.dataset.t);if(x){x.done=!x.done;d.defaultView.localStorage.setItem(KEY,JSON.stringify(s));list()}});box.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const i=arr.findIndex(q=>q.id===b.dataset.x);if(i>=0){s.v12.archive=s.v12.archive||[];s.v12.archive.push({type:'reminder',item:arr.splice(i,1)[0],archivedAt:new Date().toISOString()});d.defaultView.localStorage.setItem(KEY,JSON.stringify(s));list()}})};d.getElementById('v1218Add').onclick=()=>{const f=d.createElement('div');f.className='v1218-row';f.style.marginTop='10px';f.innerHTML='<input id="v1218Text" class="input" placeholder="Reminder"><input id="v1218Date" class="input" type="date"><button id="v1218Save" class="primary">Save</button>';rp.querySelector('.v1218-card').appendChild(f);d.getElementById('v1218Save').onclick=()=>{const text=d.getElementById('v1218Text').value.trim();if(!text)return;arr.push({id:'r_'+Date.now(),text,date:d.getElementById('v1218Date').value||new Date().toISOString().slice(0,10),done:false});d.defaultView.localStorage.setItem(KEY,JSON.stringify(s));f.remove();list()}};rp.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{rp.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;list()});list()}render();const obs=new MutationObserver(()=>{const current=d.getElementById('reminders');if(current&&!current.dataset.v1218)render()});obs.observe(d.body,{subtree:true,childList:true});setTimeout(render,300);setTimeout(render,1000);setTimeout(render,2500);return true}root.addEventListener('load',()=>{setTimeout(boot,500);setTimeout(boot,1500);setTimeout(boot,3000)});setTimeout(boot,1200)})();</script></body></html>
