<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner V12.1.6 🍓</title><style>html,body{margin:0;width:100%;height:100%;background:#fbf5f2;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;overflow:hidden}</style></head><body><iframe id="root" src="./v12.1.5.html?targetfix=1216" title="Strawberry Mocha Planner V12.1.6"></iframe><script>(()=>{const root=document.getElementById('root');const KEY='sm_v10';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const load=d=>{try{return JSON.parse(d.defaultView.localStorage.getItem(KEY)||'{}')}catch(e){return{}}};const save=(d,s)=>d.defaultView.localStorage.setItem(KEY,JSON.stringify(s));const state=s=>(s.v12=s.v12||{},s.v12);const toast=(d,t)=>{const x=d.getElementById('toast');if(x){x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1600)}};function findPlanner(doc){if(!doc)return null;const direct=doc.getElementById('plannerFrame');if(direct&&direct.contentDocument)return direct.contentDocument;for(const f of [...doc.querySelectorAll('iframe')]){if(f.contentDocument){const hit=findPlanner(f.contentDocument);if(hit)return hit}}return null}function addStyle(d){if(d.getElementById('v1216style'))return;const s=d.createElement('style');s.id='v1216style';s.textContent='.v1216-card{background:#fff;border:1px solid #eadbd6;border-radius:22px;padding:18px;margin:12px 0}.v1216-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.v1216-list{margin-top:12px}.v1216-item{background:#fffaf6;border:1px solid #f0dfe3;border-radius:18px;padding:12px;margin:8px 0}.v1216-item.done{opacity:.6}.v1216-actions{display:flex;gap:7px;margin-top:9px}.v1216-actions button{flex:1}.v1216-garden{background:linear-gradient(#fffaf6 0 58%,#ead8cc 58%);border-radius:24px;border:1px solid #eadbd6;padding:18px;min-height:330px}.v1216-plants{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.v1216-plant{background:#fffaf6;border:1px solid #f0dfe3;border-radius:20px;padding:12px;text-align:center}.v1216-plant .emoji{font-size:42px}.v1216-plant b{display:block}.v1216-plant small{color:#99817a}.v1216-form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}@media(max-width:700px){.v1216-plants{grid-template-columns:repeat(2,1fr)}.v1216-form{grid-template-columns:1fr}}';d.head.appendChild(s)}function build(d){const rp=d.getElementById('reminders'),gp=d.getElementById('garden');if(!rp||!gp)return false;addStyle(d);rp.innerHTML='<div class="v1216-card"><div class="v1216-row"><div style="flex:1"><div class="ey">🔔 REMINDERS</div><h1>Little things, remembered. ♡</h1><p class="muted">Add reminders, check them off, and archive what you no longer need.</p></div><button id="v1216AddR" class="primary">＋ Add Reminder</button></div><div class="v1216-row" style="margin-top:12px"><button data-rf="all">All</button><button data-rf="today">Today</button><button data-rf="upcoming">Upcoming</button><button data-rf="done">Completed</button></div><div id="v1216RL" class="v1216-list"></div></div>';let rf='all';const rr=()=>{let s=load(d),a=state(s).reminders||[],today=new Date().toISOString().slice(0,10);if(rf==='today')a=a.filter(x=>x.date===today&&!x.done);if(rf==='upcoming')a=a.filter(x=>x.date>today&&!x.done);if(rf==='done')a=a.filter(x=>x.done);const box=d.getElementById('v1216RL');box.innerHTML=a.length?a.map(x=>'<div class="v1216-item '+(x.done?'done':'')+'"><div class="v1216-row"><button data-rt="'+esc(x.id)+'">'+(x.done?'✓':'○')+'</button><b style="flex:1">'+esc(x.text)+'</b><span class="pill">'+esc(x.date||'No date')+'</span><button data-rx="'+esc(x.id)+'">×</button></div></div>').join(''):'<p class="muted">No reminders yet. Add one above. ♡</p>';box.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{let s=load(d),x=(state(s).reminders||[]).find(q=>q.id===b.dataset.rt);if(x){x.done=!x.done;save(d,s);rr()}});box.querySelectorAll('[data-rx]').forEach(b=>b.onclick=()=>{let s=load(d),a=state(s).reminders||[],i=a.findIndex(q=>q.id===b.dataset.rx);if(i>=0){state(s).archive=state(s).archive||[];state(s).archive.push({type:'reminder',item:a.splice(i,1)[0],archivedAt:new Date().toISOString()});save(d,s);rr();toast(d,'Reminder archived 🗄️')}})};d.getElementById('v1216AddR').onclick=()=>{const f=d.createElement('div');f.className='v1216-form';f.innerHTML='<input id="v1216RT" class="input" placeholder="Reminder"><input id="v1216RD" class="input" type="date"><button id="v1216RS" class="primary">Save</button>';rp.querySelector('.v1216-card').appendChild(f);d.getElementById('v1216RS').onclick=()=>{const text=d.getElementById('v1216RT').value.trim(),date=d.getElementById('v1216RD').value||new Date().toISOString().slice(0,10);if(!text){toast(d,'Name the reminder first 🔔');return}let s=load(d);state(s).reminders=state(s).reminders||[];state(s).reminders.push({id:'r_'+Date.now(),text,date,done:false});save(d,s);f.remove();rr();toast(d,'Reminder saved 🔔')}};rp.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{rp.querySelectorAll('[data-rf]').forEach(x=>x.classList.remove('active'));b.classList.add('active');rf=b.dataset.rf;rr()});rr();gp.innerHTML='<div class="hero"><div class="ey">🌷 HABIT GARDEN</div><h1>Grow what matters.</h1><p class="muted">A clean little garden for the habits you actually want to keep.</p></div><div class="v1216-card"><div class="v1216-row"><div style="flex:1"><h2>🌱 Your garden</h2><p class="muted">Check in today. Remove a habit with × whenever it stops fitting your life.</p></div><button id="v1216AddH" class="primary">＋ Plant Habit</button></div><div id="v1216GL" class="v1216-garden"></div></div>';const gr=()=>{let s=load(d),a=state(s).gardenHabits||[],today=new Date().toISOString().slice(0,10),box=d.getElementById('v1216GL');box.innerHTML='<div class="v1216-plants">'+(a.length?a.map((h,i)=>{const days=h.days||[],ok=days.includes(today),pct=Math.min(100,Math.round(((days.length%7)||0)/7*100));return '<div class="v1216-plant"><div class="emoji">'+esc(h.emoji||'🌷')+'</div><b>'+esc(h.name)+'</b><small>'+days.length+' check-ins</small><div style="height:6px;background:#f0e4e6;border-radius:99px;margin:8px 0;overflow:hidden"><i style="display:block;height:100%;width:'+pct+'%;background:#e99ab7"></i></div><div class="v1216-actions"><button data-hc="'+i+'" class="'+(ok?'primary':'')+'">'+(ok?'✓ Today':'＋ Today')+'</button><button data-hx="'+i+'">×</button></div></div>'}).join(''):'<div class="v1216-plant"><div class="emoji">🌱</div><b>Your garden is waiting.</b><small>Plant your first habit above.</small></div>')+'</div>';box.querySelectorAll('[data-hc]').forEach(b=>b.onclick=()=>{let s=load(d),h=state(s).gardenHabits[+b.dataset.hc],days=h.days||[],i=days.indexOf(today);i>=0?days.splice(i,1):days.push(today);h.days=days;save(d,s);gr()});box.querySelectorAll('[data-hx]').forEach(b=>b.onclick=()=>{let s=load(d),a=state(s).gardenHabits||[],h=a.splice(+b.dataset.hx,1)[0];state(s).archive=state(s).archive||[];state(s).archive.push({type:'habit',item:h,archivedAt:new Date().toISOString()});save(d,s);gr();toast(d,'Habit archived 🗄️')})};d.getElementById('v1216AddH').onclick=()=>{const f=d.createElement('div');f.className='v1216-form';f.innerHTML='<input id="v1216HN" class="input" placeholder="Habit"><input id="v1216HE" class="input" placeholder="Emoji e.g. 🌷"><button id="v1216HS" class="primary">Plant</button>';gp.querySelector('.v1216-card').appendChild(f);d.getElementById('v1216HS').onclick=()=>{const name=d.getElementById('v1216HN').value.trim();if(!name){toast(d,'Name the habit first 🌱');return}let s=load(d);state(s).gardenHabits=state(s).gardenHabits||[];state(s).gardenHabits.push({id:'h_'+Date.now(),name,emoji:d.getElementById('v1216HE').value.trim()||'🌷',days:[]});save(d,s);f.remove();gr();toast(d,'Habit planted 🌱')}};gr();return true}function boot(){const d=findPlanner(root.contentDocument);if(!d)return false;return build(d)}root.addEventListener('load',()=>{setTimeout(boot,500);setTimeout(boot,1500);setTimeout(boot,3000)});setTimeout(boot,1500)})();</script></body></html>
