<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner • V17 Lab</title><link rel="stylesheet" href="./styles.css"></head><body><div id="app" class="v17-app"><div id="tab-root"><section class="v17-card"><h1>🍓 Strawberry Mocha V17</h1><p class="v17-muted">Loading your planner…</p></section></div></div><script type="module">import{createApp}from'./app/app.js';import{renderHome}from'./tabs/home.js';const root=document.getElementById('tab-root');const modules={home:renderHome};const queued=new Set(['planner','tasks','garden','school','money','reminders','brain','wellness','goals','wins','archive']);async function loadModule(page){if(modules[page])return modules[page];if(!queued.has(page))return null;try{const mod=await import(`./tabs/${page}.js?v=17.2`);modules[page]=mod[`render${page[0].toUpperCase()+page.slice(1)}`];return modules[page]||null}catch(error){root.innerHTML=`<section class="v17-card"><h1>🍓 ${page}</h1><p class="v17-muted">This V17 tab is being connected. The rest of your planner is still safe.</p><details><summary>Technical details</summary><pre style="white-space:pre-wrap;overflow:auto;font-size:11px">${String(error?.message||error)}</pre></details></section>`;return null}}async function renderTab(page,ctx){root.innerHTML='<section class="v17-card"><h1>🍓 Loading…</h1></section>';const render=await loadModule(page);if(render)render(ctx);else if(!queued.has(page))root.innerHTML=`<section class="v17-card"><h1>🍓 ${page}</h1><p class="v17-muted">This tab is queued for the next V17 migration pass.</p></section>`}createApp({root,renderTab});</script></body></html>
