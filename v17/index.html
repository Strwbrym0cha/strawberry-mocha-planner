  <link rel="stylesheet" href="../v5/styles.css?v=5.4.3-sidebar-serif">

</head>
<body>
  <div id="app" class="katos v17-app">
    <aside id="v5-sidebar" class="sidebar" aria-label="KatOS V5 navigation"></aside>
    <button id="v5-sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation" hidden></button>
    <header id="v5-topbar" class="topbar"></header>
    <main class="main v21-main"><div id="tab-root"><section class="v17-card"><p class="v17-eyebrow">KATOS V5 • LIFE OS</p><h1>🍓 Loading KatOS…</h1><p class="v17-muted">Opening your life OS safely.</p></section></div></main>
  </div>
  <script src="./v20-popup.js?v=22.0.1-20260816"></script>
  <script type="module">
    const BUILD='V5.6.0-2026-09-02';
    const moduleSuffix=location.protocol==='file:'?'':'?build='+encodeURIComponent(BUILD);
    const root=document.getElementById('tab-root'),sidebar=document.getElementById('v5-sidebar'),topbar=document.getElementById('v5-topbar'),sidebarBackdrop=document.getElementById('v5-sidebar-backdrop');
    const groups=[['TODAY',[['home','🏠','Home'],['planner','📅','Calendar'],['tasks','📝','Daily Shit'],['mochini','🍡','Mochini']]],['LIFE',[['work','💼','Work HQ'],['school','🎓','Study Nook'],['money','☕','Money Café'],['movement','🏃','Get Movin'],['hobbies','🎨','Hobby Shelf'],['growth','🌱','Growth']]],['COZY',[['noms','🍱','Noms'],['sips','💧','Sips'],['brain','🧠','Catch-All'],['wellness','🌸','Wellness']]],['MORE',[['goals','🌙','Dreamscape'],['projects','🗂','Projects'],['labs','🔬','Kat Labs'],['wins','🏆','Wins']]],['SYSTEM',[['settings','⚙️','Settings'],['hub','✨','KatOS Hub']]]];
    const labels=Object.fromEntries(groups.flatMap(group=>group[1].map(item=>[item[0],item[2]])));Object.assign(labels,{archive:'Archive'});
    const queued=new Set(Object.keys(labels));let modules={},routerRef=null,visualMode=localStorage.getItem('katos_v5_visual_mode')||'normal';
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function navHTML(page){return '<div class="brand"><div class="brand-row"><div class="berry">🍓</div><div><h1>KatOS V5</h1><div class="scribble">pretty, smart, and nosy enough</div></div></div><span class="build">V5 • LIFE OS</span></div><nav class="nav">'+groups.map(([title,items])=>'<section class="nav-group"><div class="nav-label">'+title+'</div>'+items.map(([key,icon,label])=>'<button type="button" class="nav-btn '+(key===page?'active':'')+'" data-nav="'+key+'"><span class="nav-icon">'+icon+'</span><span>'+label+' <em data-nav-meta="'+key+'"></em></span></button>').join('')+'</section>').join('')+'<section class="nav-group"><div class="nav-label">KEEPSAKES</div><button type="button" class="nav-btn '+(page==='archive'?'active':'')+'" data-nav="archive"><span class="nav-icon">📦</span><span>Archive</span></button></section></nav><div class="sidebar-foot"><b>KatOS V5</b><br>Your personal life OS. 🍓</div>'}
    function topbarHTML(page){return '<button type="button" class="btn menu" data-shell-action="toggle-sidebar" aria-label="Open navigation">☰</button><div class="top-title">'+esc(labels[page]||'KatOS V5')+'</div><div class="top-spacer"></div><div class="mode-switch" aria-label="Energy mode"><button type="button" class="mode-btn '+(visualMode==='normal'?'active':'')+'" data-mode="normal">🍓 <span>Normal</span></button><button type="button" class="mode-btn '+(visualMode==='tiny'?'active':'')+'" data-mode="tiny">🫧 <span>Tiny</span></button><button type="button" class="mode-btn '+(visualMode==='power'?'active':'')+'" data-mode="power">⚡ <span>Power</span></button></div>'}
    function localDateKey(){const date=new Date();return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
    function refreshMeta(){const store=window.__smStore;if(!store)return;const data=store.get(),today=localDateKey(),tasks=(data.tasks||[]).filter(task=>(!task.date||task.date===today)&&!task.done).length,events=(data.events||[]).filter(event=>event.date===today).length;sidebar.querySelector('[data-nav-meta="tasks"]')?.replaceChildren(document.createTextNode(tasks?`• ${tasks} remaining`:'• all clear'));sidebar.querySelector('[data-nav-meta="planner"]')?.replaceChildren(document.createTextNode(events?`• ${events} today`:'• no events'))}
    function setVisualMode(mode){visualMode=['normal','tiny','power'].includes(mode)?mode:'normal';localStorage.setItem('katos_v5_visual_mode',visualMode);document.body.classList.remove('mode-normal','mode-tiny','mode-power');document.body.classList.add('mode-'+visualMode);topbar.querySelectorAll('[data-mode]').forEach(button=>button.classList.toggle('active',button.dataset.mode===visualMode))}
    function closeSidebar(){sidebar.classList.remove('open');sidebarBackdrop.hidden=true}
    function buildNav(page){sidebar.innerHTML=navHTML(page);topbar.innerHTML=topbarHTML(page);sidebar.querySelectorAll('[data-nav]').forEach(button=>button.addEventListener('click',()=>{closeSidebar();routerRef?.go(button.dataset.nav)}));topbar.querySelector('[data-shell-action="toggle-sidebar"]')?.addEventListener('click',()=>{sidebar.classList.add('open');sidebarBackdrop.hidden=false});topbar.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>setVisualMode(button.dataset.mode)));setVisualMode(visualMode);setTimeout(refreshMeta,0)}
    function normalizeRenderedBranding(){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode())node.nodeValue=node.nodeValue.replace(/KATOS V2\b/gi,'KATOS V5')}
    function errorScreen(title,error){root.innerHTML='<section class="v17-card"><p class="v17-eyebrow">KATOS V5 • SAFE MODE</p><h1>🍓 '+esc(title)+'</h1><p class="v17-muted">The KatOS shell loaded, but this tab could not start. Your existing planner data is safe.</p><details open><summary>Technical details</summary><pre style="white-space:pre-wrap;overflow:auto;font-size:11px">'+esc(error?.message||error||'Unknown error')+'</pre></details></section>'}
    async function loadModule(page){if(modules[page])return modules[page];if(!queued.has(page))return null;const path=page==='home'?'home-v22.js':page==='planner'?'planner-v18.js':page==='school'?'school-v18.js':page+'.js';try{const module=await Promise.race([import('./tabs/'+path+moduleSuffix),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timed out loading '+page)),10000))]);const name='render'+page[0].toUpperCase()+page.slice(1);if(typeof module[name]!=='function')throw new Error('Missing export '+name+' in '+path);modules[page]=module[name];return modules[page]}catch(error){errorScreen(labels[page]||page,error);return null}}
    async function renderTab(page,context){buildNav(page);root.innerHTML='<section class="v17-card"><p class="v17-eyebrow">KATOS V5 • LIFE OS</p><h1>🍓 Loading KatOS…</h1><p class="v17-muted">Opening '+esc(labels[page]||page)+'…</p></section>';try{const render=await loadModule(page);if(render)await render(context);normalizeRenderedBranding()}catch(error){errorScreen(labels[page]||page,error)}}
    async function start(){try{sidebarBackdrop.addEventListener('click',closeSidebar);const appModule=await import('./app/app.js'+moduleSuffix);const app=appModule.createApp({root,renderTab});routerRef=app.router;window.__smStore=app.store;document.documentElement.dataset.smBuild=BUILD;document.title='KatOS V5';buildNav(routerRef.page);app.store?.subscribe(refreshMeta)}catch(error){errorScreen('KatOS V5 could not start',error)}}
    start();
  </script>
</body>
</html>
