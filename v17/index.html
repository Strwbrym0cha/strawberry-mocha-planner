<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf5f2"><title>Strawberry Mocha Planner • V17 Lab</title><link rel="stylesheet" href="./styles.css"></head><body><div id="app" class="v17-app"><div id="tab-root"></div></div><script type="module">import { createApp } from './app/app.js';import { renderHome } from './tabs/home.js';const root=document.getElementById('tab-root');const modules={home:renderHome};function renderTab(page,ctx){root.innerHTML='';const render=modules[page];if(render){render(ctx)}else{root.innerHTML=`<section class="v17-card"><h1>🍓 ${page}</h1><p class="v17-muted">This tab is queued for the next V17 migration pass.</p></section>`}}createApp({root,renderTab});</script></body></html>
