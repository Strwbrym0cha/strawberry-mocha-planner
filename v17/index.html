<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf5f2"><title>Strawberry Mocha Planner • V17 Lab</title><link rel="stylesheet" href="./styles.css"></head><body><div id="app" class="v17-app"><nav class="v17-nav"><button data-page="home">🏠 Home</button><button data-page="planner">📅 Planner</button><button data-page="tasks">📝 Tasks</button><button data-page="garden">🌷 Garden</button><button data-page="school">🎀 School</button><button data-page="money">☕ Money</button><button data-page="reminders">🔔 Reminders</button><button data-page="brain">📝 Brain</button><button data-page="wellness">🌸 Wellness</button><button data-page="goals">✨ Goals</button><button data-page="wins">🏆 Wins</button><button data-page="archive">🗄️ Archive</button></nav><div id="tab-root"></div></div><script type="module">import { createApp } from './app/app.js';import { renderHome } from './tabs/home.js';import { renderPlanner } from './tabs/planner.js';const root=document.getElementById('tab-root');const modules={home:renderHome,planner:renderPlanner};function renderTab(page,ctx){root.innerHTML='';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const render=modules[page];if(render){render(ctx)}else{root.innerHTML=`<section class="v17-card"><h1>🍓 ${page}</h1><p class="v17-muted">This tab is queued for the next V17 migration pass.</p></section>`}}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.page}));createApp({root,renderTab});</script></body></html>
