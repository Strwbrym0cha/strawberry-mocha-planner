<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff4fa"><title>Strawberry Mocha Planner • V20</title><link rel="stylesheet" href="./styles.css?v=20.12"><link rel="stylesheet" href="./v20-skin.css?v=20.12"><link rel="stylesheet" href="./v20-modal-stability.css?v=20.12"><link rel="stylesheet" href="./v20-shell.css?v=20.12"><style>.v20-dialog{border:0;padding:0;margin:0;max-width:none;max-height:none;background:transparent;color:inherit;overflow:visible}.v20-dialog::backdrop{background:rgba(73,50,45,.24);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}dialog.v17-modal,dialog.v18-event-modal{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;padding:16px!important;margin:0!important;border:0!important;background:rgba(73,50,45,.24)!important;overflow:hidden!important;z-index:auto!important}dialog.v17-modal>.v17-modal-box,dialog.v18-event-modal>.v18-event-modal-box{position:absolute!important;top:50%!important;left:50%!important;transform:translate(-50%,-50%)!important;margin:0!important;max-height:calc(100svh - 32px)!important;overflow:auto!important}</style></head><body><div id="app" class="v17-app"><nav id="v17-nav" class="v17-nav" aria-label="Planner tabs"></nav><div id="tab-root"><section class="v17-card"><h1>🍓 Strawberry Mocha V20</h1><span class="v18-badge">V20 • FULL REDESIGN ✦</span><p class="v17-muted">Loading your pretty planner…</p></section></div><nav id="v17-bottom-nav" class="v17-bottom-nav" aria-label="Planner tabs"></nav></div><script src="./v20-modal-adapter.js?v=20.12"></script><script type="module">const root=document.getElementById('tab-root'),nav=document.getElementById('v17-nav'),bottom=document.getElementById('v17-bottom-nav');const labels={home:'🏠 Home',planner:'📅 Planner',tasks:'📝 Tasks',garden:'🌷 Garden',school:'🎓 School',money:'☕ Money',reminders:'🔔 Reminders',brain:'🧠 Brain',wellness:'🌸 Wellness',goals:'✨ Goals',wins:'🏆 Wins',archive:'🗄 Archive'};const queued=new Set(Object.keys(labels));let modules={},routerRef=null;const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function errorScreen(title,error){root.innerHTML='<section class="v17-card"><h1>🍓 '+esc(title)+'</h1><span class="v18-badge">V20 • FULL REDESIGN ✦</span><p class="v17-muted">V20 loaded, but this tab could not start. Your existing planner data is safe.</p><details open><summary>Technical details</summary><pre style="white-space:pre-wrap;overflow:auto;font-size:11px">'+esc(error?.message||error||'Unknown error')+'</pre></details></section>'}function navHTML(page){return Object.entries(labels).map(([key,label])=>'<button type="button" class="'+(key===page?'active':'')+'" data-nav="'+key+'" aria-label="'+label+'">'+label+'</button>').join('')}function buildNav(page){const html=navHTML(page);nav.innerHTML=html;bottom.innerHTML=html}const navClick=e=>{const b=e.target.closest('[data-nav]');if(b&&routerRef)routerRef.go(b.dataset.nav)};nav.addEventListener('click',navClick);bottom.addEventListener('click',navClick);async function loadModule(page){if(modules[page])return modules[page];if(!queued.has(page))return null;const path=page==='planner'?'planner-v18.js':page==='school'?'school-v18.js':page+'.js';const url='./tabs/'+path+'?v=20.12';try{const mod=await Promise.race([import(url),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timed out loading '+page)),10000))]);const name='render'+page[0].toUpperCase()+page.slice(1);if(typeof mod[name]!=='function')throw new Error('Missing export '+name+' in '+path);modules[page]=mod[name];return modules[page]}catch(error){errorScreen(labels[page]||page,error);return null}}async function renderTab(page,ctx){buildNav(page);root.innerHTML='<section class="v17-card"><h1>🍓 Loading V20…</h1><p class="v17-muted">Opening '+esc(labels[page]||page)+'…</p></section>';try{const render=await loadModule(page);if(render)await render(ctx)}catch(error){errorScreen(labels[page]||page,error)}}async function start(){try{const appMod=await import('./app/app.js?v=20.12');const app=appMod.createApp({root,renderTab});routerRef=app.router;buildNav(routerRef.page)}catch(error){errorScreen('V20 could not start',error)}}start();</script></body></html>
