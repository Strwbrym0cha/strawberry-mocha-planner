<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf5f2"><title>Strawberry Mocha Planner • V17 Lab</title><link rel="stylesheet" href="./styles.css"></head><body><div id="app" class="v17-app"><div id="tab-root"><section class="v17-card"><h1>🍓 Strawberry Mocha V17</h1><p class="v17-muted">Loading your planner…</p></section></div></div><script type="module">const root=document.getElementById('tab-root');const queued=new Set(['home','planner','tasks','garden','school','money','reminders','brain','wellness','goals','wins','archive']);const errorBox=(title,error)=>{root.innerHTML=`<section class="v17-card"><h1>🍓 ${title}</h1><p class="v17-muted">V17 is connected, but this module hit an error while loading. Your existing planner data is not being changed.</p><details><summary>Technical details</summary><pre style="white-space:pre-wrap;overflow:auto;font-size:11px">${String(error?.stack||error?.message||error)}</pre></details></section>`};async function boot(){try{const app=await import('./app/app.js?v=17.2');const renderTab=async(page,ctx)=>{root.innerHTML='<section class="v17-card"><h1>🍓 Loading…</h1></section>';if(!queued.has(page)){root.innerHTML=`<section class="v17-card"><h1>🍓 ${page}</h1><p class="v17-muted">This tab is queued for the next V17 migration pass.</p></section>`;return}try{const mod=await import(`./tabs/${page}.js?v=17.2`);const fn=mod[`render${page[0].toUpperCase()+page.slice(1)}`];if(typeof fn!=='function')throw new Error(`Missing renderer: render${page[0].toUpperCase()+page.slice(1)}`);fn(ctx)}catch(error){errorBox(page,error)}};app.createApp({root,renderTab})}catch(error){errorBox('V17 could not start',error)}}boot();</script></body></html>
