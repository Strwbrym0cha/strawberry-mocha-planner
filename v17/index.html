<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fb"><title>Strawberry Mocha Planner • V19</title><link rel="stylesheet" href="./styles.css?v=19.2"><link rel="stylesheet" href="./v18-theme.css?v=19.2"><link rel="stylesheet" href="./v18-modal-fix.css?v=19.2"><link rel="stylesheet" href="./school-polish.css?v=19.2"><link rel="stylesheet" href="./all-pages-polish.css?v=19.2"><link rel="stylesheet" href="./routine-modal-polish.css?v=19.2"><link rel="stylesheet" href="./v19-skin.css?v=19.2"></head><body><div id="app" class="v17-app"><nav id="v17-nav" class="v17-nav" aria-label="Planner tabs"></nav><div id="tab-root"><section class="v17-card"><h1>🍓 Strawberry Mocha V19</h1><span class="v18-badge">V19 • STRAWBERRY MOCHA SKIN ✦</span><p class="v17-muted">Loading your planner…</p></section></div></div><nav id="v17-bottom-nav" class="v17-bottom-nav" aria-label="Planner tabs"></nav><script type="module">const root=document.getElementById('tab-root'),nav=document.getElementById('v17-nav'),bottom=document.getElementById('v17-bottom-nav');const labels={home:'🏠 Home',planner:'📅 Planner',tasks:'📝 Tasks',garden:'🌷 Garden',school:'🎓 School',money:'☕ Money',reminders:'🔔 Reminders',brain:'🧠 Brain',wellness:'🌸 Wellness',goals:'✨ Goals',wins:'🏆 Wins',archive:'🗄 Archive'};const queued=new Set(Object.keys(labels));let modules={},routerRef=null;const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function errorScreen(title,error){root.innerHTML='<section class="v17-card"><h1>🍓 '+esc(title)+'</h1><span class="v18-badge">V19 • STRAWBERRY MOCHA SKIN ✦</span><p class="v17-muted">V19 loaded, but this tab could not start. Your existing planner data is safe.</p><details open><summary>Technical details</summary><pre style="white-space:pre-wrap;overflow:auto;font-size:11px">'+esc(error?.message||error||'Unknown error')+'</pre></details></section>'}function navHTML(page){return Object.entries(labels).map(([key,label])=>'<button type="button" class="'+(key===page?'active':'')+'" data-nav="'+key+'" aria-label="'+label+'">'+label+'</button>').join('')}function buildNav(page){const html=navHTML(page);nav.innerHTML=html;bottom.innerHTML=html}const navClick=e=>{const b=e.target.closest('[data-nav]');if(b&&routerRef)routerRef.go(b.dataset.nav)};nav.addEventListener('click',navClick);bottom.addEventListener('click',navClick);async function loadModule(page){if(modules[page])return modules[page];if(!queued.has(page))return null;const path=page==='planner'?'planner-v18.js':page==='school'?'school-v18.js':page+'.js';const version='19.2';const url='./tabs/'+path+'?v='+version;try{const mod=await Promise.race([import(url),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timed out loading '+page+'. The deployed module may still be propagating.')),10000))]);const name='render'+page[0].toUpperCase()+page.slice(1);if(typeof mod[name]!=='function')throw new Error('Missing export '+name+' in '+path);modules[page]=mod[name];return modules[page]}catch(error){errorScreen(labels[page]||page,error);return null}}async function renderTab(page,ctx){buildNav(page);root.innerHTML='<section class="v17-card"><h1>🍓 Loading V19…</h1><p class="v17-muted">Opening '+esc(labels[page]||page)+'…</p></section>';try{const render=await loadModule(page);if(render){await render(ctx)}else if(!queued.has(page))root.innerHTML='<section class="v17-card"><h1>🍓 '+esc(labels[page]||page)+'</h1><span class="v18-badge">V19 • STRAWBERRY MOCHA SKIN ✦</span><p class="v17-muted">This V19 tab is queued for the next migration pass.</p></section>'}catch(error){errorScreen(labels[page]||page,error)}}async function start(){try{const appMod=await import('./app/app.js?v=19.2');const app=appMod.createApp({root,renderTab});routerRef=app.router;buildNav(routerRef.page)}catch(error){errorScreen('V19 could not start',error)}}start();</script></body></html>
