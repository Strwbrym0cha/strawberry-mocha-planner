<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf5f2"><title>Strawberry Mocha Planner • V17</title><link rel="stylesheet" href="./styles.css?v=17.6"></head><body><div id="app" class="v17-app"><nav id="v17-nav" class="v17-nav" aria-label="Planner tabs"></nav><div id="tab-root"><section class="v17-card"><h1>🍓 Strawberry Mocha V17</h1><p class="v17-muted">Loading your planner…</p></section></div></div><nav id="v17-bottom-nav" class="v17-bottom-nav" aria-label="Planner tabs"></nav><script type="module">import{createApp}from'./app/app.js';import{renderHome}from'./tabs/home.js';const root=document.getElementById('tab-root'),nav=document.getElementById('v17-nav'),bottom=document.getElementById('v17-bottom-nav');const modules={home:renderHome};const queued=new Set(['planner','tasks','garden','school','money','reminders','brain','wellness','goals','wins','archive']);const labels={home:'🏠 Home',planner:'📅 Planner',tasks:'📝 Tasks',garden:'🌷 Garden',school:'🎓 School',money:'☕ Money',reminders:'🔔 Reminders',brain:'🧠 Brain',wellness:'🌸 Wellness',goals:'✨ Goals',wins:'🏆 Wins',archive:'🗄 Archive'};let routerRef=null;const navigate=page=>{if(routerRef)routerRef.go(page)};function navHTML(page){return Object.entries(labels).map(([key,label])=>`<button type="button" class="${key===page?'active':''}" data-nav="${key}" aria-label="${label}">${label}</button>`).join('')}function buildNav(page){const html=navHTML(page);nav.innerHTML=html;bottom.innerHTML=html}const navClick=e=>{const b=e.target.closest('[data-nav]');if(b)navigate(b.dataset.nav)};nav.addEventListener('click',navClick);bottom.addEventListener('click',navClick);async function loadModule(page){if(modules[page])return modules[page];if(!queued.has(page))return null;try{const mod=await import(`./tabs/${page}.js?v=17.6`);const name='render'+page[0].toUpperCase()+page.slice(1);modules[page]=mod[name];return modules[page]||null}catch(error){root.innerHTML=`<section class="v17-card"><h1>🍓 ${labels[page]||page}</h1><p class="v17-muted">V17 connected, but this tab hit an error while loading. Your existing planner data is not being changed.</p><details open><summary>Technical details</summary><pre style="white-space:pre-wrap;overflow:auto;font-size:11px">${String(error?.message||error)}</pre></details></section>`;return null}}async function renderTab(page,ctx){buildNav(page);root.innerHTML='<section class="v17-card"><h1>🍓 Loading…</h1></section>';const render=await loadModule(page);if(render)render(ctx);else if(!queued.has(page))root.innerHTML=`<section class="v17-card"><h1>🍓 ${labels[page]||page}</h1><p class="v17-muted">This V17 tab is queued for the next migration pass.</p></section>`}const app=createApp({root,renderTab});routerRef=app.router;buildNav(routerRef.page);</script></body></html>
