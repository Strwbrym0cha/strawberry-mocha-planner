<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf5f2"><title>Strawberry Mocha Planner • V17 Lab</title><link rel="stylesheet" href="./styles.css?v=17.4"></head><body><div id="app" class="v17-app"><nav id="v17-nav" class="v17-nav" aria-label="Planner tabs"></nav><div id="tab-root"><section class="v17-card"><h1>🍓 Strawberry Mocha V17</h1><p class="v17-muted">Loading your planner…</p></section></div></div><script type="module">import{createApp}from'./app/app.js';import{renderHome}from'./tabs/home.js';const root=document.getElementById('tab-root');const nav=document.getElementById('v17-nav');const modules={home:renderHome};const queued=new Set(['planner','tasks','garden','school','money','reminders','brain','wellness','goals','wins','archive']);const labels={home:'🏠 Home',planner:'📅 Planner',tasks:'📝 Tasks',garden:'🌷 Garden',school:'🎓 School',money:'☕ Money',reminders:'🔔 Reminders',brain:'🧠 Brain',wellness:'🌸 Wellness',goals:'✨ Goals',wins:'🏆 Wins',archive:'🗄 Archive'};let routerRef=null;function buildNav(page){nav.innerHTML=Object.entries(labels).map(([key,label])=>`<button type="button" class="${key===page?'active':''}" data-nav="${key}">${label}</button>`).join('');nav.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>routerRef.go(b.dataset.nav))}async function loadModule(page){if(modules[page])return modules[page];if(!queued.has(page))return null;try{const mod=await import(`./tabs/${page}.js?v=17.4`);modules[page]=mod[`render${page[0].toUpperCase()+page.slice(1)}`];return modules[page]||null}catch(error){root.innerHTML=`<section class="v17-card"><h1>🍓 ${page}</h1><p class="v17-muted">This V17 tab is being connected. The rest of your planner is still safe.</p><details><summary>Technical details</summary><pre style="white-space:pre-wrap;overflow:auto;font-size:11px">${String(error?.message||error)}</pre></details></section>`;return null}}async function renderTab(page,ctx){buildNav(page);root.innerHTML='<section class="v17-card"><h1>🍓 Loading…</h1></section>';const render=await loadModule(page);if(render)render(ctx);else if(!queued.has(page))root.innerHTML=`<section class="v17-card"><h1>🍓 ${labels[page]||page}</h1><p class="v17-muted">This V17 tab is queued for the next migration pass.</p>`}const app=createApp({root,renderTab});routerRef=app.router;buildNav(routerRef.page);</script></body></html>
