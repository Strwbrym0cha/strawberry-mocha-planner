<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="theme-color" content="#fff4fa"><meta name="sm-build" content="V21.11-2026-08-16"><title>Strawberry Mocha Planner • V21.11</title><link rel="stylesheet" href="./styles.css?v=21.11-20260816"><link rel="stylesheet" href="./v20-skin.css?v=21.11-20260816"><link rel="stylesheet" href="./v20-modal-stability.css?v=21.11-20260816"><link rel="stylesheet" href="./v20-shell.css?v=21.11-20260816"><link rel="stylesheet" href="./v21-shell.css?v=21.11-20260816"><link rel="stylesheet" href="./v21-pages.css?v=21.11-20260816"></head><body><div id="app" class="v17-app v21-app"><aside id="v21-sidebar" class="v21-sidebar" aria-label="Strawberry Mocha navigation"></aside><main class="v21-main"><div id="tab-root"><section class="v17-card"><h1>🍓 Strawberry Mocha V21.11</h1><span class="v18-badge">V21.11 • FRESH BUILD ✦</span><p class="v17-muted">Loading your pretty planner…</p></section></div></main></div><script src="./v20-popup.js?v=21.11-20260816"></script><script type="module">const BUILD='V21.11-2026-08-16';const root=document.getElementById('tab-root'),sidebar=document.getElementById('v21-sidebar');const groups=[['CORE',[['home','🏠','Home'],['planner','📅','Planner'],['tasks','📝','Tasks']]],['LIFE',[['garden','🌷','Garden'],['school','🎓','School'],['money','☕','Money'],['reminders','🔔','Reminders']]],['MIND',[['brain','🧠','Brain'],['wellness','🌸','Wellness'],['goals','🌙','Dreamscape'],['wins','🏆','Wins']]]];const labels=Object.fromEntries(groups.flatMap(g=>g[1].map(x=>[x[0],x[2]])));Object.assign(labels,{archive:'Archive',settings:'Settings'});const queued=new Set(Object.keys(labels));let modules={},routerRef=null;const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function navHTML(page){return '<div class="v21-brand"><div class="v21-brand-mark">🍓</div><div><strong>STRAWBERRY</strong><span>MOCHA</span><em>V21.11</em></div></div>'+groups.map(([title,items])=>'<section class="v21-nav-group"><small>✦ '+title+'</small>'+items.map(([key,icon,label])=>'<button type="button" class="v21-nav-item '+(key===page?'active':'')+'" data-nav="'+key+'"><span class="v21-nav-icon">'+icon+'</span><span class="v21-nav-copy"><b>'+label+'</b><em data-nav-meta="'+key+'"></em></span></button>').join('')+'</section>').join('')+'<div class="v21-nav-spacer"></div><button type="button" class="v21-nav-item '+(page==='archive'?'active':'')+'" data-nav="archive"><span class="v21-nav-icon">📦</span><span class="v21-nav-copy"><b>Archive</b></span></button><button type="button" class="v21-nav-item '+(page==='settings'?'active':'')+'" data-nav="settings"><span class="v21-nav-icon">⚙️</span><span class="v21-nav-copy"><b>Settings</b></span></button><div class="v21-sidebar-footer">🍓 ✦ 🎀 ✦ 🍓</div>'}function buildNav(page){sidebar.innerHTML=navHTML(page);sidebar.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>routerRef?.go(b.dataset.nav)));setTimeout(refreshMeta,0)}function refreshMeta(){const store=window.__smStore;if(!store)return;const d=store.get(),today=new Date().toISOString().slice(0,10),tasks=(d.tasks||[]).filter(t=>t.date===today&&!t.done).length,events=(d.events||[]).filter(e=>e.date===today).length;sidebar.querySelector('[data-nav-meta="tasks"]')?.replaceChildren(document.createTextNode(tasks?`• ${tasks} remaining`:'• all clear'));sidebar.querySelector('[data-nav-meta="planner"]')?.replaceChildren(document.createTextNode(events?`• ${events} today`:'• no events'))}function errorScreen(title,error){root.innerHTML='<section class="v17-card"><h1>🍓 '+esc(title)+'</h1><span class="v18-badge">'+BUILD+' • FRESH BUILD ✦</span><p class="v17-muted">The V21 shell loaded, but this tab could not start. Your existing planner data is safe.</p><details open><summary>Technical details</summary><pre style="white-space:pre-wrap;overflow:auto;font-size:11px">'+esc(error?.message||error||'Unknown error')+'</pre></details></section>'}async function loadModule(page){if(modules[page])return modules[page];if(!queued.has(page))return null;const path=page==='planner'?'planner-v18.js':page==='school'?'school-v18.js':page+'.js';try{const mod=await Promise.race([import('./tabs/'+path+'?build='+encodeURIComponent(BUILD)),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timed out loading '+page)),10000))]);const name='render'+page[0].toUpperCase()+page.slice(1);if(typeof mod[name]!=='function')throw new Error('Missing export '+name+' in '+path);modules[page]=mod[name];return modules[page]}catch(error){errorScreen(labels[page]||page,error);return null}}async function renderTab(page,ctx){buildNav(page);root.innerHTML='<section class="v17-card"><h1>🍓 Loading V21.11…</h1><p class="v17-muted">Opening '+esc(labels[page]||page)+'…</p></section>';try{const render=await loadModule(page);if(render)await render(ctx)}catch(error){errorScreen(labels[page]||page,error)}}async function start(){try{const appMod=await import('./app/app.js?build='+encodeURIComponent(BUILD));const app=appMod.createApp({root,renderTab});routerRef=app.router;window.__smStore=app.store;document.documentElement.dataset.smBuild=BUILD;buildNav(routerRef.page);app.store?.subscribe(refreshMeta)}catch(error){errorScreen('V21.11 could not start',error)}}start();</script></body></html>
