<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#fff4fa">
  <meta name="sm-build" content="V22.1.20-2026-08-17">
  <title>Kat’s Korner V1 • V22.1.20</title>
  <link rel="stylesheet" href="./styles.css?v=22.0.1-20260816">
  <link rel="stylesheet" href="./v20-skin.css?v=22.0.1-20260816">
  <link rel="stylesheet" href="./v20-modal-stability.css?v=22.0.1-20260816">
  <link rel="stylesheet" href="./v20-shell.css?v=22.0.1-20260816">
  <link rel="stylesheet" href="./v21-shell.css?v=22.0.1-20260816">
  <link rel="stylesheet" href="./v21-pages.css?v=22.0.1-20260816">
  <link rel="stylesheet" href="./v22-design-fixes.css?v=22.1.20-20260817">
</head>
<body>
  <div id="app" class="v17-app v21-app">
    <aside id="v21-sidebar" class="v21-sidebar" aria-label="Strawberry Mocha navigation"></aside>
    <main class="v21-main"><div id="tab-root"><section class="v17-card"><h1>🍓 Strawberry Mocha V22</h1><span class="v18-badge">V22 • FRESH BUILD ✦</span><p class="v17-muted">Loading your pretty planner…</p></section></div></main>
  </div>
  <script src="./v20-popup.js?v=22.0.1-20260816"></script>
  <script type="module">
    const BUILD='V22.1.20-2026-08-17';
    const moduleSuffix=location.protocol==='file:'?'':'?build='+encodeURIComponent(BUILD);
    const root=document.getElementById('tab-root'),sidebar=document.getElementById('v21-sidebar');
    const groups=[['CORE',[['home','🏠','Home'],['planner','📅','Planner'],['tasks','📝','Tasks'],['mochini','🍡','Mochini']]],['LIFE',[['garden','🌷','Garden'],['school','🎓','School'],['work','💼','Work'],['money','☕','Money'],['reminders','🔔','Reminders'],['noms','🍱','Noms']]],['MIND',[['brain','🧠','Brain'],['wellness','🌸','Wellness'],['goals','🌙','Dreamscape'],['projects','🗂','Projects'],['labs','🔬','Kat Labs'],['wins','🏆','Wins']]],['SYSTEM',[['settings','⚙️','Settings'],['hub','✨','KatOS Hub']]]];
    const labels=Object.fromEntries(groups.flatMap(group=>group[1].map(item=>[item[0],item[2]])));Object.assign(labels,{archive:'Archive'});
    const queued=new Set(Object.keys(labels));let modules={},routerRef=null;
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function navHTML(page){return '<div class="v21-brand"><div class="v21-brand-mark">🍓</div><div><strong>STRAWBERRY</strong><span>MOCHA</span><em>'+BUILD.split('-')[0]+'</em></div></div>'+groups.map(([title,items])=>'<section class="v21-nav-group"><small>✦ '+title+'</small>'+items.map(([key,icon,label])=>'<button type="button" class="v21-nav-item '+(key===page?'active':'')+'" data-nav="'+key+'"><span class="v21-nav-icon">'+icon+'</span><span class="v21-nav-copy"><b>'+label+'</b><em data-nav-meta="'+key+'"></em></span></button>').join('')+'</section>').join('')+'<div class="v21-nav-spacer"></div><button type="button" class="v21-nav-item '+(page==='archive'?'active':'')+'" data-nav="archive"><span class="v21-nav-icon">📦</span><span class="v21-nav-copy"><b>Archive</b></span></button><div class="v21-sidebar-footer">🍓 ✦ 🎀 ✦ 🍓</div>'}
    function localDateKey(){const date=new Date();return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
    function refreshMeta(){const store=window.__smStore;if(!store)return;const data=store.get(),today=localDateKey(),tasks=(data.tasks||[]).filter(task=>(!task.date||task.date===today)&&!task.done).length,events=(data.events||[]).filter(event=>event.date===today).length;sidebar.querySelector('[data-nav-meta="tasks"]')?.replaceChildren(document.createTextNode(tasks?`• ${tasks} remaining`:'• all clear'));sidebar.querySelector('[data-nav-meta="planner"]')?.replaceChildren(document.createTextNode(events?`• ${events} today`:'• no events'))}
    function buildNav(page){sidebar.innerHTML=navHTML(page);sidebar.querySelectorAll('[data-nav]').forEach(button=>button.addEventListener('click',()=>routerRef?.go(button.dataset.nav)));setTimeout(refreshMeta,0)}
    function errorScreen(title,error){root.innerHTML='<section class="v17-card"><h1>🍓 '+esc(title)+'</h1><span class="v18-badge">'+BUILD+' • FRESH BUILD ✦</span><p class="v17-muted">The V22 shell loaded, but this tab could not start. Your existing planner data is safe.</p><details open><summary>Technical details</summary><pre style="white-space:pre-wrap;overflow:auto;font-size:11px">'+esc(error?.message||error||'Unknown error')+'</pre></details></section>'}
    async function loadModule(page){if(modules[page])return modules[page];if(!queued.has(page))return null;const path=page==='planner'?'planner-v18.js':page==='school'?'school-v18.js':page+'.js';try{const module=await Promise.race([import('./tabs/'+path+moduleSuffix),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timed out loading '+page)),10000))]);const name='render'+page[0].toUpperCase()+page.slice(1);if(typeof module[name]!=='function')throw new Error('Missing export '+name+' in '+path);modules[page]=module[name];return modules[page]}catch(error){errorScreen(labels[page]||page,error);return null}}
    async function renderTab(page,context){buildNav(page);root.innerHTML='<section class="v17-card"><h1>🍓 Loading '+BUILD.split('-')[0]+'…</h1><p class="v17-muted">Opening '+esc(labels[page]||page)+'…</p></section>';try{const render=await loadModule(page);if(render)await render(context)}catch(error){errorScreen(labels[page]||page,error)}}
    async function start(){try{const appModule=await import('./app/app.js'+moduleSuffix);const app=appModule.createApp({root,renderTab});routerRef=app.router;window.__smStore=app.store;document.documentElement.dataset.smBuild=BUILD;document.title='Strawberry Mocha Planner • '+BUILD.split('-')[0];buildNav(routerRef.page);app.store?.subscribe(refreshMeta)}catch(error){errorScreen(BUILD.split('-')[0]+' could not start',error)}}
    start();
  </script>
</body>
</html>
