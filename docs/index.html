<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner 🍓</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--soft:#fff0f5;--bg:#fbf4f1;--ink:#674941;--muted:#9a817b;--line:#ead7d2;--pink:#bd6686}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.gate{position:fixed;inset:0;background:linear-gradient(135deg,#fff4f7,#fffaf5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.box{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:30px;padding:26px;box-shadow:0 18px 60px #67494118}.berry{font-size:54px}.ey{font-size:10px;letter-spacing:.14em;color:var(--pink);font-weight:900}.box h1{margin:7px 0;font-size:34px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font:inherit;margin:5px 0}.btn{width:100%;border-radius:14px;padding:12px;font-weight:900;margin-top:8px}.primary{border:1px solid #efbfd0;background:var(--soft);color:var(--pink)}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.msg{margin-top:10px;padding:10px;border-radius:12px;background:var(--soft);font-size:12px;display:none}.app{height:100%;display:flex;flex-direction:column}.bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#fffaf7;border-bottom:1px solid var(--line);z-index:5}.brand{font-weight:900;color:var(--pink)}.status{font-size:11px;color:var(--muted)}.logout{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 10px;color:var(--ink);font-weight:800}.frame{border:0;width:100%;flex:1;min-height:0;background:var(--bg)}.sync{position:fixed;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:11px;box-shadow:0 8px 25px #67494112;z-index:20}.moodPatch{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:8px}.moodChoice{border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px 6px;font:inherit;color:var(--ink);cursor:pointer;min-height:62px}.moodChoice .emoji{display:block;font-size:23px}.moodChoice small{display:block;font-size:10px;margin-top:3px}.moodChoice.selected{background:var(--soft);border-color:var(--pink);box-shadow:0 0 0 2px #f5c6d7}.habitRemove{border:0;background:transparent;color:#b999a2;font-size:21px;line-height:1;padding:3px 6px;cursor:pointer;border-radius:9px}.habitRemove:hover{background:#fff}.habitTools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}.habitReset{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;color:var(--muted);font-size:10px;font-weight:800}.capacityCard{background:linear-gradient(135deg,#fff,#fff0f5);border:1px solid #e8c5d1;border-radius:22px;padding:15px;margin-bottom:12px;box-shadow:0 8px 24px #6749410b}.capacityTitle{display:flex;align-items:center;justify-content:space-between;gap:10px}.capacityTitle h3{margin:0}.capacityModes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.capacityBtn{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 5px;font:inherit;font-size:11px;font-weight:900;color:var(--ink)}.capacityBtn.selected{background:var(--soft);border-color:var(--pink);color:var(--pink);box-shadow:0 0 0 2px #f5c6d7}.capacityNote{margin-top:9px;font-size:11px;color:var(--muted);line-height:1.4}.capacityBasics{display:none;margin-top:10px;background:#fff;border:1px dashed #e8c5d1;border-radius:15px;padding:10px;font-size:12px;line-height:1.7}.capacityBasics.show{display:block}.capacityDim{opacity:.48}.capacityDim .input{background:#faf7f6}</style></head><body><div id="gate" class="gate"><div class="box"><div class="berry">🍓</div><div class="ey">STRAWBERRY MOCHA PLANNER</div><h1>Welcome home ♡</h1><p class="muted">Your planner has a cloud brain now. Sign in so your goals, routines, school, money and daily life can follow you between devices.</p><input id="email" class="input" type="email" autocomplete="email" placeholder="Email address"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Password"><button id="signin" class="btn primary">☁️ Sign In</button><button id="signup" class="btn secondary">🌱 Create Account</button><div id="msg" class="msg"></div></div></div><div id="app" class="app" style="display:none"><header class="bar"><div class="brand">🍓 Strawberry Mocha</div><div><span id="status" class="status">☁️ Connecting…</span> <button id="logout" class="logout">Log out</button></div></header><iframe id="planner" class="frame" src="./planner-app.html" title="Strawberry Mocha Planner"></iframe><div id="sync" class="sync">☁️ Cloud sync ready</div></div><script>const SB_URL='https://sigjwmgekmrwehylvuvu.supabase.co',SB_KEY='sb_publishable_CTqamiGR3_lXNW2mBx9wMA_ObemQMAC',sb=supabase.createClient(SB_URL,SB_KEY),gate=document.getElementById('gate'),app=document.getElementById('app'),frame=document.getElementById('planner'),status=document.getElementById('status'),sync=document.getElementById('sync'),msg=document.getElementById('msg'),DATA_KEY='sm_v6';let user=null,ready=false,hydrated=false;const MOODS=[['🥰','Loved'],['😊','Happy'],['😌','Calm'],['🥹','Tender'],['🤩','Excited'],['😎','Confident'],['🙂','Okay'],['😐','Meh'],['😶','Blank'],['😴','Sleepy'],['🥱','Drained'],['😮‍💨','Overwhelmed'],['😔','Sad'],['🥺','Sensitive'],['😣','Frustrated'],['😤','Irritated'],['🤯','Overloaded'],['🫠','Melting'],['🧸','Need comfort'],['🌱','Hopeful'],['🧠','Focused'],['🎀','Feeling cute']];const CAPACITY=[['full','🌟','Full battery','I have room today.'],['normal','🌸','Normal day','Steady and realistic.'],['low','🌱','Low battery','Essentials first, everything else is optional.'],['bare','🧸','Bare minimum','Survive gently. One thing is enough.']];function setStatus(t){status.textContent=t;sync.textContent=t}function error(t){msg.textContent=t;msg.style.display='block'}function localData(){try{return JSON.parse(frame.contentWindow.localStorage.getItem(DATA_KEY)||'null')}catch(e){return null}}function putLocal(d){try{frame.contentWindow.localStorage.setItem(DATA_KEY,JSON.stringify(d))}catch(e){}}function extras(){const d=localData()||{};d.__smExtras=d.__smExtras||{};return d.__smExtras}function saveExtras(x){const d=localData()||{};d.__smExtras=Object.assign({},d.__smExtras||{},x);putLocal(d)}async function cloudData(){const r=await sb.from('planner_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;return r.data}async function saveCloud(d){const r=await sb.from('planner_data').upsert({user_id:user.id,data:d},{onConflict:'user_id'});if(r.error)throw r.error}function patchCapacity(doc){const today=doc.getElementById('today');if(!today||today.dataset.smCapacityPatched)return;today.dataset.smCapacityPatched='1';const card=doc.createElement('section');card.className='capacityCard';card.innerHTML='<div class="capacityTitle"><h3>🔋 How much capacity do I have today?</h3><span class="pill" id="capacityBadge">🌸 Normal day</span></div><div class="capacityModes">'+CAPACITY.map(x=>'<button type="button" class="capacityBtn" data-cap="'+x[0]+'">'+x[1]+' '+x[2]+'</button>').join('')+'</div><div class="capacityNote" id="capacityNote"></div><div class="capacityBasics" id="capacityBasics">🧸 <b>Bare minimum menu</b><br>💧 Drink some water<br>🍽️ Eat something<br>🐈 Care for the cats<br>🧼 Basic hygiene<br>⭐ Pick <b>one</b> important thing<br>🌙 Gentle shutdown when you are done</div>';today.insertBefore(card,today.firstChild);const current=extras().capacity||'normal';const apply=mode=>{saveExtras({capacity:mode,capacityDate:new Date().toISOString().slice(0,10)});const info=CAPACITY.find(x=>x[0]===mode)||CAPACITY[1];card.querySelectorAll('.capacityBtn').forEach(b=>b.classList.toggle('selected',b.dataset.cap===mode));card.querySelector('#capacityBadge').textContent=info[1]+' '+info[2];card.querySelector('#capacityNote').textContent=info[3];card.querySelector('#capacityBasics').classList.toggle('show',mode==='low'||mode==='bare');const pri=Array.from(today.querySelectorAll('.pri')).map(x=>x.closest('.mini')).filter(Boolean);pri.forEach((el,i)=>{el.classList.toggle('capacityDim',mode==='low'&&i>0||mode==='bare');const inp=el.querySelector('input');if(inp)inp.disabled=mode==='bare'&&i>0});setStatus('☁️ '+info[2]+' saved')};card.querySelectorAll('.capacityBtn').forEach(b=>b.onclick=()=>apply(b.dataset.cap));apply(current)}function patchPlanner(){const doc=frame.contentDocument;if(!doc||!doc.body)return;patchCapacity(doc);const moodBox=doc.getElementById('moods');if(moodBox&&!moodBox.dataset.smPatched){moodBox.dataset.smPatched='1';moodBox.classList.add('moodPatch');const current=extras().mood||'';moodBox.innerHTML=MOODS.map(([e,l])=>'<button type="button" class="moodChoice '+(current===l?'selected':'')+'" data-mood="'+l+'"><span class="emoji">'+e+'</span><small>'+l+'</small></button>').join('');moodBox.addEventListener('click',e=>{const b=e.target.closest('.moodChoice');if(!b)return;moodBox.querySelectorAll('.moodChoice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');saveExtras({mood:b.dataset.mood,moodDate:new Date().toISOString().slice(0,10)});setStatus('☁️ Mood saved')})}const habits=doc.getElementById('todayHabits');if(habits){const ex=extras();const hidden=ex.hiddenHabits||[];Array.from(habits.children).forEach(item=>{if(item.dataset.smHabitPatched)return;const text=(item.textContent||'').replace('×','').trim();if(!text)return;if(hidden.includes(text)){item.remove();return}item.dataset.smHabitPatched='1';let remove=item.querySelector('.habitRemove');if(!remove){remove=doc.createElement('button');remove.className='habitRemove';remove.type='button';remove.textContent='×';remove.title='Hide this habit';remove.setAttribute('aria-label','Hide '+text);item.appendChild(remove)}remove.onclick=ev=>{ev.preventDefault();ev.stopPropagation();const now=extras().hiddenHabits||[];if(!now.includes(text))now.push(text);saveExtras({hiddenHabits:now});item.remove()}});let tools=habits.parentElement.querySelector('.habitTools');if(!tools){tools=doc.createElement('div');tools.className='habitTools';tools.innerHTML='<span style="font-size:10px;color:#9a817b">× removes a habit from your list</span><button type="button" class="habitReset">Restore hidden habits</button>';habits.parentElement.appendChild(tools);tools.querySelector('.habitReset').onclick=()=>{saveExtras({hiddenHabits:[]});location.reload()}}}}async function hydrate(){if(hydrated)return;hydrated=true;setStatus('☁️ Syncing your planner…');const c=await cloudData(),l=localData();if(c&&c.data&&Object.keys(c.data).length){putLocal(c.data);frame.contentWindow.location.reload()}else if(l)await saveCloud(l);else await saveCloud({});ready=true;setStatus('☁️ Synced');patchPlanner()}frame.addEventListener('load',async()=>{if(!user)return;try{patchPlanner();await hydrate();patchPlanner()}catch(e){hydrated=false;setStatus('⚠️ Sync error');error(e.message)}});setInterval(()=>{if(ready&&user){patchPlanner();const d=localData();if(d)saveCloud(d).then(()=>setStatus('☁️ Synced')).catch(()=>setStatus('⚠️ Sync paused'))}},7000);async function enter(u){user=u;gate.style.display='none';app.style.display='flex';setStatus('☁️ Preparing your planner…');try{await hydrate()}catch(e){setStatus('⚠️ Sync error');error(e.message)}}async function signIn(){msg.style.display='none';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return error('Please enter your email and password.');const r=await sb.auth.signInWithPassword({email,password});if(r.error)return error(r.error.message);await enter(r.data.user)}async function signUp(){msg.style.display='none';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6)return error('Use an email and a password with at least 6 characters.');const r=await sb.auth.signUp({email,password});if(r.error)return error(r.error.message);if(r.data.session)await enter(r.data.user);else error('Account created! Check your email to confirm it, then sign in. 💕')}document.getElementById('signin').onclick=signIn;document.getElementById('signup').onclick=signUp;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};sb.auth.getSession().then(r=>{if(r.data.session)enter(r.data.session.user)}).catch(e=>error(e.message));</script></body></html>
