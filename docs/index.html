EY,JSON.stringify(d))}catch(e){}}async function cloudData(){const r=await sb.from('planner_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;return r.data}async function saveCloud(d){const r=await sb.from('planner_data').upsert({user_id:user.id,data:d},{onConflict:'user_id'});if(r.error)throw r.error}async function hydrate(){if(hydrated)return;hydrated=true;setStatus('☁️ Syncing your planner…');const c=await cloudData(),l=localData();if(c&&c.data&&Object.keys(c.data).length){putLocal(c.data);frame.contentWindow.location.reload()}else if(l)await saveCloud(l);else await saveCloud({});ready=true;setStatus('☁️ Synced')}frame.addEventListener('load',async()=>{if(!user)return;try{await hydrate()}catch(e){hydrated=false;setStatus('⚠️ Sync error');error(e.message)}});setInterval(()=>{if(ready&&user){const d=localData();if(d)saveCloud(d).then(()=>setStatus('☁️ Synced')).catch(()=>setStatus('⚠️ Sync paused'))}},7000);async function enter(u){user=u;gate.style.display='none';app.style.display='flex';setStatus('☁️ Preparing your planner…');try{await hydrate()}catch(e){setStatus('⚠️ Sync error');error(e.message)}}async function signIn(){msg.style.display='none';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return error('Please enter your email and password.');const r=await sb.auth.signInWithPassword({email,password});if(r.error)return error(r.error.message);await enter(r.data.user)}async function signUp(){msg.style.display='none';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6)return error('Use an email and a password with at least 6 characters.');const r=await sb.auth.signUp({email,password});if(r.error)return error(r.error.message);if(r.data.session)await enter(r.data.user);else error('Account created! Check your email to confirm it, then sign in. 💕')}document.get
