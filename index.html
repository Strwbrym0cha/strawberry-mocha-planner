nt-weight:900;margin-top:8px}.secondary{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:18px;padding:13px;font-weight:800;margin-top:8px}.msg{margin-top:10px;padding:10px;border-radius:14px;background:var(--soft);font-size:12px;display:none}.sync{position:fixed;right:14px;bottom:14px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:17px;padding:10px 13px;font-size:11px;box-shadow:0 8px 25px #67494112;z-index:30}.hidden{display:none!important}

<body>
  <div id="gate" class="gate"><div class="box"><div class="berry">🍓</div><div class="ey">KATOS V2 ✦</div><h1>Welcome home ♡</h1><p class="muted">Sign in so your planner can follow you safely between your phone, iPad, and computer.</p><input id="email" class="input" type="email" autocomplete="username" placeholder="Email address"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Password"><button id="signin" class="primary" type="button">☁️ Sign In</button><button id="signup" class="secondary" type="button">🌱 Create Account</button><div id="msg" class="msg" role="alert"></div></div></div>

  <script>
    const URL='https://sigjwmgekmrwehylvuvu.supabase.co',KEY='sb_publishable_CTqamiGR3_lXNW2mBx9wMA_ObemQMAC',STORE='sm_v16_session',DATAKEY='sm_v16',BACKUPKEY='sm_v16_backup';
    const $=id=>document.getElementById(id),frame=$('planner');let hydrationReloaded=false,activeSession=null;
    function message(text){const element=$('msg');element.textContent=text;element.style.display='block'}function status(text){$('status').textContent=text;$('sync').textContent=text}function localSession(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}}
    async function auth(path,body){const response=await fetch(URL+'/auth/v1/'+path,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(body)}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error_description||data.msg||data.message||'Authentication failed.');return data}
    async function refresh(session){if(!session?.refresh_token)throw new Error('No refresh token available.');const next=await auth('token?grant_type=refresh_token',{refresh_token:session.refresh_token});localStorage.setItem(STORE,JSON.stringify(next));activeSession=next;return next}
    async function cloudSave(session,data){const response=await fetch(URL+'/rest/v1/planner_data?on_conflict=user_id',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+session.access_token,'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:session.user.id,data})});if(!response.ok)throw new Error('Cloud save failed.')}
    function frameData(key){try{const saved=JSON.parse(frame.contentWindow.localStorage.getItem(key)||'null');return saved?.data||saved||null}catch{return null}}function stamp(data){return Date.parse(data?.__smUpdatedAt||'')||0}function hasPlannerData(data){const noms=data?.noms||{},sips=data?.sips||{},hasNoms=['foods','pantry','groceries','recipes','mealPlan','emergencyNoms'].some(key=>Array.isArray(noms[key])&&noms[key].length)||!!noms.today,hasMochini=Array.isArray(data?.mochini?.conversation)&&data.mochini.conversation.length>0,hasSips=Array.isArray(sips.entries)&&sips.entries.length>0||String(sips.drink||'').trim()&&String(sips.drink).trim()!=='Water'||Number(sips.servingOz)>0&&Number(sips.servingOz)!==32||Number(sips.goalOz)>0&&Number(sips.goalOz)!==64;return!!data&&(String(data.brain||'').trim()||Object.keys(data.days||{}).length||['events','reminders','tasks','routines','habits','goals','wins','courses','archive','brainNotes'].some(key=>Array.isArray(data[key])&&data[key].length)||Array.isArray(data.wellness?.entries)&&data.wellness.entries.length||Object.values(data.money||{}).some(value=>Array.isArray(value)&&value.length)||hasNoms||hasMochini||hasSips)}function newestLocal(){const primary=frameData(DATAKEY),backup=frameData(BACKUPKEY);return stamp(backup)>stamp(primary)?backup:primary}function saveFrameData(data){const record=JSON.stringify({data});frame.contentWindow.localStorage.setItem(DATAKEY,record)}
    async function hydrate(session,attempt=0){try{const response=await fetch(URL+'/rest/v1/planner_data?user_id=eq.'+encodeURIComponent(session.user.id)+'&select=data,updated_at&limit=1',{headers:{'apikey':KEY,'Authorization':'Bearer '+session.access_token}});if(!response.ok){if(attempt===0&&session.refresh_token)return hydrate(await refresh(session),1);throw new Error('Cloud sync failed.')}const rows=await response.json(),cloud=rows[0]?.data||null,local=newestLocal(),cloudStamp=Math.max(stamp(cloud),Date.parse(rows[0]?.updated_at||'')||0),localStamp=stamp(local);if(hasPlannerData(local)&&(!hasPlannerData(cloud)||localStamp>cloudStamp)){await cloudSave(session,local);hydrationReloaded=false;status('☁️ Synced');return}if(cloud){saveFrameData(cloud);if(!hydrationReloaded){hydrationReloaded=true;frame.contentWindow.location.reload();return}}else if(hasPlannerData(local))await cloudSave(session,local);hydrationReloaded=false;status('☁️ Synced')}catch(error){hydrationReloaded=false;status('⚠️ Cloud sync unavailable')}}
    async function enter(session){if(!session?.access_token)return;activeSession=session;localStorage.setItem(STORE,JSON.stringify(session));$('gate').classList.add('hidden');$('app').classList.remove('hidden');status('☁️ Loading KatOS V2…');frame.onload=()=>{if(!hydrationReloaded)hydrate(activeSession)};if(frame.contentDocument?.readyState==='complete'&&!hydrationReloaded)await hydrate(session)}
    async function signIn(){try{$('msg').style.display='none';const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return message('Please enter an email and a password.');status('☁️ Signing in…');await enter(await auth('token?grant_type=password',{email,password}))}catch(error){status('⚠️ Login failed');message(error.message)}}
    async function signUp(){try{$('msg').style.display='none';const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return message('Please enter an email and a password with at least 6 characters.');status('🌱 Creating account…');const session=await auth('signup',{email,password});if(session.access_token)await enter(session);else message('Account created! Check your email to confirm it. 💕')}catch(error){status('⚠️ Sign-up failed');message(error.message)}}
    $('signin').addEventListener('click',signIn);$('signup').addEventListener('click',()=>signUp());$('password').addEventListener('keydown',event=>{if(event.key==='Enter')signIn()});$('logout').addEventListener('click',()=>{localStorage.removeItem(STORE);location.reload()});const saved=localSession();if(saved?.access_token)enter(saved);else status('☁️ Ready');
  </script>
