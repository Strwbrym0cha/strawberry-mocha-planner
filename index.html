data));if(!hydrationReloaded){hydrationReloaded=true;frame.contentWindow.location.reload();return}}else if(local){await cloudSave(session,local)}hydrationReloaded=false;status('☁️ V16 Synced')}catch(e){hydrationReloaded=false;status('⚠️ Offline mode')}}function resizeFrame(){try{const d=frame.contentDocument;if(!d)return;const h=Math.max(d.body?.scrollHeight||0,d.documentElement?.scrollHeight||0,d.body?.offsetHeight||0,d.documentElement?.offsetHeight||0);if(h>0)frame.style.height=(h+2)+'px'}catch(e){}}function watchFrame(){resizeFrame();try{const d=frame.contentDocument;if(!d)return;new MutationObserver(()=>requestAnimationFrame(resizeFrame)).observe(d.body||d.documentElement,{subtree:true,childList:true,attributes:true});d.defaultView?.addEventListener('resize',resizeFrame);d.addEventListener('click',()=>setTimeout(resizeFrame,20),true)}catch(e){}}async function enter(session){if(!session?.access_token)return;localStorage.setItem(STORE,JSON.stringify(session));$('gate').classList.add('hidden');$('app').classList.remove('hidden');status('☁️ Loading V16…');frame.onload=()=>{watchFrame();if(hydrationReloaded){status('☁️ V16 Synced');return}hydrate(session)};if(frame.contentDocument?.readyState==='complete'){watchFrame();if(!hydrationReloaded)await hydrate(session)}}$('signin').addEventListener('click',signIn);$('signup').addEventListener('click',signUp);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});$('logout').addEventListener('click',()=>{localStorage.removeItem(STORE);location.reload()});const saved=localSession();if(saved?.access_token)enter(saved);else status('☁️ Ready to sign in');</script></body></html>
