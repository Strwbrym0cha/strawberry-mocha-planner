<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strawberry Mocha Planner 🍓 V16</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--pink:#e98eaf;--soft:#fff0f5;--bg:#fbf4f1;--ink:#674941;--muted:#9a817b;--line:#ead7d2}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.app{min-height:100%;display:flex;flex-direction:column}.bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#fffaf7;border-bottom:1px solid var(--line);position:relative;z-index:10}.brand{font-weight:900;color:#bd6686}.status{font-size:11px;color:var(--muted)}.logout{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 10px;color:var(--ink);font-weight:800}.frame{border:0;width:100%;flex:1;min-height:calc(100vh - 52px);background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}.gate{position:fixed;inset:0;background:linear-gradient(135deg,#fff4f7,#fffaf5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.box{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:30px;padding:26px;box-shadow:0 18px 60px #67494118}.berry{font-size:54px}.ey{font-size:10px;letter-spacing:.14em;color:#bd6686;font-weight:900}.box h1{margin:7px 0;font-size:34px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font:inherit;margin:5px 0}.primary{width:100%;border:1px solid #efbfd0;background:var(--soft);color:#bd6686;border-radius:14px;padding:12px;font-weight:900;margin-top:8px}.secondary{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:11px;font-weight:800;margin-top:8px}.msg{margin-top:10px;padding:10px;border-radius:12px;background:var(--soft);font-size:12px;display:none}.sync{position:fixed;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:11px;box-shadow:0 8px 25px #67494112;z-index:30}.hidden{display:none!important}</style></head><body><div id="gate" class="gate"><div class="box"><div class="berry">🍓</div><div class="ey">STRAWBERRY MOCHA PLANNER V16</div><h1>Welcome home ♡</h1><p class="muted">Your interactive planner is ready.</p><input id="email" class="input" type="email" autocomplete="email" placeholder="Email address"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Password"><button id="signin" class="primary">☁️ Sign In</button><button id="signup" class="secondary">🌱 Create Account</button><div id="msg" class="msg"></div></div></div><div id="app" class="app hidden"><header class="bar"><div class="brand">🍓 Strawberry Mocha <span style="font-size:10px">V16</span></div><div><span id="status" class="status">☁️ Connecting…</span> <button id="logout" class="logout">Log out</button></div></header><iframe id="planner" class="frame" src="v16.html?v=16.2" title="Strawberry Mocha Planner V16"></iframe><div id="sync" class="sync">☁️ Cloud sync ready</div></div><script>const SUPABASE_URL='https://sigjwmgekmrwehylvuvu.supabase.co';const SUPABASE_KEY='sb_publishable_CTqamiGR3_lXNW2mBx9wMA_ObemQMAC';const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const frame=document.getElementById('planner'),gate=document.getElementById('gate'),app=document.getElementById('app'),msg=document.getElementById('msg'),statusEl=document.getElementById('status'),syncEl=document.getElementById('sync');const KEY='sm_v16';let user=null,hydrated=false;function message(t){msg.textContent=t;msg.style.display='block'}function setStatus(t){statusEl.textContent=t;syncEl.textContent=t}function localData(){try{return JSON.parse(frame.contentWindow.localStorage.getItem(KEY)||'null')}catch(e){return null}}async function saveCloud(data){const {error}=await client.from('planner_data').upsert({user_id:user.id,data:data},{onConflict:'user_id'});if(error)throw error}function enhanceMoney(){try{const w=frame.contentWindow,d=w.document;if(!w||!d||!w.D)return;d.getElementById('v16MoneyStyle')?.remove();const st=d.createElement('style');st.id='v16MoneyStyle';st.textContent='.mcHero{background:linear-gradient(135deg,#f7d7e3,#fff7ee);border:1px solid #eadbd6;border-radius:28px;padding:22px;margin-bottom:12px;position:relative;overflow:hidden}.mcHero:after{content:"☕🍓";position:absolute;right:22px;bottom:8px;font-size:48px;opacity:.8}.mcHero h2{margin:5px 0 2px;font-size:30px}.mcBig{font-size:42px;font-weight:950;color:#b96c88}.mcSub{color:#99817a;font-size:12px}.mcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.mcCard{background:#fffaf6;border:1px solid #eadbd6;border-radius:18px;padding:13px}.mcCard small{display:block;color:#99817a;font-size:9px;font-weight:900;letter-spacing:.08em}.mcCard b{display:block;font-size:23px;margin-top:4px}.mcPlan{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.mcBill{display:grid;grid-template-columns:1fr auto auto auto;gap:7px;align-items:center;padding:10px;border:1px solid #eadbd6;border-radius:14px;background:#fffaf6;margin:7px 0}.mcBill.done{opacity:.5}.mcBill.done .mcBillName{text-decoration:line-through}.mcAmt{font-weight:900;color:#b96c88}.mcTiny{font-size:10px;color:#99817a}.mcProgress{height:11px;background:#eee2e5;border-radius:99px;overflow:hidden;margin:9px 0}.mcProgress i{display:block;height:100%;background:linear-gradient(90deg,#f0b6cb,#d77d9f);border-radius:99px}.mcMood{background:#fffaf6;border:1px solid #eadbd6;border-radius:18px;padding:13px;margin-top:9px}.mcWin{background:#fff0f5;border:1px solid #efbfd0;border-radius:14px;padding:11px;margin-top:9px}.mcInput{width:100%;padding:10px;border:1px solid #eadbd6;border-radius:12px;background:#fff;color:#674941}.mcBtn{border:1px solid #efbfd0;background:#fff0f5;color:#b96c88;border-radius:12px;padding:9px 11px;font-weight:900}.mcDanger{border:0;background:transparent;color:#a76a78;font-weight:900}.mcRow{display:flex;gap:7px;margin-top:8px}.mcRow>*{flex:1}@media(max-width:800px){.mcGrid,.mcPlan{grid-template-columns:1fr 1fr}.mcBill{grid-template-columns:1fr auto auto}}@media(max-width:480px){.mcGrid,.mcPlan{grid-template-columns:1fr}.mcBig{font-size:36px}}';d.head.appendChild(st);w.money=function(){const D=w.D;D.money=D.money||{};const bills=(D.reminders||[]).filter(x=>x.type==='bill'||Number(x.amount)>0);const billTotal=bills.filter(x=>!x.completed).reduce((n,x)=>n+(Number(x.amount)||0),0);const income=Number(D.money.income)||0,funds=Number(D.money.funds)||0,spend=Number(D.money.spend)||0,saving=Number(D.money.saving)||0,debt=Number(D.money.debt)||0,combined=income+funds,planned=billTotal+spend+saving+debt,safe=combined-planned;const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const pct=planned?Math.max(0,Math.min(100,planned/Math.max(combined,1)*100)):0;const esc=w.esc||((x)=>String(x??''));const billsHtml=bills.length?bills.map(x=>'<div class="mcBill '+(x.completed?'done':'')+'"><label><input type="checkbox" '+(x.completed?'checked':'')+' onchange="moneyBillToggle(\''+x.id+'\')"> <span class="mcBillName">'+esc(x.title||'Bill')+'</span><div class="mcTiny">'+esc(x.date||'')+'</div></label><span class="mcAmt">'+money(x.amount)+'</span><button class="mcDanger" onclick="moneyBillDel(\''+x.id+'\')">×</button></div>').join(''):'<div class="mcTiny">No bills yet. Add your first one below ♡</div>';return w.shell('☕ MONEY CAFÉ','What do I actually have?','<div class="mcHero"><div class="mcBig">'+money(combined)+'</div><div class="mcSub">Income + current funds • combined available money</div></div><div class="mcGrid"><label class="mcCard"><small>💵 INCOME</small><input id="mcIncome" class="mcInput" type="number" step=".01" value="'+(D.money.income??'')+'" oninput="moneySet(\'income\',this.value)"></label><label class="mcCard"><small>💗 CURRENT FUNDS</small><input id="mcFunds" class="mcInput" type="number" step=".01" value="'+(D.money.funds??'')+'" oninput="moneySet(\'funds\',this.value)"></label><div class="mcCard"><small>☕ COMBINED</small><b>'+money(combined)+'</b></div><div class="mcCard"><small>🌷 LEFT AFTER PLAN</small><b>'+money(safe)+'</b></div></div><div class="card"><h2>📋 Planned Out</h2><div class="mcPlan"><label class="mcCard"><small>🏠 BILLS</small><b>'+money(billTotal)+'</b></label><label class="mcCard"><small>🛍 SPENDING</small><input class="mcInput" type="number" step=".01" value="'+(D.money.spend??'')+'" oninput="moneySet(\'spend\',this.value)"></label><label class="mcCard"><small>💰 SAVINGS</small><input class="mcInput" type="number" step=".01" value="'+(D.money.saving??'')+'" oninput="moneySet(\'saving\',this.value)"></label><label class="mcCard"><small>💳 DEBT</small><input class="mcInput" type="number" step=".01" value="'+(D.money.debt??'')+'" oninput="moneySet(\'debt\',this.value)"></label></div><div class="mcProgress"><i style="width:'+pct+'%"></i></div><div class="mcTiny">'+money(planned)+' planned • '+money(safe)+' remaining</div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>📋 Bill Tracker</h2><span class="pill">'+bills.filter(x=>!x.completed).length+' open</span></div>'+billsHtml+'<div class="mcRow"><input id="mcBillName" class="mcInput" placeholder="Bill name"><input id="mcBillAmount" class="mcInput" type="number" step=".01" placeholder="Amount"><input id="mcBillDate" class="mcInput" type="date" value="'+w.today()+'"><button class="mcBtn" onclick="moneyAddBill()">＋ Add</button></div></div><div class="mcMood"><b>🍓 Money Snapshot</b><div class="mcTiny">Bills '+money(billTotal)+' • Spending '+money(spend)+' • Savings '+money(saving)+' • Debt '+money(debt)+'</div><div class="mcWin">✨ Tiny money win: <input id="mcWin" class="mcInput" placeholder="I paid / saved / avoided…" value="'+esc(D.money.win||'')+'" oninput="moneySet(\'win\',this.value)"></div></div>')}w.moneySet=function(k,v){w.D.money=w.D.money||{};w.D.money[k]=k==='win'?v:(Number(v)||0);w.localStorage.setItem('sm_v16',JSON.stringify({data:w.D}));w.render()};w.moneyAddBill=function(){const n=d.getElementById('mcBillName')?.value.trim(),a=Number(d.getElementById('mcBillAmount')?.value)||0,date=d.getElementById('mcBillDate')?.value||w.today();if(!n)return;w.D.reminders=w.D.reminders||[];w.D.reminders.push({id:w.uid(),type:'bill',title:n,amount:a,date,completed:false});w.save()};w.moneyBillToggle=function(id){const x=w.D.reminders.find(r=>r.id===id);if(x){x.completed=!x.completed;w.save()}};w.moneyBillDel=function(id){w.D.reminders=w.D.reminders.filter(r=>r.id!==id);w.save()};if(w.page==='money')w.render()}catch(e){console.warn('V16 Money enhancement failed',e)}}async function hydrate(){if(hydrated)return;hydrated=true;try{const local=localData(),q=await client.from('planner_data').select('data').eq('user_id',user.id).maybeSingle();if(q.error)throw q.error;if(q.data?.data){frame.contentWindow.localStorage.setItem(KEY,JSON.stringify(q.data.data));frame.contentWindow.location.reload()}else if(local)await saveCloud(local);setStatus('☁️ V16 Synced')}catch(e){hydrated=false;setStatus('⚠️ Sync error')}}frame.addEventListener('load',enhanceMoney);async function enter(u){user=u;gate.classList.add('hidden');app.classList.remove('hidden');setStatus('☁️ Preparing V16…');if(frame.contentDocument?.readyState==='complete')enhanceMoney();frame.addEventListener('load',()=>hydrate(),{once:true});if(frame.contentDocument?.readyState==='complete')await hydrate()}document.getElementById('signin').onclick=async()=>{const {data,error}=await client.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return message(error.message);await enter(data.user)};document.getElementById('signup').onclick=async()=>{const {data,error}=await client.auth.signUp({email:email.value.trim(),password:password.value});if(error)return message(error.message);if(data.session)await enter(data.user);else message('Account created! Check your email to confirm it. 💕')};document.getElementById('logout').onclick=async()=>{await client.auth.signOut();location.reload()};client.auth.getSession().then(({data})=>{if(data.session)enter(data.session.user)})</script></body></html>
