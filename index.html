<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strawberry Mocha Planner 🍓</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--pink:#e98eaf;--soft:#fff0f5;--bg:#fbf4f1;--ink:#674941;--muted:#9a817b;--line:#ead7d2}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.app{min-height:100%;display:flex;flex-direction:column}.bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#fffaf7;border-bottom:1px solid var(--line);position:relative;z-index:10}.brand{font-weight:900;color:#bd6686}.status{font-size:11px;color:var(--muted)}.logout{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 10px;color:var(--ink);font-weight:800}.frame{border:0;width:100%;flex:1;min-height:calc(100vh - 52px);background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}.gate{position:fixed;inset:0;background:linear-gradient(135deg,#fff4f7,#fffaf5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.box{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:30px;padding:26px;box-shadow:0 18px 60px #67494118}.berry{font-size:54px}.ey{font-size:10px;letter-spacing:.14em;color:#bd6686;font-weight:900}.box h1{margin:7px 0;font-size:34px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font:inherit;margin:5px 0}.primary{width:100%;border:1px solid #efbfd0;background:var(--soft);color:#bd6686;border-radius:14px;padding:12px;font-weight:900;margin-top:8px}.secondary{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:11px;font-weight:800;margin-top:8px}.msg{margin-top:10px;padding:10px;border-radius:12px;background:var(--soft);font-size:12px;display:none}.sync{position:fixed;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:11px;box-shadow:0 8px 25px #67494112;z-index:30}.hidden{display:none!important}</style></head><body><div id="gate" class="gate"><div class="box"><div class="berry">🍓</div><div class="ey">STRAWBERRY MOCHA PLANNER V14</div><h1>Welcome home ♡</h1><p class="muted">Your planner has a cloud brain now.</p><input id="email" class="input" type="email" autocomplete="email" placeholder="Email address"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Password"><button id="signin" class="primary">☁️ Sign In</button><button id="signup" class="secondary">🌱 Create Account</button><div id="msg" class="msg"></div></div></div><div id="app" class="app hidden"><header class="bar"><div class="brand">🍓 Strawberry Mocha <span style="font-size:10px">V14</span></div><div><span id="status" class="status">☁️ Connecting…</span> <button id="logout" class="logout">Log out</button></div></header><iframe id="planner" class="frame" src="v14.html?v14=2" title="Strawberry Mocha Planner V14"></iframe><div id="sync" class="sync">☁️ Cloud sync ready</div></div><script>const SUPABASE_URL='https://sigjwmgekmrwehylvuvu.supabase.co';const SUPABASE_KEY='sb_publishable_CTqamiGR3_lXNW2mBx9wMA_ObemQMAC';const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const frame=document.getElementById('planner'),gate=document.getElementById('gate'),app=document.getElementById('app'),msg=document.getElementById('msg'),statusEl=document.getElementById('status'),syncEl=document.getElementById('sync');const KEY='sm_v10';let user=null,saveTimer=null,ready=false,hydrated=false;function message(t){msg.textContent=t;msg.style.display='block'}function setStatus(t){statusEl.textContent=t;syncEl.textContent=t}function localData(){try{return JSON.parse(frame.contentWindow.localStorage.getItem(KEY)||'null')}catch(e){return null}}async function saveCloud(data){const {error}=await client.from('planner_data').upsert({user_id:user.id,data:data},{onConflict:'user_id'});if(error)throw error}async function hydrate(){if(hydrated)return;hydrated=true;try{const local=localData(),q=await client.from('planner_data').select('data').eq('user_id',user.id).maybeSingle();if(q.error)throw q.error;if(q.data?.data){frame.contentWindow.localStorage.setItem(KEY,JSON.stringify(q.data.data));frame.contentWindow.location.reload()}else if(local)await saveCloud(local);ready=true;setStatus('☁️ Synced')}catch(e){hydrated=false;setStatus('⚠️ Sync error')}}async function enter(u){user=u;gate.classList.add('hidden');app.classList.remove('hidden');setStatus('☁️ Preparing V14…');if(frame.contentDocument?.readyState==='complete')await hydrate()}document.getElementById('signin').onclick=async()=>{const {data,error}=await client.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return message(error.message);await enter(data.user)};document.getElementById('signup').onclick=async()=>{const {data,error}=await client.auth.signUp({email:email.value.trim(),password:password.value});if(error)return message(error.message);if(data.session)await enter(data.user);else message('Account created! Check your email to confirm it. 💕')};document.getElementById('logout').onclick=async()=>{await client.auth.signOut();location.reload()};client.auth.getSession().then(({data})=>{if(data.session)enter(data.session.user)})</script></body></html>
