<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner V12.1.10 🍓</title><style>html,body{margin:0;width:100%;height:100%;background:#fbf5f2;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;overflow:hidden}</style></head><body><iframe id="root" src="./v12.1.9.html?navfix=12110" title="Strawberry Mocha Planner V12.1.10"></iframe><script>(()=>{const root=document.getElementById('root');function findPlanner(doc){if(!doc)return null;const p=doc.getElementById('plannerFrame');if(p&&p.contentDocument)return p.contentDocument;for(const f of [...doc.querySelectorAll('iframe')])if(f.contentDocument){const x=findPlanner(f.contentDocument);if(x)return x}return null}function boot(){const d=findPlanner(root.contentDocument);if(!d)return false;const nav=d.getElementById('nav');if(!nav)return false;if(d.getElementById('v12110style'))return true;const st=d.createElement('style');st.id='v12110style';st.textContent='.v12110-navfix{display:none!important}';d.head.appendChild(st);function activate(btn){const id=btn.dataset.page;if(!id)return;d.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===btn));d.defaultView?.scrollTo?.({top:0,behavior:'instant'})}nav.querySelectorAll('button[data-page]').forEach(btn=>{btn.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();activate(btn)},true)});return true}root.addEventListener('load',()=>{setTimeout(boot,500);setTimeout(boot,1500);setTimeout(boot,3000)});setTimeout(boot,1200)})();</script></body></html>
