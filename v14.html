<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4dce7"><title>Strawberry Mocha Planner V14 🍓</title><style>html,body{margin:0;width:100%;min-height:100%;background:#fbf5f2;overflow:auto}#app{display:block;width:100%;min-height:100vh;height:100vh;border:0;overflow:auto;-webkit-overflow-scrolling:touch}</style></head><body><iframe id="app" src="./v13.html?v14=1" title="Strawberry Mocha Planner V14"></iframe><script>(()=>{const f=document.getElementById('app');function fit(){try{const d=f.contentDocument;if(!d)return;d.documentElement.style.overflow='visible';d.body.style.overflow='visible';const p=d.querySelector('.page.active');f.style.height=Math.max(900,p?p.scrollHeight:d.documentElement.scrollHeight)+'px'}catch(e){}}function rename(d){try{const all=d.querySelectorAll('*');all.forEach(el=>{if(el.children.length===0&&el.textContent.includes('V12'))el.textContent=el.textContent.replaceAll('V12','V14')});if(d.title)d.title=d.title.replaceAll('V12','V14')}catch(e){}}function boot(){try{const d=f.contentDocument;if(!d)return;rename(d);fit();new MutationObserver(()=>{rename(d);fit()}).observe(d.body,{childList:true,subtree:true,characterData:true})}catch(e){}}f.addEventListener('load',()=>setTimeout(boot,200));window.addEventListener('resize',fit)})();</script></body></html>
