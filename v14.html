<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner V14 🍓</title><style>html,body{margin:0;background:#fbf5f2;overflow:auto}#app{display:block;width:100%;height:auto;min-height:900px;border:0}</style></head><body><iframe id="app" src="./v12.html?v14=11" title="Strawberry Mocha Planner V14"></iframe><script>(()=>{const f=document.getElementById('app'),KEY='sm_v10';const data=()=>{try{return JSON.parse(f.contentWindow.localStorage.getItem(KEY)||'{}')}catch(e){return{}}};const save=x=>f.contentWindow.localStorage.setItem(KEY,JSON.stringify(x));const v=x=>{x.v12=x.v12||{};return x.v12};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fit(){try{const d=f.contentDocument;if(!d)return;d.documentElement.style.overflow='visible';d.body.style.overflow='visible';d.documentElement.style.height='auto';d.body.style.height='auto';const p=d.querySelector('.page.active');f.style.height=Math.ceil(Math.max(d.documentElement.scrollHeight,d.body.scrollHeight,p?p.getBoundingClientRect().bottom:0,900)+30)+'px'}catch(e){}}function install(){const d=f.contentDocument;if(!d||!d.querySelector('#nav'))return;let b=d.querySelector('#nav button[data-page="tasks"]');if(!b){b=d.createElement('button');b.type='button';b.dataset.page='tasks';b.textContent='📝 Tasks';d.querySelector('#nav').appendChild(b)}let p=d.getElementById('tasks');if(!p){p=d.createElement('section');p.id='tasks';p.className='page';d.body.appendChild(p)}b.onclick=e=>{e.preventDefault();render(d)};fit()}function today(){return new Date().toISOString().slice(0,10)}function render(d){const p=d.getElementById('tasks'),s=data(),z=v(s),day=today(),tasks=(z.tasks||[]).filter(x=>x.date===day),rs=z.routines||[];p.innerHTML='<div class="hero"><div class="ey">📝 TASKS • V14</div><h1>Little things, one at a time. ♡</h1><p class="muted">Your daily tasks and routines, all in one cozy place.</p></div><div class="card"><div class="ey">✨ ADD A TASK</div><h2>What needs doing?</h2><div class="row"><input id="tn" class="input" placeholder="Task name"><select id="tc" class="input"><option>Personal</option><option>School</option><option>Home</option></select><button id="ta" class="primary">＋ Add task</button></div></div><div class="split"><div class="card"><div class="ey">🌷 TODAY</div><h2>Today's tasks</h2><div id="tl">'+(tasks.length?tasks.map((x,i)=>'<div class="eventItem"><button data-t="'+i+'">'+(x.done?'✓':'○')+'</button><b style="flex:1;margin-left:8px;'+(x.done?'text-decoration:line-through;opacity:.55':'')+'">'+esc(x.text)+'</b><button data-x="'+i+'">🗑️</button></div>').join(''):'<p class="muted">🌱 Nothing here yet. Tiny is allowed.</p>')+'</div></div><div class="card"><div class="ey">🎀 ROUTINES</div><h2>My routines</h2><div class="row"><input id="rn" class="input" placeholder="Routine name"><select id="rf" class="input"><option value="daily">Every day</option><option value="weekdays">Weekdays</option><option value="weekly">Weekly</option></select><button id="ra" class="primary">＋ Add</button></div><div id="rl">'+(rs.length?rs.map((r,i)=>'<div class="eventItem"><button data-r="'+i+'">'+(r.checks&&r.checks[day]?'✓':'○')+'</button><b style="flex:1;margin-left:8px">'+esc(r.name)+'</b><small>'+esc(r.frequency)+'</small><button data-rx="'+i+'">🗑️</button></div>').join(''):'<p class="muted">🎀 No routines yet.</p>')+'</div></div></div>';p.classList.add('active');d.querySelectorAll('.page').forEach(x=>{if(x!==p)x.classList.remove('active')});d.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));d.getElementById('ta').onclick=()=>{const n=d.getElementById('tn').value.trim();if(!n)return;z.tasks=z.tasks||[];z.tasks.push({text:n,category:d.getElementById('tc').value,date:day,done:false});save(s);render(d)};d.getElementById('ra').onclick=()=>{const n=d.getElementById('rn').value.trim();if(!n)return;z.routines=z.routines||[];z.routines.push({name:n,frequency:d.getElementById('rf').value,checks:{}});save(s);render(d)};p.querySelectorAll('[data-t]').forEach(q=>q.onclick=()=>{const arr=(z.tasks||[]).filter(x=>x.date===day),target=arr[+q.dataset.t];if(target){target.done=!target.done;save(s);render(d)}});p.querySelectorAll('[data-x]').forEach(q=>q.onclick=()=>{const arr=(z.tasks||[]).filter(x=>x.date===day),target=arr[+q.dataset.x];if(target){z.tasks=z.tasks.filter(x=>x!==target);save(s);render(d)}});p.querySelectorAll('[data-r]').forEach(q=>q.onclick=()=>{const r=z.routines[+q.dataset.r];r.checks=r.checks||{};r.checks[day]=!r.checks[day];save(s);render(d)});p.querySelectorAll('[data-rx]').forEach(q=>q.onclick=()=>{z.routines.splice(+q.dataset.rx,1);save(s);render(d)})}f.addEventListener('load',()=>setTimeout(install,250));setInterval(install,1500);window.addEventListener('resize',fit)})();</script></body></html>
