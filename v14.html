<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner V14 🍓</title><style>html,body{margin:0;width:100%;min-height:100%;background:#fbf5f2;overflow:auto}#app{display:block;width:100%;min-height:0;height:auto;border:0;overflow:visible}</style></head><body><iframe id="app" src="./v13.html?v13=8&v14=7" title="Strawberry Mocha Planner V14"></iframe><script>(()=>{const root=document.getElementById('app');const KEY='sm_v10';function data(d){try{return JSON.parse(d.defaultView.localStorage.getItem(KEY)||'{}')}catch(e){return{}}}function save(d,x){d.defaultView.localStorage.setItem(KEY,JSON.stringify(x))}function vdata(x){x.v12=x.v12||{};return x.v12}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clean(d){try{if(!d)return;d.documentElement.style.overflow='visible';d.body.style.overflow='visible';d.documentElement.style.height='auto';d.body.style.height='auto';let st=d.getElementById('v14cleanup');if(!st){st=d.createElement('style');st.id='v14cleanup';d.head.appendChild(st)}st.textContent='.top{display:none!important}html,body{height:auto!important;min-height:0!important;overflow:visible!important}iframe{display:block!important;width:100%!important;min-height:0!important;overflow:visible!important;border:0!important}.page.active{height:auto!important;min-height:0!important;overflow:visible!important}.page.active .calendar,.page.active .card{max-height:none!important;overflow:visible!important}.v14tasks{max-width:1050px;margin:0 auto}.v14taskbox{background:linear-gradient(135deg,#fff0f5,#fffaf5);border:1px solid #eedde1;border-radius:27px;padding:20px;margin:12px 0;box-shadow:0 10px 28px #6749410b}.v14taskgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.v14taskitem{background:#fff;border:1px solid #eedde1;border-radius:20px;padding:14px;margin:9px 0;display:flex;gap:12px;align-items:center}.v14taskitem.done{opacity:.58}.v14taskitem.done b{text-decoration:line-through}.v14check{width:24px;height:24px;border:2px solid #e7b5c8;border-radius:8px;background:#fff;flex:0 0 auto;font-size:15px}.v14taskinfo{flex:1}.v14taskinfo small{display:block;color:#99817a;margin-top:4px}.v14del{border:0;background:transparent;font-size:18px}.v14routine{background:#fff8fb;border:1px dashed #e8b5c9;border-radius:18px;padding:12px;margin:8px 0}.v14pill{display:inline-block;background:#fff0f5;color:#b96c88;border-radius:12px;padding:5px 9px;font-size:11px;font-weight:800}@media(max-width:760px){.v14taskgrid{grid-template-columns:1fr}}</style>}catch(e){}}function fit(d){try{clean(d);let bottom=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight,900);for(const child of [...d.querySelectorAll('iframe')]){const h=fit(child.contentDocument);child.style.height=h+'px';child.style.minHeight=h+'px';bottom=Math.max(bottom,child.offsetTop+h+20)}return Math.ceil(bottom)}catch(e){return 900}}function sync(){try{const h=fit(root.contentDocument);root.style.height=h+'px';root.style.minHeight=h+'px'}catch(e){}}function todayKey(){const x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}function taskPage(d){clean(d);let p=d.getElementById('tasks');if(!p){p=d.createElement('section');p.id='tasks';p.className='page';d.querySelector('main')?.appendChild(p);if(!p.parentElement){d.body.appendChild(p)}}p.innerHTML='<div class="v14tasks"><div class="hero"><div class="ey">📝 TASKS • V14</div><h1>Little things, one at a time. ♡</h1><p class="muted">Your routines and tasks live here, then feed back into your planner.</p></div><div class="v14taskbox"><div class="ey">✨ ADD A TASK</div><h2>What needs doing?</h2><div class="row"><input id="v14tn" class="input" placeholder="Task name"><select id="v14tc" class="input"><option>Today</option><option>School</option><option>Home</option><option>Personal</option></select><button id="v14ta" class="primary">＋ Add task</button></div></div><div class="v14taskgrid"><div class="card"><div class="ey">🌷 TODAY</div><h2>Today's tasks</h2><div id="v14tl"></div></div><div class="card"><div class="ey">🎀 ROUTINES</div><h2>My routines</h2><div class="row"><input id="v14rn" class="input" placeholder="Routine name"><select id="v14rf" class="input"><option value="daily">Every day</option><option value="weekdays">Weekdays</option><option value="weekly">Weekly</option></select><button id="v14ra" class="primary">＋ Add routine</button></div><div id="v14rl"></div></div></div></div>';renderTasks(d);d.querySelector('#v14ta').onclick=()=>{const n=d.getElementById('v14tn').value.trim();if(!n)return;const s=data(d),v=vdata(s);v.tasks=v.tasks||[];v.tasks.push({text:n,category:d.getElementById('v14tc').value,done:false,date:todayKey()});save(d,s);taskPage(d);fit(d)};d.querySelector('#v14ra').onclick=()=>{const n=d.getElementById('v14rn').value.trim();if(!n)return;const s=data(d),v=vdata(s);v.routines=v.routines||[];v.routines.push({name:n,frequency:d.getElementById('v14rf').value,checks:{}});save(d,s);taskPage(d);fit(d)};fit(d)}function renderTasks(d){const s=data(d),v=vdata(s),day=todayKey();const tasks=(v.tasks||[]).filter(x=>!x.date||x.date===day);const tl=d.getElementById('v14tl');tl.innerHTML=tasks.length?tasks.map((x,i)=>'<div class="v14taskitem '+(x.done?'done':'')+'"><button class="v14check" data-task="'+i+'">'+(x.done?'✓':'')+'</button><div class="v14taskinfo"><b>'+esc(x.text)+'</b><small>'+esc(x.category||'Personal')+'</small></div><button class="v14del" data-tdel="'+i+'">🗑️</button></div>').join(''):'<div class="v14taskbox" style="text-align:center">🌱<br><b>Nothing on today's list yet.</b><p class="muted">Add a tiny task. Tiny is allowed here.</p></div>';const routines=v.routines||[];const rl=d.getElementById('v14rl');rl.innerHTML=routines.length?routines.map((r,i)=>{const active=r.frequency==='daily'||(r.frequency==='weekdays'&&new Date().getDay()>=1&&new Date().getDay()<=5)||(r.frequency==='weekly'&&new Date().getDay()===1);const checked=!!(r.checks&&r.checks[day]);return '<div class="v14routine"><div style="display:flex;align-items:center;gap:10px"><button class="v14check" data-routine="'+i+'">'+(checked?'✓':'')+'</button><div class="v14taskinfo"><b>'+esc(r.name)+'</b><small>'+({'daily':'Every day','weekdays':'Weekdays','weekly':'Weekly'}[r.frequency]||r.frequency)+(active?' • Today':' • Rest day')+'</small></div><button class="v14del" data-rdel="'+i+'">🗑️</button></div></div>'}).join(''):'<div class="v14taskbox" style="text-align:center">🎀<br><b>No routines yet.</b><p class="muted">Build your little rhythm here.</p></div>';tl.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const arr=(v.tasks||[]).filter(x=>!x.date||x.date===day);const target=arr[+b.dataset.task];const real=(v.tasks||[]).find(x=>x===target);if(real){real.done=!real.done;save(d,s);taskPage(d)}});tl.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{const arr=(v.tasks||[]).filter(x=>!x.date||x.date===day),target=arr[+b.dataset.tdel];v.tasks=(v.tasks||[]).filter(x=>x!==target);save(d,s);taskPage(d)});rl.querySelectorAll('[data-routine]').forEach(b=>b.onclick=()=>{const r=v.routines[+b.dataset.routine];r.checks=r.checks||{};r.checks[day]=!r.checks[day];save(d,s);taskPage(d)});rl.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{v.routines.splice(+b.dataset.rdel,1);save(d,s);taskPage(d)})}function activateTask(d){const nav=d.querySelector('#nav');if(!nav)return;if(!d.getElementById('tasks')){const p=d.createElement('section');p.id='tasks';p.className='page';(d.querySelector('main')||d.body).appendChild(p)}let b=nav.querySelector('button[data-page="tasks"]');if(!b){b=d.createElement('button');b.type='button';b.dataset.page='tasks';b.textContent='📝 Tasks';const today=nav.querySelector('button[data-page="today"]');if(today)today.insertAdjacentElement('afterend',b);else nav.appendChild(b)}b.onclick=e=>{e.preventDefault();d.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='tasks'));nav.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));taskPage(d);d.defaultView.scrollTo(0,0);sync()}}function boot(){try{const d=root.contentDocument;if(!d)return;clean(d);activateTask(d);sync()}catch(e){}}root.addEventListener('load',()=>setTimeout(boot,200));setInterval(boot,1000);window.addEventListener('resize',sync);sync()})();</script></body></html>
