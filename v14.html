<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4dce7"><title>Strawberry Mocha Planner V14 🍓</title><style>html,body{margin:0;width:100%;min-height:100%;background:#fbf5f2;overflow:auto}#app{display:block;width:100%;min-height:0;height:auto;border:0;overflow:visible}</style></head><body><iframe id="app" src="./v13.html?v13=9&v14=8" title="Strawberry Mocha Planner V14"></iframe><script>(()=>{const root=document.getElementById('app'),KEY='sm_v10';function deep(){let d=root.contentDocument;if(!d)return null;for(let i=0;i<6;i++){const f=d.querySelector('body>iframe,#app');if(!f||!f.contentDocument)break;d=f.contentDocument}return d}function data(d){try{return JSON.parse(d.defaultView.localStorage.getItem(KEY)||'{}')}catch(e){return{}}}function save(d,x){try{d.defaultView.localStorage.setItem(KEY,JSON.stringify(x))}catch(e){}}function vdata(x){x.v12=x.v12||{};return x.v12}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function decorate(d){if(!d)return;d.documentElement.style.overflow='visible';d.body.style.overflow='visible';d.documentElement.style.height='auto';d.body.style.height='auto';let s=d.getElementById('v14taskstyle');if(!s){s=d.createElement('style');s.id='v14taskstyle';d.head.appendChild(s)}s.textContent='.v14tasks{max-width:1050px;margin:0 auto;padding-bottom:30px}.v14taskbox{background:linear-gradient(135deg,#fff0f5,#fffaf5);border:1px solid #eedde1;border-radius:27px;padding:20px;margin:12px 0;box-shadow:0 10px 28px #6749410b}.v14taskgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.v14taskitem{background:#fff;border:1px solid #eedde1;border-radius:20px;padding:14px;margin:9px 0;display:flex;gap:12px;align-items:center}.v14taskitem.done{opacity:.58}.v14taskitem.done b{text-decoration:line-through}.v14check{width:24px;height:24px;border:2px solid #e7b5c8;border-radius:8px;background:#fff;flex:0 0 auto;font-size:15px}.v14taskinfo{flex:1}.v14taskinfo small{display:block;color:#99817a;margin-top:4px}.v14del{border:0;background:transparent;font-size:18px}.v14routine{background:#fff8fb;border:1px dashed #e8b5c9;border-radius:18px;padding:12px;margin:8px 0}.v14empty{text-align:center;padding:30px 12px}.v14empty .big{font-size:46px}@media(max-width:760px){.v14taskgrid{grid-template-columns:1fr}}';}function fit(){try{function walk(d){decorate(d);let h=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight,900);for(const f of [...d.querySelectorAll('iframe')]){const ch=f.contentDocument;if(ch){const chh=walk(ch);f.style.height=chh+'px';f.style.minHeight=chh+'px';h=Math.max(h,f.offsetTop+chh+20)}}return Math.ceil(h)}root.style.height=walk(root.contentDocument)+'px';root.style.minHeight=root.style.height}catch(e){}}function todayKey(){const x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}function ensurePage(d){let p=d.getElementById('tasks');if(!p){p=d.createElement('section');p.id='tasks';p.className='page';(d.querySelector('main')||d.body).appendChild(p)}return p}function render(d){const p=ensurePage(d),s=data(d),v=vdata(s),day=todayKey(),tasks=(v.tasks||[]).filter(x=>!x.date||x.date===day),routines=v.routines||[];p.innerHTML='<div class="v14tasks"><div class="hero"><div class="ey">📝 TASKS • V14</div><h1>Little things, one at a time. ♡</h1><p class="muted">Your routines and daily tasks, all in one cozy place.</p></div><div class="v14taskbox"><div class="ey">✨ ADD A TASK</div><h2>What needs doing?</h2><div class="row"><input id="v14tn" class="input" placeholder="Task name"><select id="v14tc" class="input"><option>Today</option><option>School</option><option>Home</option><option>Personal</option></select><button id="v14ta" class="primary">＋ Add task</button></div></div><div class="v14taskgrid"><div class="card"><div class="ey">🌷 TODAY</div><h2>Today's tasks</h2><div id="v14tl">'+(tasks.length?tasks.map((x,i)=>'<div class="v14taskitem '+(x.done?'done':'')+'"><button class="v14check" data-task="'+i+'">'+(x.done?'✓':'')+'</button><div class="v14taskinfo"><b>'+esc(x.text)+'</b><small>'+esc(x.category||'Personal')+'</small></div><button class="v14del" data-tdel="'+i+'">🗑️</button></div>').join(''):'<div class="v14empty">🌱<div><b>Nothing on today’s list yet.</b></div><p class="muted">Tiny is absolutely allowed.</p></div>')+'</div></div><div class="card"><div class="ey">🎀 ROUTINES</div><h2>My routines</h2><div class="row"><input id="v14rn" class="input" placeholder="Routine name"><select id="v14rf" class="input"><option value="daily">Every day</option><option value="weekdays">Weekdays</option><option value="weekly">Weekly</option></select><button id="v14ra" class="primary">＋ Add routine</button></div><div id="v14rl">'+(routines.length?routines.map((r,i)=>{const active=r.frequency==='daily'||(r.frequency==='weekdays'&&new Date().getDay()>=1&&new Date().getDay()<=5)||(r.frequency==='weekly'&&new Date().getDay()===1),checked=!!(r.checks&&r.checks[day]);return '<div class="v14routine"><div style="display:flex;align-items:center;gap:10px"><button class="v14check" data-routine="'+i+'">'+(checked?'✓':'')+'</button><div class="v14taskinfo"><b>'+esc(r.name)+'</b><small>'+({'daily':'Every day','weekdays':'Weekdays','weekly':'Weekly'}[r.frequency]||r.frequency)+(active?' • Today':' • Rest day')+'</small></div><button class="v14del" data-rdel="'+i+'">🗑️</button></div></div>'}).join(''):'<div class="v14empty">🎀<div><b>No routines yet.</b></div><p class="muted">Build your little rhythm here.</p></div>')+'</div></div></div></div>';p.classList.add('active');d.querySelectorAll('.page').forEach(x=>{if(x!==p)x.classList.remove('active')});const nav=d.querySelector('#nav');if(nav)nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page==='tasks'));p.querySelector('#v14ta').onclick=()=>{const n=d.getElementById('v14tn').value.trim();if(!n)return;const z=data(d),q=vdata(z);q.tasks=q.tasks||[];q.tasks.push({text:n,category:d.getElementById('v14tc').value,done:false,date:day});save(d,z);render(d);fit()};p.querySelector('#v14ra').onclick=()=>{const n=d.getElementById('v14rn').value.trim();if(!n)return;const z=data(d),q=vdata(z);q.routines=q.routines||[];q.routines.push({name:n,frequency:d.getElementById('v14rf').value,checks:{}});save(d,z);render(d);fit()};p.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const z=data(d),q=vdata(z),arr=(q.tasks||[]).filter(x=>!x.date||x.date===day),target=arr[+b.dataset.task];if(target){target.done=!target.done;save(d,z);render(d);fit()}});p.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{const z=data(d),q=vdata(z),arr=(q.tasks||[]).filter(x=>!x.date||x.date===day),target=arr[+b.dataset.tdel];q.tasks=(q.tasks||[]).filter(x=>x!==target);save(d,z);render(d);fit()});p.querySelectorAll('[data-routine]').forEach(b=>b.onclick=()=>{const z=data(d),q=vdata(z),r=q.routines[+b.dataset.routine];r.checks=r.checks||{};r.checks[day]=!r.checks[day];save(d,z);render(d);fit()});p.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{const z=data(d),q=vdata(z);q.routines.splice(+b.dataset.rdel,1);save(d,z);render(d);fit()})}function boot(){try{const d=deep();if(!d)return;decorate(d);const nav=d.querySelector('#nav');if(!nav)return;let b=nav.querySelector('button[data-page="tasks"]');if(!b){b=d.createElement('button');b.type='button';b.dataset.page='tasks';b.textContent='📝 Tasks';const today=nav.querySelector('button[data-page="today"]');if(today)today.insertAdjacentElement('afterend',b);else nav.appendChild(b)}b.onclick=e=>{e.preventDefault();render(d);d.defaultView.scrollTo(0,0);fit()};fit()}catch(e){}}root.addEventListener('load',()=>setTimeout(boot,250));setInterval(boot,1500);window.addEventListener('resize',fit);setTimeout(boot,500)})();</script></body></html>
