<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner V14 🍓</title><style>html,body{margin:0;width:100%;min-height:100%;background:#fbf5f2;overflow:auto}#app{display:block;width:100%;min-height:0;height:auto;border:0;overflow:visible}</style></head><body><iframe id="app" src="./v13.html?v13=7&v14=6" title="Strawberry Mocha Planner V14"></iframe><script>(()=>{const root=document.getElementById('app');function clean(d){try{if(!d)return;d.documentElement.style.overflow='visible';d.body.style.overflow='visible';d.documentElement.style.height='auto';d.body.style.height='auto';let st=d.getElementById('v14cleanup');if(!st){st=d.createElement('style');st.id='v14cleanup';d.head.appendChild(st)}st.textContent='.top{display:none!important}html,body{height:auto!important;min-height:0!important;overflow:visible!important}iframe{display:block!important;width:100%!important;min-height:0!important;overflow:visible!important;border:0!important}.page.active{height:auto!important;min-height:0!important;overflow:visible!important}.page.active .calendar,.page.active .card{max-height:none!important;overflow:visible!important}';d.title=d.title.replaceAll('V12','V14').replaceAll('V13','V14')}catch(e){}}function measure(d){try{clean(d);let bottom=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight,900);for(const child of [...d.querySelectorAll('iframe')]){const h=measure(child.contentDocument);child.style.height=h+'px';child.style.minHeight=h+'px';bottom=Math.max(bottom,child.offsetTop+h+20)}return Math.ceil(bottom)}catch(e){return 900}}function sync(){try{const h=measure(root.contentDocument);root.style.height=h+'px';root.style.minHeight=h+'px'}catch(e){}}root.addEventListener('load',()=>setTimeout(sync,200));setInterval(sync,1000);window.addEventListener('resize',sync);sync()})();</script></body></html>
