<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4dce7"><title>Strawberry Mocha Planner V14 🍓</title><style>html,body{margin:0;width:100%;min-height:100%;background:#fbf5f2;overflow:auto}#app{display:block;width:100%;min-height:100vh;height:100vh;border:0;overflow:auto;-webkit-overflow-scrolling:touch}</style></head><body><iframe id="app" src="./v13.html?v14=2" title="Strawberry Mocha Planner V14"></iframe><script>(()=>{const f=document.getElementById('app');function renameAndClean(d){try{if(!d)return;const style=d.createElement('style');style.id='v14cleanup';style.textContent='.top{display:none!important}';if(!d.getElementById('v14cleanup'))d.head.appendChild(style);if(d.title)d.title=d.title.replaceAll('V12','V14').replaceAll('V13','V14');d.querySelectorAll('*').forEach(el=>{if(el.children.length===0&&el.textContent){el.textContent=el.textContent.replaceAll('V12','V14').replaceAll('V13','V14')}});d.querySelectorAll('iframe').forEach(child=>{try{if(child.contentDocument)renameAndClean(child.contentDocument);child.addEventListener('load',()=>setTimeout(()=>renameAndClean(child.contentDocument),50))}catch(e){}})}catch(e){}}function fit(){try{const d=f.contentDocument;if(!d)return;const nested=d.querySelector('iframe');const inner=nested&&nested.contentDocument;const p=(inner&&inner.querySelector('.page.active'))||d.querySelector('.page.active');d.documentElement.style.overflow='visible';d.body.style.overflow='visible';if(inner){inner.documentElement.style.overflow='visible';inner.body.style.overflow='visible'}f.style.height=Math.max(900,p?p.scrollHeight:d.documentElement.scrollHeight)+'px'}catch(e){}}function boot(){renameAndClean(f.contentDocument);fit()}f.addEventListener('load',()=>setTimeout(boot,150));setInterval(boot,1500);window.addEventListener('resize',fit)})();</script></body></html>
