<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner V14 🍓</title><style>html,body{margin:0;width:100%;min-height:100%;background:#fbf5f2;overflow:auto}#app{display:block;width:100%;min-height:0;height:auto;border:0;overflow:visible}</style></head><body><iframe id="app" src="./v13.html?v14=3" title="Strawberry Mocha Planner V14"></iframe><script>(()=>{const f=document.getElementById('app');function clean(d){try{if(!d)return;d.documentElement.style.overflow='visible';d.body.style.overflow='visible';d.body.style.height='auto';d.documentElement.style.height='auto';let st=d.getElementById('v14cleanup');if(!st){st=d.createElement('style');st.id='v14cleanup';d.head.appendChild(st)}st.textContent='.top{display:none!important}html,body{height:auto!important;min-height:0!important;overflow:visible!important}iframe{display:block!important;width:100%!important;min-height:0!important;overflow:visible!important;border:0!important}';d.title=d.title.replaceAll('V12','V14').replaceAll('V13','V14');d.querySelectorAll('*').forEach(el=>{if(el.children.length===0&&el.textContent)el.textContent=el.textContent.replaceAll('V12','V14').replaceAll('V13','V14')})}catch(e){}}function size(fr){try{const d=fr.contentDocument;if(!d)return 900;clean(d);let total=0;for(const child of [...d.querySelectorAll('iframe')]){const h=size(child);child.style.height=h+'px';child.style.minHeight=h+'px';total=Math.max(total,h)}const h=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight,total,900);fr.style.height=h+'px';fr.style.minHeight=h+'px';return h}catch(e){return 900}}function sync(){size(f)}f.addEventListener('load',()=>setTimeout(sync,150));setInterval(sync,1200);window.addEventListener('resize',sync);sync()})();</script></body></html>
