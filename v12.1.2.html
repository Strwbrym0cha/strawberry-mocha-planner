<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner V12.1.2 🍓</title><style>html,body{margin:0;background:#fbf5f2}iframe{display:block;width:100%;height:100vh;min-height:900px;border:0}</style></head><body><iframe id="shell" src="./v12.1.html?goalsfix=1212" title="Strawberry Mocha Planner V12.1.2"></iframe><script>(()=>{const shell=document.getElementById('shell');const KEY='sm_v10';const findDoc=()=>{try{const a=shell.contentDocument;if(!a)return null;const f=a.getElementById('plannerFrame');return f&&f.contentDocument?f.contentDocument:a}catch(e){return null}};const run=()=>{const d=findDoc();if(!d)return false;const page=d.getElementById('goals'),nav=d.getElementById('nav');if(!page||!nav)return false;if(d.getElementById('v1212GoalStyle'))return true;const st=d.createElement('style');st.id='v1212GoalStyle';st.textContent='.v1212-goal-card{border:1px solid #eadbd6;border-radius:20px;padding:15px;margin:9px 0;background:#fff}.v1212-goal-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.v1212-goal-actions button{flex:1}.v1212-goal-empty{padding:14px;color:#99817a}';d.head.appendChild(st);page.innerHTML='<div class="hero"><div class="ey">✨ GOALS</div><h1>Leave breadcrumbs for future you.</h1><p class="muted">Turn big ideas into tiny, visible steps.</p></div><div class="card"><div class="row"><input id="v1212Goal" class="input" placeholder="Goal"><input id="v1212Step" class="input" placeholder="Next tiny step"><button id="v1212Add" class="primary">＋ Save Goal</button></div><div id="v1212List"></div></div>';const load=()=>{try{return JSON.parse(d.defaultView.localStorage.getItem(KEY)||'{}')}catch(e){return{}}};const save=s=>d.defaultView.localStorage.setItem(KEY,JSON.stringify(s));const state=s=>(s.v12=s.v12||{},s.v12);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=t=>{const x=d.getElementById('toast');if(x){x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1600)}};const render=()=>{const s=load(),g=state(s).goals||[],list=d.getElementById('v1212List');list.innerHTML=g.length?g.map((x,i)=>'<div class="v1212-goal-card"><b>✨ '+esc(x.goal)+'</b><p class="muted">Next tiny step: '+esc(x.step||'Choose one tiny step.')+'</p><div class="v1212-goal-actions"><button data-complete="'+i+'" class="primary">✓ Complete</button><button data-archive="'+i+'">🗄️ Archive</button></div></div>').join(''):'<div class="v1212-goal-empty">No goals yet. Add one tiny thing to start. ♡</div>';list.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{const s=load(),i=+b.dataset.complete,g=state(s).goals||[];g.splice(i,1);state(s).wins=(state(s).wins||0)+1;state(s).completedGoals=(state(s).completedGoals||0)+1;save(s);render();toast('Goal completed! 🏆')});list.querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>{const s=load(),i=+b.dataset.archive,g=state(s).goals||[];const item=g.splice(i,1)[0];state(s).archive=state(s).archive||[];state(s).archive.push({type:'goal',item,archivedAt:new Date().toISOString()});save(s);render();toast('Goal archived 🗄️')})};d.getElementById('v1212Add').onclick=()=>{const goal=d.getElementById('v1212Goal').value.trim(),step=d.getElementById('v1212Step').value.trim();if(!goal){toast('Name the goal first ✨');return}const s=load();state(s).goals=state(s).goals||[];state(s).goals.push({goal,step,createdAt:new Date().toISOString()});save(s);d.getElementById('v1212Goal').value='';d.getElementById('v1212Step').value='';render();toast('Goal saved ✨')};const btn=nav.querySelector('[data-page="goals"]');if(btn)btn.onclick=()=>{d.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p===page));nav.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===btn));render()};render();return true};const attempt=()=>{if(!run())setTimeout(attempt,300)};shell.addEventListener('load',()=>setTimeout(attempt,300));setTimeout(attempt,800);})();</script></body></html>
