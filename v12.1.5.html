<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner V12.1.5 🍓</title><style>html,body{margin:0;width:100%;height:100%;background:#fbf5f2;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;overflow:hidden}</style></head><body><iframe id="shell" src="./v12.1.4.html?polish=1215" title="Strawberry Mocha Planner V12.1.5"></iframe><script>(()=>{const outer=document.getElementById('shell'),KEY='sm_v10';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const load=d=>{try{return JSON.parse(d.defaultView.localStorage.getItem(KEY)||'{}')}catch(e){return{}}};const save=(d,s)=>d.defaultView.localStorage.setItem(KEY,JSON.stringify(s));const st=s=>(s.v12=s.v12||{},s.v12);const toast=(d,t)=>{const x=d.getElementById('toast');if(x){x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1600)}};function deepest(doc){let cur=doc;for(let i=0;i<10;i++){const fs=[...cur.querySelectorAll('iframe')];if(!fs.length)break;const f=fs.find(x=>x.contentDocument&&x.contentDocument.querySelector('.app'))||fs[0];if(!f.contentDocument)break;cur=f.contentDocument}return cur}function style(d){if(d.getElementById('v1215style'))return;const s=d.createElement('style');s.id='v1215style';s.textContent=`.v15wrap{background:#fff;border:1px solid #eadbd6;border-radius:24px;padding:18px;box-shadow:0 12px 35px #67494110;margin:10px 0}.v15head{display:flex;justify-content:space-between;align-items:center;gap:10px}.v15list{margin-top:12px}.v15item{border:1px solid #f0dfe3;border-radius:18px;padding:12px;margin:8px 0;background:#fffaf6}.v15item.done{opacity:.65;background:#fff4f7}.v15row{display:flex;align-items:center;gap:9px}.v15row b{flex:1}.v15muted{color:#99817a;font-size:12px}.v15actions{display:flex;gap:7px;margin-top:9px}.v15actions button{flex:1}.v15filter{display:flex;gap:7px;overflow:auto;margin:12px 0}.v15filter button{white-space:nowrap}.v15filter .on{background:#fff0f5;border-color:#efbfd0;color:#b96c88}.v15garden{background:linear-gradient(#fffaf6 0 61%,#ead8cc 61%);border:1px solid #eadbd6;border-radius:24px;padding:18px;min-height:330px;position:relative;overflow:hidden}.v15plants{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:relative;z-index:2}.v15plant{background:#fffaf6;border:1px solid #f0dfe3;border-radius:20px;padding:10px;text-align:center}.v15pot{font-size:44px;line-height:1}.v15plant b{display:block;font-size:13px}.v15plant small{color:#99817a}.v15grow{height:6px;background:#f0e4e6;border-radius:99px;margin-top:7px;overflow:hidden}.v15grow i{display:block;height:100%;background:#e99ab7;border-radius:99px}.v15add{border:2px dashed #efbfd0!important;background:#fff0f5!important;color:#b96c88!important}.v15x{flex:0 0 auto!important;min-width:40px}.v15form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}@media(max-width:700px){.v15plants{grid-template-columns:repeat(2,1fr)}.v15form{grid-template-columns:1fr}.v15form button{width:100%}}`;d.head.appendChild(s)}function reminders(d){const p=d.getElementById('reminders');if(!p)return;p.innerHTML=`<div class="v15wrap"><div class="v15head"><div><div class="ey">🔔 REMINDERS</div><h1>You've got this. ♡</h1><p class="muted">Everything important, all in one place.</p></div><button id="v15AddRem" class="primary">＋ Add Reminder</button></div><div class="v15filter"><button class="on" data-filter="all">All</button><button data-filter="today">Today</button><button data-filter="upcoming">Upcoming</button><button data-filter="done">Completed</button></div><div id="v15RemList" class="v15list"></div><p class="muted">🍓 Stay on top of the little things. ♡</p></div>`;let filter='all';const render=()=>{let s=load(d),arr=st(s).reminders||[],today=new Date().toISOString().slice(0,10);if(filter==='today')arr=arr.filter(x=>x.date===today&&!x.done);if(filter==='upcoming')arr=arr.filter(x=>x.date>today&&!x.done);if(filter==='done')arr=arr.filter(x=>x.done);const box=d.getElementById('v15RemList');box.innerHTML=arr.length?arr.map(x=>`<div class="v15item ${x.done?'done':''}"><div class="v15row"><button class="v15x" data-toggle="${esc(x.id)}">${x.done?'✓':'○'}</button><b>${esc(x.text)}</b><span class="pill">${esc(x.date||'No date')}</span><button class="v15x" data-del="${esc(x.id)}">×</button></div></div>`).join(''):'<div class="v15muted">No reminders yet. Add one above and Future Kat will thank you. ♡</div>';box.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let s=load(d),x=(st(s).reminders||[]).find(r=>r.id===b.dataset.toggle);if(x){x.done=!x.done;save(d,s);render()}});box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let s=load(d);st(s).archive=st(s).archive||[];let a=st(s).reminders||[],i=a.findIndex(r=>r.id===b.dataset.del);if(i>=0)st(s).archive.push({type:'reminder',item:a.splice(i,1)[0],archivedAt:new Date().toISOString()});save(d,s);render();toast(d,'Reminder archived 🗄️')})};d.getElementById('v15AddRem').onclick=()=>{const box=d.getElementById('v15RemList');const form=d.createElement('div');form.className='v15form';form.innerHTML='<input id="v15rt" class="input" placeholder="Reminder"><input id="v15rd" class="input" type="date"><button id="v15rs" class="primary">Save</button>';box.before(form);d.getElementById('v15rs').onclick=()=>{let text=d.getElementById('v15rt').value.trim(),date=d.getElementById('v15rd').value||new Date().toISOString().slice(0,10);if(!text){toast(d,'Give the reminder a name 🔔');return}let s=load(d);st(s).reminders=st(s).reminders||[];st(s).reminders.push({id:'rem_'+Date.now(),text,date,done:false,createdAt:new Date().toISOString()});save(d,s);form.remove();render();toast(d,'Reminder saved 🔔')}};p.querySelectorAll('.v15filter button').forEach(b=>b.onclick=()=>{p.querySelectorAll('.v15filter button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()});render()}function garden(d){const p=d.getElementById('garden');if(!p)return;p.innerHTML=`<div class="hero"><div class="ey">🌷 HABIT GARDEN</div><h1>Grow what matters.</h1><p class="muted">Small check-ins grow into something you can see.</p></div><div class="v15wrap"><div class="v15head"><div><h2>🌱 Your little garden</h2><p class="muted">Check a habit today. You can remove one anytime with ×.</p></div><button id="v15AddHabit" class="primary">＋ Add Habit</button></div><div id="v15HabitList" class="v15garden"></div></div>`;const render=()=>{let s=load(d),arr=st(s).gardenHabits||[],today=new Date().toISOString().slice(0,10),box=d.getElementById('v15HabitList');box.innerHTML='<div class="v15plants">'+(arr.length?arr.map((h,i)=>{const checked=(h.days||[]).includes(today),count=(h.days||[]).length,pct=Math.min(100,Math.round((count%7)/7*100));return `<div class="v15plant"><div class="v15pot">${h.emoji||'🌷'}</div><b>${esc(h.name)}</b><small>${count} check-in${count===1?'':'s'}</small><div class="v15grow"><i style="width:${pct}%"></i></div><div class="v15actions"><button data-check="${i}" class="${checked?'primary':''}">${checked?'✓ Today':'＋ Today'}</button><button data-remove="${i}" class="v15x">×</button></div></div>`}).join(''):'<div class="v15plant v15add"><div class="v15pot">🌱</div><b>Plant your first habit</b><small>Start growing</small></div>')+'</div>';box.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let s=load(d),h=st(s).gardenHabits[+b.dataset.check],days=h.days||[],idx=days.indexOf(today);idx>=0?days.splice(idx,1):days.push(today);h.days=days;save(d,s);render()});box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let s=load(d),h=st(s).gardenHabits.splice(+b.dataset.remove,1)[0];st(s).archive=st(s).archive||[];st(s).archive.push({type:'habit',item:h,archivedAt:new Date().toISOString()});save(d,s);render();toast(d,'Habit archived 🗄️')})};d.getElementById('v15AddHabit').onclick=()=>{const form=d.createElement('div');form.className='v15form';form.innerHTML='<input id="v15hn" class="input" placeholder="Habit"><input id="v15he" class="input" placeholder="Emoji e.g. 🌷"><button id="v15hs" class="primary">Plant</button>';p.querySelector('.v15wrap').appendChild(form);d.getElementById('v15hs').onclick=()=>{let name=d.getElementById('v15hn').value.trim();if(!name){toast(d,'Name the habit first 🌱');return}let s=load(d);st(s).gardenHabits=st(s).gardenHabits||[];st(s).gardenHabits.push({id:'habit_'+Date.now(),name,emoji:d.getElementById('v15he').value.trim()||'🌷',days:[]});save(d,s);form.remove();render();toast(d,'New habit planted 🌱')}};render()}function boot(){try{const d=deepest(outer.contentDocument);if(!d||!d.querySelector('.app'))return false;style(d);reminders(d);garden(d);return true}catch(e){return false}}outer.addEventListener('load',()=>{setTimeout(boot,300);setTimeout(boot,1000);setTimeout(boot,2000)});setTimeout(boot,1000)})();</script></body></html>
