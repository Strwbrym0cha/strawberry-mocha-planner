<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strawberry Mocha Planner V16</title><style>:root{--p:#e99ab7;--d:#b96c88;--s:#fff0f5;--bg:#fbf5f2;--ink:#674941;--mut:#99817a;--line:#eadbd6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:10px 12px;font-weight:800}.primary,.nav .active{background:var(--s);border-color:#efbfd0;color:var(--d)}.app{max-width:1200px;margin:auto;padding:10px 14px 45px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:var(--d);font-size:20px}.badge{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:7px;background:#fff}.nav{display:flex;gap:6px;overflow:auto;position:sticky;top:0;background:#fbf5f2ee;padding:10px 0;z-index:5}.nav button{white-space:nowrap}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,#f6d6e2,#fff8ef);border-radius:28px;padding:24px;margin-bottom:12px}.ey{font-size:9px;letter-spacing:.15em;font-weight:950;color:var(--d)}h1{margin:6px 0;font-size:34px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card,.stat,.goal,.habit{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin:9px 0}.stat{background:#fffaf6;margin:0}.stat small{display:block;color:var(--mut);font-size:9px;font-weight:900}.stat b{font-size:23px}.muted,small{color:var(--mut);line-height:1.45}.input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}textarea{min-height:100px}.row{display:flex;gap:7px;margin-top:8px}.row>*{flex:1}.progress{height:10px;background:#eee2e5;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:var(--p);border-radius:99px}.event{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--line);border-radius:13px;background:#fffaf6;margin:6px 0}.grow{flex:1}.pill{background:var(--s);color:var(--d);padding:4px 7px;border-radius:9px;font-size:10px;font-weight:800}.habitgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.plant{text-align:center;font-size:50px}.dots{display:flex;gap:4px;flex-wrap:wrap}.dot{width:30px;height:30px;padding:0;border-radius:50%;font-size:9px}.dot.on{background:var(--s);border-color:#efbfd0}.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--p) var(--pct,0),#eee 0);position:relative}.ring:after{content:"";position:absolute;width:70px;height:70px;background:#fff;border-radius:50%}.ring span{z-index:1;font-weight:900}.ringrow{display:flex;align-items:center;gap:14px}.reflection{background:#fffaf6;padding:10px;border-radius:12px;margin-top:8px}.empty{padding:18px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--mut)}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.habitgrid,.split{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.habitgrid,.split{grid-template-columns:1fr}.badge{display:none}h1{font-size:29px}}</style></head><body><div class="app"><header class="top"><div class="brand">🍓 Strawberry Mocha</div><div class="badge">V16 • INTERACTIVE</div></header><nav id="nav" class="nav"></nav><main id="pages"></main></div><script>
const KEY='sm_v16';const pad=n=>String(n).padStart(2,'0');const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};const dt=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)};const shift=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let D={events:[],reminders:[],tasks:[],routines:[],habits:[],goals:[],wins:[],courses:[],archive:[],days:{},money:{},brain:'',totalClasses:0};try{D=Object.assign(D,(JSON.parse(localStorage.getItem(KEY)||'{}').data)||{})}catch(e){}['events','reminders','tasks','routines','habits','goals','wins','courses','archive'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]});D.days=D.days||{};D.money=D.money||{};let page=localStorage.getItem('sm_v16_page')||'home',rDate=today(),sel=today(),month=new Date(),filter='WGU',editId=null;const tabs=[['home','🏠 Home'],['planner','📅 Planner'],['tasks','📝 Tasks'],['garden','🌷 Habit Garden'],['school','🎀 School'],['money','☕ Money'],['reminders','🔔 Reminders'],['brain','📝 Brain Dump'],['wellness','🌸 Wellness'],['goals','✨ Goals'],['wins','🏆 Wins'],['archive','🗄️ Archive']];function save(){localStorage.setItem(KEY,JSON.stringify({data:D}));render()}function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>'<button class="'+(page===t[0]?'active':'')+'" onclick="page=\''+t[0]+'\';localStorage.setItem(\'sm_v16_page\',page);render()">'+t[1]+'</button>').join('')}function shell(a,b,c){return '<section class="page active"><div class="hero"><div class="ey">'+a+'</div><h1>'+b+'</h1></div>'+c+'</section>'}function pct(n,d){return d?Math.round(n/d*100):0}function streak(h){let ks=Object.keys(h.days||{}).filter(k=>h.days[k]).sort().reverse(),best=0,run=0,last=null;ks.forEach(k=>{const d=dt(k);run=!last||Math.round((last-d)/86400000)===1?run+1:1;best=Math.max(best,run);last=d});return best}function week(){let d=dt(today());d.setDate(d.getDate()-d.getDay());const s=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());return Array.from({length:7},(_,i)=>shift(s,i))}function habitPct(){const w=week(),n=D.habits.length*7;return pct(D.habits.reduce((x,h)=>x+w.filter(k=>h.days?.[k]).length,0),n)}function home(){const hp=habitPct(),done=D.courses.filter(c=>c.status==='Completed'||c.status==='Transferred').length,dp=pct(done,D.totalClasses);return shell('🍓 STRAWBERRY MOCHA • V16','Good morning, Kat ♡','<div class="grid"><div class="stat"><small>🎓 DEGREE</small><b>'+dp+'%</b></div><div class="stat"><small>🌷 HABITS</small><b>'+hp+'%</b></div><div class="stat"><small>☕ AVAILABLE</small><b>$'+((+D.money.income||0)+(+D.money.funds||0)).toFixed(2)+'</b></div><div class="stat"><small>🏆 WINS</small><b>'+D.wins.length+'</b></div></div><div class="split"><div class="card"><h3>🎓 Degree Journey</h3><div class="progress"><i style="width:'+dp+'%"></i></div><p class="muted">'+done+' completed of '+(D.totalClasses||0)+' total.</p></div><div class="card"><h3>🌷 Habit Garden</h3><div class="progress"><i style="width:'+hp+'%"></i></div><p class="muted">Connected to the same garden data.</p></div></div><div class="card"><h2>🌱 Growing Garden</h2><div class="habitgrid">'+(D.habits.map((h,i)=>'<div class="habit"><div class="plant">'+(h.icon||['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7])+'</div><b>'+esc(h.name)+'</b><div class="progress"><i style="width:'+Math.min(100,Object.values(h.days||{}).filter(Boolean).length*3)+'%"></i></div><small>'+Object.values(h.days||{}).filter(Boolean).length+' completed days • '+streak(h)+' best streak</small></div>').join('')||'<div class="empty">🌱 Plant your first habit.</div>')+'</div></div>')}function planner(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();let c=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>'<div style="text-align:center;font-size:10px;font-weight:900">'+x+'</div>').join('');for(let i=0;i<first.getDay();i++)c+='<div></div>';for(let d=1;d<=days;d++){const k=y+'-'+pad(m+1)+'-'+pad(d);c+='<button onclick="sel=\''+k+'\';render()"><b>'+d+'</b></button>'}const items=D.events.concat(D.reminders).filter(x=>x.date===sel&&!x.completed),z=D.days[sel]||{};return shell('📅 PLANNER','Calendar + daily notes','<div class="card"><div class="row"><button onclick="month=new Date(y,m-1,1);render()">‹</button><h2 style="text-align:center;flex:3">'+month.toLocaleString(undefined,{month:'long',year:'numeric'})+'</h2><button onclick="month=new Date(y,m+1,1);render()">›</button></div><div class="grid" style="grid-template-columns:repeat(7,1fr)">'+c+'</div></div><div class="card"><h2>'+dt(sel).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</h2>'+(items.map(x=>'<div class="event"><span class="grow"><b>'+esc(x.title)+'</b></span><button onclick="archiveItem(\''+x.id+'\')">🗄️</button></div>').join('')||'<div class="empty">No events.</div>')+'<div class="row"><button class="primary" onclick="addEvent()">＋ Event</button><button onclick="addBill()">💸 Bill</button></div><input id="mood" class="input" placeholder="Mood" value="'+esc(z.mood||'')+'"><textarea id="notes">'+esc(z.notes||'')+'</textarea><button class="primary" onclick="D.days[sel]={mood:document.getElementById(\'mood\').value,notes:document.getElementById(\'notes\').value};save()">💾 Save Day</button></div>')}function addEvent(){const t=prompt('Event name?');if(t){D.events.push({id:uid(),title:t,date:sel,completed:false});save()}}function addBill(){const t=prompt('Bill name?');if(t){D.reminders.push({id:uid(),title:t,date:sel,amount:+prompt('Amount?')||0,completed:false});save()}}function archiveItem(i){const x=D.events.concat(D.reminders).find(a=>a.id===i);if(!x)return;D.archive.push({item:x,archivedAt:today()});D.events=D.events.filter(a=>a.id!==i);D.reminders=D.reminders.filter(a=>a.id!==i);save()}function tasks(){const ts=D.tasks.filter(t=>t.date===rDate);return shell('📝 TASKS + ROUTINES','Every step counts.','<div class="card"><h2>📌 Tasks for '+rDate+'</h2>'+(ts.map(t=>'<div class="event"><button onclick="tDone(\''+t.id+'\')">'+(t.done?'✓':'○')+'</button><span class="grow">'+esc(t.text)+'</span><button onclick="tDel(\''+t.id+'\')">🗑️</button></div>').join('')||'<div class="empty">No tasks yet.</div>')+'<div class="row"><input id="taskText" class="input" placeholder="Task"><button class="primary" onclick="addTask()">＋ Add</button></div></div><div class="card"><h2>🎀 Paste your structured routine</h2><input id="rName" class="input" placeholder="Routine name"><textarea id="rSteps" placeholder="Wake up&#10;Brush teeth&#10;Breakfast&#10;Get dressed"></textarea><button class="primary" onclick="addRoutine()">🌱 Create Routine</button></div><div class="card"><div class="row"><button onclick="rDate=shift(rDate,-1);render()">‹</button><input class="input" type="date" value="'+rDate+'" onchange="rDate=this.value;render()"><button onclick="rDate=shift(rDate,1);render()">›</button></div>'+(D.routines.map(r=>'<div class="goal"><h3>'+esc(r.name)+'</h3>'+r.steps.map((s,i)=>'<label class="event"><input type="checkbox" '+(r.checks?.[rDate]?.[i]?'checked':'')+' onchange="rToggle(\''+r.id+'\','+i+')"><span>'+esc(s)+'</span></label>').join('')+'<div class="progress"><i style="width:'+routinePct(r)+'%"></i></div><small>'+routinePct(r)+'% complete on '+rDate+'</small></div>').join('')||'<div class="empty">No routines yet.</div>')+'</div>')}function addTask(){const t=document.getElementById('taskText').value.trim();if(t){D.tasks.push({id:uid(),text:t,date:rDate,done:false});save()}}function tDone(i){const t=D.tasks.find(x=>x.id===i);if(t){t.done=!t.done;save()}}function tDel(i){D.tasks=D.tasks.filter(x=>x.id!==i);save()}function addRoutine(){const steps=document.getElementById('rSteps').value.split(String.fromCharCode(10)).map(x=>x.trim()).filter(Boolean);if(!steps.length)return;D.routines.push({id:uid(),name:document.getElementById('rName').value.trim()||'Daily Routine',steps:steps,checks:{}});save()}function rToggle(i,n){const r=D.routines.find(x=>x.id===i);if(!r)return;r.checks=r.checks||{};r.checks[rDate]=r.checks[rDate]||{};r.checks[rDate][n]=!r.checks[rDate][n];save()}function routinePct(r){return pct(Object.values(r.checks?.[rDate]||{}).filter(Boolean).length,r.steps.length)}function garden(){const w=week();return shell('🌷 HABIT GARDEN','The old garden model, restored','<div class="grid"><div class="stat"><small>TODAY</small><b>'+D.habits.filter(h=>h.days?.[today()]).length+'/'+D.habits.length+'</b></div><div class="stat"><small>THIS WEEK</small><b>'+habitPct()+'%</b></div><div class="stat"><small>BEST STREAK</small><b>'+Math.max(0,...D.habits.map(streak))+' 🔥</b></div><div class="stat"><small>HABITS</small><b>'+D.habits.length+'</b></div></div><div class="card"><div class="row"><input id="hName" class="input" placeholder="New habit"><button class="primary" onclick="addHabit()">🌱 Plant</button></div></div><div class="habitgrid">'+(D.habits.map((h,i)=>'<div class="habit"><button style="float:right" onclick="delHabit(\''+h.id+'\')">×</button><div class="plant">'+(h.icon||['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7])+'</div><h3>'+esc(h.name)+'</h3><small>'+w.filter(k=>h.days?.[k]).length+'/7 this week • '+streak(h)+' best streak</small><div class="dots">'+w.map(k=>'<button class="dot '+(h.days?.[k]?'on':'')+'" onclick="hToggle(\''+h.id+'\',\''+k+'\')">'+dt(k).toLocaleDateString(undefined,{weekday:'narrow'})+'</button>').join('')+'</div></div>').join('')||'<div class="empty">🌱 Your garden is waiting.</div>')+'</div>')}function addHabit(){const n=document.getElementById('hName').value.trim();if(n){D.habits.push({id:uid(),name:n,icon:'🌷',days:{}});save()}}function hToggle(i,k){const h=D.habits.find(x=>x.id===i);if(h){h.days=h.days||{};h.days[k]=!h.days[k];save()}}function delHabit(i){D.habits=D.habits.filter(x=>x.id!==i);save()}function school(){const done=D.courses.filter(c=>c.status==='Completed'||c.status==='Transferred').length,dp=pct(done,D.totalClasses),list=D.courses.filter(c=>c.school===filter),e=editId?D.courses.find(x=>x.id===editId):null;return shell('🎀 SCHOOL HUB','Courses with real progress','<div class="grid"><div class="stat"><small>DEGREE</small><b>'+dp+'%</b></div><div class="stat"><small>COMPLETED</small><b>'+done+'</b></div><div class="stat"><small>WGU</small><b>'+D.courses.filter(c=>c.school==='WGU'&&c.status==='Completed').length+'</b></div><div class="stat"><small>SOPHIA</small><b>'+D.courses.filter(c=>c.school==='Sophia'&&c.status==='Completed').length+'</b></div></div><div class="card"><b>🎓 Bachelor\'s Progress</b><div class="progress"><i style="width:'+dp+'%"></i></div><div class="row"><input id="totalClasses" class="input" type="number" value="'+(D.totalClasses||'')+'" placeholder="Total classes"><button onclick="D.totalClasses=+document.getElementById(\'totalClasses\').value||0;save()">Save</button></div></div><div class="card"><div class="row"><button class="'+(filter==='WGU'?'primary':'')+'" onclick="filter=\'WGU\';render()">🎓 WGU</button><button class="'+(filter==='Sophia'?'primary':'')+'" onclick="filter=\'Sophia\';render()">🌱 Sophia</button></div>'+(list.map(c=>{const p=c.status==='Completed'||c.status==='Transferred'?100:+c.progress||0;return '<div class="goal"><div style="display:flex;justify-content:space-between"><div><h3>'+esc(c.name)+'</h3><span class="pill">'+esc(c.status)+'</span></div><button onclick="editId=\''+c.id+'\';render()">✏️ Edit</button></div><div class="progress"><i style="width:'+p+'%"></i></div><small>Progress: '+p+'% '+(c.finish?'• Finish '+c.finish:'')+'</small><div class="reflection"><b>📖 Class reflection</b><div class="muted">'+esc(c.reflection||'No reflection yet.')+'</div></div></div>'}).join('')||'<div class="empty">No courses yet.</div>')+'</div><div class="card"><h3>'+(e?'✏️ Edit Course':'➕ Add Course')+'</h3><input id="cName" class="input" placeholder="Course name" value="'+esc(e?.name||'')+'"><div class="row"><select id="cSchool"><option '+(e?.school==='WGU'||!e?'selected':'')+'>WGU</option><option '+(e?.school==='Sophia'?'selected':'')+'>Sophia</option></select><select id="cStatus">'+['Not Started','In Progress','Completed','Transferred'].map(s=>'<option '+(e?.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select><input id="cProgress" class="input" type="number" min="0" max="100" value="'+(e?.progress??0)+'" placeholder="Progress %"></div><div class="row"><input id="cGrade" class="input" placeholder="Grade" value="'+esc(e?.grade||'')+'"><input id="cCredits" class="input" placeholder="Credits" value="'+esc(e?.credits||'')+'"><input id="cFinish" class="input" type="date" value="'+(e?.finish||'')+'"></div><textarea id="cReflection" placeholder="Class reflection...">'+esc(e?.reflection||'')+'</textarea><button class="primary" onclick="saveCourse()">💾 Save Course</button>'+(e?'<button onclick="editId=null;render()">Cancel</button>':'')+'</div>')}function saveCourse(){const c={id:editId||uid(),name:document.getElementById('cName').value.trim()||'Untitled Course',school:document.getElementById('cSchool').value,status:document.getElementById('cStatus').value,progress:Math.max(0,Math.min(100,+document.getElementById('cProgress').value||0)),grade:document.getElementById('cGrade').value,credits:document.getElementById('cCredits').value,finish:document.getElementById('cFinish').value,reflection:document.getElementById('cReflection').value};if(c.status==='Completed'||c.status==='Transferred')c.progress=100;const i=D.courses.findIndex(x=>x.id===c.id);if(i>=0)D.courses[i]=c;else D.courses.push(c);editId=null;save()}function money(){const keys=['income','funds','bills','spend','saving','debt'];return shell('☕ MONEY','Simple snapshot','<div class="card"><div class="grid">'+keys.map(k=>'<label><small>'+k.toUpperCase()+'</small><input id="m_'+k+'" class="input" type="number" value="'+(D.money[k]||'')+'"></label>').join('')+'</div><button class="primary" onclick="'+keys.map(k=>'D.money.'+k+'=+document.getElementById(\'m_'+k+'\').value||0').join(';')+';save()">💾 Save</button></div>')}function reminders(){return shell('🔔 REMINDERS','Future-you notes','<div class="card"><div class="row"><input id="rem" class="input" placeholder="Reminder"><input id="remDate" class="input" type="date" value="'+today()+'"><button class="primary" onclick="addReminder()">＋</button></div></div>'+(D.reminders.map(r=>'<div class="event"><button onclick="toggleReminder(\''+r.id+'\')">'+(r.completed?'✓':'○')+'</button><span class="grow">'+esc(r.title)+'<br><small>'+r.date+'</small></span></div>').join('')||'<div class="empty">No reminders.</div>'))}function addReminder(){const t=document.getElementById('rem').value.trim();if(t){D.reminders.push({id:uid(),title:t,date:document.getElementById('remDate').value,completed:false});save()}}function toggleReminder(i){const r=D.reminders.find(x=>x.id===i);if(r){r.completed=!r.completed;save()}}function brain(){return shell('📝 BRAIN DUMP','Get it out of your head','<div class="card"><textarea id="brainText">'+esc(D.brain)+'</textarea><button class="primary" onclick="D.brain=document.getElementById(\'brainText\').value;save()">💾 Save</button></div>')}function wellness(){const w=D.wellness||{};return shell('🌸 WELLNESS','Gentle check-in','<div class="card"><div class="row"><input id="wm" class="input" type="number" min="1" max="10" placeholder="Mood 1–10" value="'+(w.mood||'')+'"><input id="we" class="input" type="number" min="1" max="10" placeholder="Energy 1–10" value="'+(w.energy||'')+'"></div><textarea id="wn">'+esc(w.note||'')+'</textarea><button class="primary" onclick="D.wellness={mood:+document.getElementById(\'wm\').value||0,energy:+document.getElementById(\'we\').value||0,note:document.getElementById(\'wn\').value};save()">🌸 Save</button></div>')}function goals(){return shell('✨ GOALS GARDEN','Grow what matters','<div class="card"><h3>🌱 Plant a goal</h3><div class="grid"><input id="gName" class="input" placeholder="Goal"><input id="gWhy" class="input" placeholder="Why does this matter to me?"><input id="gDate" class="input" type="date"><input id="gNext" class="input" placeholder="Next tiny step"></div><button class="primary" onclick="addGoal()">🌱 Plant Goal</button></div><div class="card"><h2>🌷 Your Goal Garden</h2>'+(D.goals.map((g,i)=>'<div class="goal"><h3>'+['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7]+' '+esc(g.goal||g.name)+'</h3><p class="muted"><b>Why:</b> '+esc(g.why||'')+'</p><small>'+(g.deadline?'📅 '+g.deadline:'')+'</small><div class="progress"><i style="width:'+Math.max(0,Math.min(100,+g.progress||0))+'%"></i></div><div class="row"><button onclick="goalChange(\''+g.id+'\',10)">＋10%</button><button onclick="goalChange(\''+g.id+'\',-10)">−10%</button><button onclick="archiveGoal(\''+g.id+'\')">🗄️ Archive</button></div><div class="reflection">🌱 <b>Next:</b> '+esc(g.next||'Choose one tiny next step.')+'</div></div>').join('')||'<div class="empty">🌱 Nothing planted yet.</div>')+'</div>')}function addGoal(){const n=document.getElementById('gName').value.trim();if(n){D.goals.push({id:uid(),goal:n,why:document.getElementById('gWhy').value,deadline:document.getElementById('gDate').value,next:document.getElementById('gNext').value,progress:0});save()}}function goalChange(i,n){const g=D.goals.find(x=>x.id===i);if(g){g.progress=Math.max(0,Math.min(100,(+g.progress||0)+n));save()}}function archiveGoal(i){const g=D.goals.find(x=>x.id===i);if(g){D.archive.push({item:g,archivedAt:today()});D.goals=D.goals.filter(x=>x.id!==i);save()}}function wins(){return shell('🏆 LITTLE WINS','Proof you did things','<button class="primary" onclick="addWin()">＋ Celebrate a win</button>'+(D.wins.slice().reverse().map(w=>'<div class="event">🏆 <span class="grow"><b>'+esc(w.text)+'</b><br><small>'+w.date+'</small></span></div>').join('')||'<div class="empty">No wins yet.</div>'))}function addWin(){const x=prompt('Tiny win?');if(x){D.wins.push({id:uid(),text:x,date:today()});save()}}function archive(){return shell('🗄️ ARCHIVE','Nothing disappears forever','<div class="card">'+(D.archive.slice().reverse().map(x=>'<div class="event">🗄️ '+esc(x.item?.goal||x.item?.title||'Archived item')+'</div>').join('')||'<div class="empty">Archive empty.</div>')+'</div>')}function render(){nav();const pages={home,planner,tasks,garden,school,money,reminders,brain,wellness,goals,wins,archive};document.getElementById('pages').innerHTML=pages[page]?pages[page]():pages.home}render();</script></body></html>
