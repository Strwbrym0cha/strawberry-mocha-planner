<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner V16</title><style>:root{--p:#e99ab7;--d:#b96c88;--s:#fff0f5;--c:#fffaf6;--bg:#fbf5f2;--ink:#674941;--mut:#99817a;--line:#eadbd6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:10px 12px;font-weight:800}button.primary,.nav button.active{background:var(--s);border-color:#efbfd0;color:var(--d)}.app{max-width:1200px;margin:auto;padding:8px 12px 40px}.top{display:flex;justify-content:space-between;padding:8px 2px}.brand{font-weight:950;color:var(--d);font-size:20px}.badge{font-size:9px;border:1px solid var(--line);border-radius:99px;padding:7px;background:#fff}.nav{display:flex;gap:6px;overflow:auto;position:sticky;top:0;z-index:5;padding:8px 0 12px;background:#fbf5f2ee}.nav button{white-space:nowrap}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,#f6d6e2,#fff8ef);border-radius:28px;padding:24px;margin-bottom:12px}.ey{font-size:9px;letter-spacing:.15em;font-weight:950;color:var(--d)}h1{font-size:34px;margin:6px 0}.muted,small{color:var(--mut);line-height:1.45}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card,.stat,.goal,.habit{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin:9px 0}.stat{background:var(--c);margin:0}.stat small{display:block;font-size:9px;font-weight:900}.stat b{display:block;font-size:23px;margin-top:3px}.input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}textarea{min-height:100px}.row{display:flex;gap:7px;margin-top:8px}.row>*{flex:1}.progress{height:10px;background:#eee2e5;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:var(--p);border-radius:99px}.event{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--line);border-radius:13px;background:var(--c);margin:6px 0}.grow{flex:1}.pill{background:var(--s);color:var(--d);padding:4px 7px;border-radius:9px;font-size:10px;font-weight:800}.habitgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.plant{text-align:center;font-size:50px}.dots{display:flex;gap:4px;flex-wrap:wrap}.dot{width:28px;height:28px;padding:0;border-radius:50%;font-size:9px}.dot.on{background:var(--s);border-color:#efbfd0}.ring{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--p) var(--pct,0),#eee 0);position:relative}.ring:after{content:"";position:absolute;width:72px;height:72px;background:#fff;border-radius:50%}.ring span{z-index:1;font-weight:900}.ringrow{display:flex;align-items:center;gap:14px}.reflection{background:var(--c);padding:10px;border-radius:12px;margin-top:8px}.empty{padding:18px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--mut)}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.habitgrid,.split{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.habitgrid,.split{grid-template-columns:1fr}.badge{display:none}h1{font-size:29px}}</style></head><body><div class="app"><header class="top"><div class="brand">🍓 Strawberry Mocha</div><div class="badge">V16 • INTERACTIVE</div></header><nav class="nav" id="nav"></nav><main id="pages"></main></div><script>
const K='sm_v16',pad=n=>String(n).padStart(2,'0'),today=()=>{let d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},date=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)},shift=(s,n)=>{let d=date(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+(Number(n)||0).toFixed(2);let db={data:{}};try{db=JSON.parse(localStorage.getItem(K)||'{"data":{}}')}catch(e){}let D=db.data||{};['events','reminders','tasks','routines','habits','goals','wins','courses','archive'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]});D.days=D.days||{};D.money=D.money||{};D.brain=D.brain||'';D.totalClasses=+D.totalClasses||0;function save(){localStorage.setItem(K,JSON.stringify({data:D}));render()}let page=localStorage.getItem('sm_v16_page')||'home',rDate=today(),sel=today(),month=new Date(),filter='WGU',edit=null;const tabs=[['home','🏠 Home'],['planner','📅 Planner'],['tasks','📝 Tasks'],['garden','🌷 Habit Garden'],['school','🎀 School'],['money','☕ Money'],['reminders','🔔 Reminders'],['brain','📝 Brain Dump'],['wellness','🌸 Wellness'],['goals','✨ Goals'],['wins','🏆 Wins'],['archive','🗄️ Archive']];function nav(){document.getElementById('nav').innerHTML=tabs.map(x=>`<button class="${page==x[0]?'active':''}" onclick="page='${x[0]}';localStorage.setItem('sm_v16_page',page);render()">${x[1]}</button>`).join('')}function shell(a,b,c){return `<section class="page active"><div class="hero"><div class="ey">${a}</div><h1>${b}</h1></div>${c}</section>`}function streak(h){let a=Object.keys(h.days||{}).filter(k=>h.days[k]).sort().reverse(),best=0,run=0,last;for(let k of a){let d=date(k);run=!last||Math.round((last-d)/864e5)==1?run+1:1;best=Math.max(best,run);last=d}return best}function week(){let d=date(today());d.setDate(d.getDate()-d.getDay());let b=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());return Array.from({length:7},(_,i)=>shift(b,i))}function habitPct(){let w=week(),p=D.habits.length*7;return p?Math.round(D.habits.reduce((n,h)=>n+w.filter(k=>h.days?.[k]).length,0)/p*100):0}
function home(){let hp=habitPct(),done=D.courses.filter(c=>c.status=='Completed'||c.status=='Transferred').length,dp=D.totalClasses?Math.min(100,Math.round(done/D.totalClasses*100)):0;return shell('🍓 STRAWBERRY MOCHA • V16','Good morning, Kat ♡',`<div class="grid"><div class="stat"><small>🎓 DEGREE</small><b>${dp}%</b></div><div class="stat"><small>🌷 HABITS</small><b>${hp}%</b></div><div class="stat"><small>☕ AVAILABLE</small><b>${money((+D.money.income||0)+(+D.money.funds||0))}</b></div><div class="stat"><small>🏆 WINS</small><b>${D.wins.length}</b></div></div><div class="split"><div class="card"><div class="ringrow"><div class="ring" style="--pct:${dp}%"><span>${dp}%</span></div><div><h3>🎓 Degree Journey</h3><p class="muted">${done} completed of ${D.totalClasses||0} total.</p></div></div></div><div class="card"><div class="ringrow"><div class="ring" style="--pct:${hp}%"><span>${hp}%</span></div><div><h3>🌷 Habit Garden</h3><p class="muted">This is the same habit data used by the garden.</p></div></div></div></div><div class="card"><h2>🌱 Growing Garden</h2><div class="habitgrid">${D.habits.map((h,i)=>`<div class="habit"><div class="plant">${h.icon||['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7]}</div><b>${esc(h.name)}</b><div class="progress"><i style="width:${Math.min(100,Object.values(h.days||{}).filter(Boolean).length*3)}%"></i></div><small>${Object.values(h.days||{}).filter(Boolean).length} completed days • ${streak(h)} best streak</small></div>`).join('')||'<div class="empty">🌱 Plant your first habit.</div>'}</div></div>`)}
function planner(){let y=month.getFullYear(),m=month.getMonth(),f=new Date(y,m,1),n=new Date(y,m+1,0).getDate(),o=f.getDay(),c=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div style="text-align:center;font-size:10px;font-weight:900">${x}</div>`).join('');for(let i=0;i<o;i++)c+='<div></div>';for(let d=1;d<=n;d++){let k=y+'-'+pad(m+1)+'-'+pad(d);c+=`<button class="day ${k==today()?'today':''} ${k==sel?'selected':''}" onclick="sel='${k}';render()"><b>${d}</b></button>`}let its=[...D.events,...D.reminders].filter(x=>x.date==sel&&!x.completed),z=D.days[sel]||{};return shell('📅 PLANNER','Calendar + daily notes',`<div class="card"><div class="row"><button onclick="month=new Date(y,m-1,1);render()">‹</button><h2 style="text-align:center;flex:3">${month.toLocaleString(undefined,{month:'long',year:'numeric'})}</h2><button onclick="month=new Date(y,m+1,1);render()">›</button></div><div class="grid" style="grid-template-columns:repeat(7,1fr)">${c}</div></div><div class="card"><h2>${date(sel).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h2>${its.map(x=>`<div class="event"><span class="grow"><b>${esc(x.title)}</b> ${x.amount?money(x.amount):''}</span><button onclick="archiveItem('${x.id}')">🗄️</button></div>`).join('')||'<div class="empty">No events.</div>'}<div class="row"><button class="primary" onclick="addEvent()">＋ Event</button><button onclick="addBill()">💸 Bill</button></div><input id="mood" class="input" placeholder="Mood" value="${esc(z.mood||'')}"><textarea id="notes">${esc(z.notes||'')}</textarea><button class="primary" onclick="D.days[sel]={mood:mood.value,notes:notes.value};save()">💾 Save Day</button></div>`)}function addEvent(){let t=prompt('Event name?');if(t){D.events.push({id:id(),title:t,date:sel,completed:false});save()}}function addBill(){let t=prompt('Bill name?');if(t){D.reminders.push({id:id(),title:t,date:sel,amount:+prompt('Amount?')||0,completed:false});save()}}function archiveItem(i){let x=[...D.events,...D.reminders].find(a=>a.id==i);if(!x)return;D.archive.push({item:x,archivedAt:today()});D.events=D.events.filter(a=>a.id!=i);D.reminders=D.reminders.filter(a=>a.id!=i);save()}
function tasks(){let ts=D.tasks.filter(t=>t.date==rDate);return shell('📝 TASKS + ROUTINES','Every step counts.',`<div class="card"><h2>📌 Tasks for ${rDate}</h2>${ts.map(t=>`<div class="event"><button onclick="tDone('${t.id}')">${t.done?'✓':'○'}</button><span class="grow" style="${t.done?'text-decoration:line-through;opacity:.5':''}">${esc(t.text)}</span><button onclick="tDel('${t.id}')">🗑️</button></div>`).join('')||'<div class="empty">No tasks yet.</div>'}<div class="row"><input id="taskText" class="input" placeholder="Task"><button class="primary" onclick="addTask()">＋ Add</button></div></div><div class="card"><h2>🎀 Paste your structured routine</h2><input id="rName" class="input" placeholder="Routine name"><textarea id="rSteps" placeholder="Wake up&#10;Take medication&#10;Brush teeth&#10;Breakfast&#10;Get dressed"></textarea><button class="primary" onclick="addRoutine()">🌱 Create Routine</button></div><div class="card"><div class="row"><button onclick="rDate=shift(rDate,-1);render()">‹</button><input class="input" type="date" value="${rDate}" onchange="rDate=this.value;render()"><button onclick="rDate=shift(rDate,1);render()">›</button></div>${D.routines.map(r=>`<div class="goal"><h3>${esc(r.name)}</h3>${r.steps.map((s,i)=>`<label class="event"><input type="checkbox" ${r.checks?.[rDate]?.[i]?'checked':''} onchange="rToggle('${r.id}',${i})"><span>${esc(s)}</span></label>`).join('')}<div class="progress"><i style="width:${rPct(r)}%"></i></div><small>${rPct(r)}% complete on ${rDate}</small></div>`).join('')||'<div class="empty">No routines yet.</div>'}</div>`)}function addTask(){let t=document.getElementById('taskText').value.trim();if(!t)return;D.tasks.push({id:id(),text:t,date:rDate,done:false});save()}function tDone(i){let t=D.tasks.find(x=>x.id==i);if(t){t.done=!t.done;save()}}function tDel(i){D.tasks=D.tasks.filter(x=>x.id!=i);save()}function addRoutine(){let steps=document.getElementById('rSteps').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!steps.length)return;D.routines.push({id:id(),name:document.getElementById('rName').value.trim()||'Daily Routine',steps,checks:{}});save()}function rToggle(i,n){let r=D.routines.find(x=>x.id==i);r.checks=r.checks||{};r.checks[rDate]=r.checks[rDate]||{};r.checks[rDate][n]=!r.checks[rDate][n];save()}function rPct(r){return r.steps.length?Math.round(Object.values(r.checks?.[rDate]||{}).filter(Boolean).length/r.steps.length*100):0}
function garden(){let w=week();return shell('🌷 HABIT GARDEN','The old garden model, restored',`<div class="grid"><div class="stat"><small>TODAY</small><b>${D.habits.filter(h=>h.days?.[today()]).length}/${D.habits.length}</b></div><div class="stat"><small>THIS WEEK</small><b>${habitPct()}%</b></div><div class="stat"><small>BEST STREAK</small><b>${Math.max(0,...D.habits.map(streak))} 🔥</b></div><div class="stat"><small>HABITS</small><b>${D.habits.length}</b></div></div><div class="card"><div class="row"><input id="hName" class="input" placeholder="New habit"><button class="primary" onclick="addHabit()">🌱 Plant</button></div></div><div class="habitgrid">${D.habits.map((h,i)=>`<div class="habit"><button style="float:right" onclick="delHabit('${h.id}')">×</button><div class="plant">${h.icon||['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7]}</div><h3>${esc(h.name)}</h3><small>${w.filter(k=>h.days?.[k]).length}/7 this week • ${streak(h)} best streak</small><div class="dots">${w.map(k=>`<button class="dot ${h.days?.[k]?'on':''}" onclick="hToggle('${h.id}','${k}')">${date(k).toLocaleDateString(undefined,{weekday:'narrow'})}</button>`).join('')}</div></div>`).join('')||'<div class="empty">🌱 Your garden is waiting.</div>'}</div>`)}function addHabit(){let n=hName.value.trim();if(n){D.habits.push({id:id(),name:n,icon:'🌷',days:{}});save()}}function hToggle(i,k){let h=D.habits.find(x=>x.id==i);h.days=h.days||{};h.days[k]=!h.days[k];save()}function delHabit(i){D.habits=D.habits.filter(x=>x.id!=i);save()}
function school(){let done=D.courses.filter(c=>c.status=='Completed'||c.status=='Transferred').length,dp=D.totalClasses?Math.min(100,Math.round(done/D.totalClasses*100)):0,list=D.courses.filter(c=>c.school==filter),e=edit?D.courses.find(x=>x.id==edit):null;return shell('🎀 SCHOOL HUB','Courses with real progress',`<div class="grid"><div class="stat"><small>DEGREE</small><b>${dp}%</b></div><div class="stat"><small>COMPLETED</small><b>${done}</b></div><div class="stat"><small>WGU</small><b>${D.courses.filter(c=>c.school=='WGU'&&c.status=='Completed').length}</b></div><div class="stat"><small>SOPHIA</small><b>${D.courses.filter(c=>c.school=='Sophia'&&c.status=='Completed').length}</b></div></div><div class="card"><b>🎓 Bachelor's Progress</b><div class="progress"><i style="width:${dp}%"></i></div><div class="row"><input id="total" class="input" type="number" value="${D.totalClasses||''}" placeholder="Total classes"><button onclick="D.totalClasses=+total.value||0;save()">Save</button></div></div><div class="card"><div class="row"><button class="${filter=='WGU'?'primary':''}" onclick="filter='WGU';render()">🎓 WGU</button><button class="${filter=='Sophia'?'primary':''}" onclick="filter='Sophia';render()">🌱 Sophia</button></div>${list.map(c=>{let p=c.status=='Completed'||c.status=='Transferred'?100:+c.progress||0;return `<div class="goal"><div style="display:flex;justify-content:space-between"><div><h3>${esc(c.name)}</h3><span class="pill">${esc(c.status)}</span></div><button onclick="edit='${c.id}';render()">✏️ Edit</button></div><div class="progress"><i style="width:${p}%"></i></div><small>Progress: ${p}% ${c.finish?'• Finish '+c.finish:''}</small><div class="reflection"><b>📖 Class reflection</b><div class="muted">${esc(c.reflection||'No reflection yet.')}</div></div></div>`}).join('')||'<div class="empty">No courses yet.</div>'}</div><div class="card"><h3>${e?'✏️ Edit Course':'➕ Add Course'}</h3><input id="cName" class="input" placeholder="Course name" value="${esc(e?.name||'')}"><div class="row"><select id="cSchool"><option ${e?.school=='WGU'||!e?'selected':''}>WGU</option><option ${e?.school=='Sophia'?'selected':''}>Sophia</option></select><select id="cStatus">${['Not Started','In Progress','Completed','Transferred'].map(s=>`<option ${e?.status==s?'selected':''}>${s}</option>`).join('')}</select><input id="cProgress" class="input" type="number" min="0" max="100" value="${e?.progress??0}" placeholder="Progress %"></div><div class="row"><input id="cGrade" class="input" placeholder="Grade" value="${esc(e?.grade||'')}"><input id="cCredits" class="input" placeholder="Credits" value="${esc(e?.credits||'')}"><input id="cFinish" class="input" type="date" value="${e?.finish||''}"></div><textarea id="cReflection" placeholder="Class reflection...">${esc(e?.reflection||'')}</textarea><button class="primary" onclick="saveCourse()">💾 Save Course</button>${e?'<button onclick="edit=null;render()">Cancel</button>':''}</div>`}function saveCourse(){let c={id:edit||id(),name:cName.value.trim()||'Untitled Course',school:cSchool.value,status:cStatus.value,progress:Math.max(0,Math.min(100,+cProgress.value||0)),grade:cGrade.value,credits:cCredits.value,finish:cFinish.value,reflection:cReflection.value};if(c.status=='Completed'||c.status=='Transferred')c.progress=100;let i=D.courses.findIndex(x=>x.id==c.id);i>=0?D.courses[i]=c:D.courses.push(c);edit=null;save()}
function moneyPage(){let m=D.money;return shell('☕ MONEY','Simple snapshot',`<div class="card"><div class="grid">${['income','funds','bills','spend','saving','debt'].map(k=>`<label><small>${k}</small><input id="m_${k}" class="input" type="number" value="${m[k]||''}"></label>`).join('')}</div><button class="primary" onclick="${['income','funds','bills','spend','saving','debt'].map(k=>`D.money.${k}=+m_${k}.value||0`).join(';')};save()">💾 Save</button></div>`)}function reminders(){return shell('🔔 REMINDERS','Future-you notes',`<div class="card"><div class="row"><input id="rem" class="input" placeholder="Reminder"><input id="rd" class="input" type="date" value="${today()}"><button class="primary" onclick="addRem()">＋</button></div></div>${D.reminders.map(r=>`<div class="event"><button onclick="remDone('${r.id}')">${r.completed?'✓':'○'}</button><span class="grow">${esc(r.title)}<br><small>${r.date}</small></span><button onclick="archiveItem('${r.id}')">🗄️</button></div>`).join('')||'<div class="empty">No reminders.</div>'}`)}function addRem(){if(rem.value.trim()){D.reminders.push({id:id(),title:rem.value.trim(),date:rd.value,completed:false});save()}}function remDone(i){let r=D.reminders.find(x=>x.id==i);r.completed=!r.completed;save()}
function brain(){return shell('📝 BRAIN DUMP','Get it out of your head',`<div class="card"><textarea id="brainText">${esc(D.brain)}</textarea><button class="primary" onclick="D.brain=brainText.value;save()">💾 Save</button></div>`)}function wellness(){let w=D.wellness||{};return shell('🌸 WELLNESS','Gentle check-in',`<div class="card"><div class="row"><input id="wm" class="input" type="number" min="1" max="10" placeholder="Mood 1–10" value="${w.mood||''}"><input id="we" class="input" type="number" min="1" max="10" placeholder="Energy 1–10" value="${w.energy||''}"></div><textarea id="wn">${esc(w.note||'')}</textarea><button class="primary" onclick="D.wellness={mood:+wm.value||0,energy:+we.value||0,note:wn.value};save()">🌸 Save</button></div>`)}function goals(){return shell('✨ GOALS GARDEN','Grow what matters',`<div class="card"><h3>🌱 Plant a goal</h3><div class="grid"><input id="gName" class="input" placeholder="Goal"><input id="gWhy" class="input" placeholder="Why does this matter to me?"><input id="gDate" class="input" type="date"><input id="gNext" class="input" placeholder="Next tiny step"></div><button class="primary" onclick="addGoal()">🌱 Plant Goal</button></div><div class="card"><h2>🌷 Your Goal Garden</h2>${D.goals.map((g,i)=>{let p=Math.max(0,Math.min(100,+g.progress||0));return `<div class="goal"><h3>${['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7]} ${esc(g.goal||g.name)}</h3><p class="muted"><b>Why:</b> ${esc(g.why||'')}</p><small>${g.deadline?'📅 '+g.deadline:''}</small><div class="progress"><i style="width:${p}%"></i></div><div class="row"><button onclick="goalChange('${g.id}',10)">＋10%</button><button onclick="goalChange('${g.id}',-10)">−10%</button><button onclick="archiveGoal('${g.id}')">🗄️ Archive</button></div><div class="reflection">🌱 <b>Next:</b> ${esc(g.next||'Choose one tiny next step.')}</div></div>`}).join('')||'<div class="empty">🌱 Nothing planted yet.</div>'}</div>`)}function addGoal(){if(gName.value.trim()){D.goals.push({id:id(),goal:gName.value.trim(),why:gWhy.value.trim(),deadline:gDate.value,next:gNext.value.trim(),progress:0});save()}}function goalChange(i,n){let g=D.goals.find(x=>x.id==i);g.progress=Math.max(0,Math.min(100,(+g.progress||0)+n));save()}function archiveGoal(i){let g=D.goals.find(x=>x.id==i);D.archive.push({item:g,archivedAt:today()});D.goals=D.goals.filter(x=>x.id!=i);save()}function wins(){return shell('🏆 LITTLE WINS','Proof you did things',`<button class="primary" onclick="let x=prompt('Tiny win?');if(x){D.wins.push({id:id(),text:x,date:today()});save()}">＋ Celebrate a win</button>${D.wins.slice().reverse().map(w=>`<div class="event">🏆 <span class="grow"><b>${esc(w.text)}</b><br><small>${w.date}</small></span></div>`).join('')}`)}function archive(){return shell('🗄️ ARCHIVE','Nothing disappears forever',`<div class="card">${D.archive.slice().reverse().map(x=>`<div class="event">🗄️ <span>${esc(x.item?.goal||x.item?.title||'Archived item')}</span></div>`).join('')||'<div class="empty">Archive empty.</div>'}</div>`)}function render(){nav();let f={home,planner,tasks,garden,school,money:moneyPage,reminders,brain,wellness,goals,wins,archive};document.getElementById('pages').innerHTML=f[page]()}render();
</script></body></html>
