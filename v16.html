<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strawberry Mocha Planner V16 🍓</title>
<style>
:root{--pink:#e99ab7;--dark:#b96c88;--soft:#fff0f5;--cream:#fffaf6;--bg:#fbf5f2;--ink:#674941;--muted:#99817a;--line:#eadbd6;--shadow:0 10px 30px rgba(103,73,65,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;-webkit-text-size-adjust:100%}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:15px;padding:10px 13px;font-weight:850;cursor:pointer}button.primary,.nav button.active{background:var(--soft);border-color:#efbfd0;color:var(--dark)}button.danger{color:#a35f6f}.app{max-width:1280px;margin:auto;padding:8px 14px 45px}.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 10px}.brand{font-weight:950;color:var(--dark);font-size:20px}.badge{font-size:9px;color:var(--dark);border:1px solid var(--line);border-radius:99px;padding:7px 10px;background:#fff}.nav{display:flex;gap:7px;overflow-x:auto;position:sticky;top:0;z-index:30;padding:8px 0 12px;background:rgba(251,245,242,.94);backdrop-filter:blur(15px);scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,#f6d6e2,#fff8ef);border-radius:30px;padding:25px;margin-bottom:12px;position:relative;overflow:hidden}.hero:after{content:'🍓';position:absolute;right:20px;bottom:-28px;font-size:110px;opacity:.72}.ey{font-size:9px;letter-spacing:.16em;font-weight:950;color:var(--dark)}h1{font-size:36px;margin:7px 0}h2,h3{margin:5px 0 10px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.stat{background:#fff;border:1px solid var(--line);border-radius:23px;padding:17px;box-shadow:var(--shadow);margin:9px 0}.stat{background:var(--cream);margin:0}.stat small{display:block;color:var(--muted);font-size:9px;font-weight:950}.stat b{display:block;font-size:24px;margin-top:4px}.input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink)}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}.progress{height:11px;background:#f0e3e5;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;width:0;background:var(--pink);border-radius:99px;transition:width .25s}.pill{display:inline-block;background:var(--soft);border-radius:10px;padding:5px 8px;font-size:10px;color:var(--dark);font-weight:850}.eventItem{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:15px;padding:10px;margin:6px 0;background:var(--cream)}.grow{flex:1}.calendar{background:#fff;border:1px solid var(--line);border-radius:25px;padding:15px;box-shadow:var(--shadow)}.calhead{display:flex;justify-content:space-between;align-items:center}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.dow{text-align:center;color:var(--dark);font-size:10px;font-weight:950;padding:6px 0}.day{min-height:76px;padding:8px;text-align:left;border-radius:14px;overflow:hidden}.day.today{background:var(--soft)}.day.selected{outline:2px solid var(--pink)}.day.empty{visibility:hidden}.eventdot{display:block;font-size:9px;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.habitgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.habit{border:1px solid var(--line);border-radius:20px;padding:14px;background:#fff;position:relative}.plant{height:90px;display:grid;place-items:center;font-size:55px}.dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.dot{width:27px;height:27px;padding:0;border-radius:50%;font-size:10px}.dot.on{background:var(--soft);border-color:#efbfd0;color:var(--dark)}.ring{width:105px;height:105px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--pink) var(--pct,0%),#f0e4e6 0);flex:none}.ring:after{content:'';width:76px;height:76px;border-radius:50%;background:#fff}.ring span{position:absolute;z-index:1;font-weight:950;color:var(--dark)}.ringrow{display:flex;gap:15px;align-items:center}.goal{border:1px solid var(--line);border-radius:22px;padding:16px;margin:9px 0;background:linear-gradient(135deg,#fff,#fff7fa)}.goaltop{display:flex;gap:10px;align-items:flex-start}.seed{font-size:32px}.goalring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--pink) var(--p),#f0e4e6 0);display:grid;place-items:center;position:relative}.goalring:after{content:'';width:47px;height:47px;background:#fff;border-radius:50%}.goalring span{position:absolute;z-index:1;font-size:11px;font-weight:950;color:var(--dark)}.steps{display:grid;gap:6px;margin-top:8px}.step{display:flex;align-items:center;gap:7px;padding:8px;background:var(--cream);border-radius:12px}.step input{accent-color:var(--pink)}.reflection{background:var(--cream);border-radius:14px;padding:11px;margin-top:9px}.empty{padding:20px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center;background:#fffaf8}.toast{display:none;position:fixed;right:14px;bottom:14px;z-index:100;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 15px;box-shadow:0 12px 35px rgba(103,73,65,.12)}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.habitgrid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}}
@media(max-width:480px){.grid,.habitgrid{grid-template-columns:1fr}.app{padding:7px 11px 30px}.nav button{font-size:11px;padding:9px 10px}.day{min-height:58px;padding:6px}.hero{padding:21px}h1{font-size:31px}.badge{display:none}}
</style>
</head>
<body><div class="app"><header class="top"><div class="brand">🍓 Strawberry Mocha</div><div class="badge">V16 • INTERACTIVE GROWTH™</div></header><nav class="nav" id="nav"></nav><main id="pages"></main></div><div id="toast" class="toast">☁️ Saved</div>
<script>
const KEY='sm_v16',today=()=>new Date().toISOString().slice(0,10),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8),money=n=>'$'+(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadOld(){try{return JSON.parse(localStorage.getItem('sm_v10')||'{}')}catch(e){return{}}}function loadHist(){try{return JSON.parse(localStorage.getItem('sm_habit_history')||'{}')}catch(e){return{}}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
let db=load(),old=loadOld(),hist=loadHist();db.data=db.data||{};const D=db.data;
D.events=D.events||[];D.reminders=D.reminders||[];D.tasks=D.tasks||[];D.routines=D.routines||[];D.habits=D.habits||[];D.goals=D.goals||[];D.wins=D.wins||[];D.courses=D.courses||[];D.days=D.days||{};D.money=D.money||{income:0,funds:0,bills:0,spend:0,saving:0,debt:0};D.totalClasses=D.totalClasses||0;D.brain=D.brain||'';D.schoolReflections=D.schoolReflections||{};
if(!D._migrated){const ov=old.v15||{};['events','reminders','tasks','routines','goals','wins','archive','courses','days'].forEach(k=>{if((D[k]||[]).length===0&&ov[k])D[k]=ov[k]});if(!D.totalClasses&&ov.totalClasses)D.totalClasses=ov.totalClasses;if(ov.money)D.money={...D.money,...ov.money};const legacy=hist||{};Object.keys(legacy).forEach(k=>{const h=legacy[k];if(!D.habits.some(x=>x.name.toLowerCase()===String(h.name).toLowerCase()))D.habits.push({id:uid(),name:h.name,icon:'🌷',days:h.days||{},checks:h.days||{}})});if(!D.habits.length&&ov.habits)D.habits=ov.habits.map(h=>({id:h.id||uid(),name:h.name,icon:h.icon||'🌷',days:h.checks||{},checks:h.checks||{}}));if(!D.goals.length&&old.v12?.goals)D.goals=old.v12.goals;D._migrated=true;save('🌸 V16 data carried forward')}
function save(msg='☁️ Saved'){db.data=D;localStorage.setItem(KEY,JSON.stringify(db));toast(msg);render()}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.style.display='none',900)}
let active=localStorage.getItem('sm_v16_page')||'home',selected=today(),calCursor=new Date(),routineDate=today(),activeSchool='WGU',editingCourse=null;
const tabs=[['home','🏠 Home'],['planner','📅 Planner'],['tasks','📝 Tasks'],['garden','🌷 Habit Garden'],['school','🎀 School'],['money','☕ Money'],['reminders','🔔 Reminders'],['brain','📝 Brain Dump'],['wellness','🌸 Wellness'],['goals','✨ Goals'],['wins','🏆 Wins'],['archive','🗄️ Archive']];
function nav(){document.getElementById('nav').innerHTML=tabs.map(([id,t])=>`<button class="${active===id?'active':''}" data-page="${id}">${t}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{active=b.dataset.page;localStorage.setItem('sm_v16_page',active);render()})}
function shell(title,sub,body){return `<section class="page active"><div class="hero"><div class="ey">${title}</div><h1>${sub}</h1></div>${body}</section>`}
function habitStats(){const hs=D.habits,days=hs.reduce((n,h)=>n+Object.values(h.days||{}).filter(Boolean).length,0);const week=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-d.getDay()+i);week.push(d.toISOString().slice(0,10))}const wd=hs.reduce((n,h)=>n+week.filter(k=>h.days?.[k]).length,0),possible=hs.length*7;return{today:hs.filter(h=>h.days?.[today()]).length,week:possible?Math.round(wd/possible*100):0,best:Math.max(0,...hs.map(h=>streak(h))),overall:possible?Math.round(wd/possible*100):0,total:days}}
function streak(h){const ds=Object.keys(h.days||{}).filter(k=>h.days[k]).sort().reverse();let best=0,run=0,last=null;for(const k of ds){const d=new Date(k+'T12:00:00');if(!last)run=1;else run=Math.round((last-d)/86400000)===1?run+1:1;best=Math.max(best,run);last=d}return best}
function home(){const hs=habitStats(),done=D.courses.filter(c=>['Completed','Transferred'].includes(c.status)).length,pct=D.totalClasses?Math.min(100,Math.round(done/D.totalClasses*100)):0;const flowers=['🌱','🪴','🌷','🌸','🌺','🌻','🍓'];return shell('🍓 STRAWBERRY MOCHA • V16','Good morning, Kat ♡',`<div class="grid"><div class="stat"><small>🎓 DEGREE</small><b>${pct}%</b></div><div class="stat"><small>🌷 HABITS</small><b>${hs.week}%</b></div><div class="stat"><small>☕ AVAILABLE</small><b>${money((+D.money.income||0)+(+D.money.funds||0))}</b></div><div class="stat"><small>🏆 WINS</small><b>${D.wins.length}</b></div></div><div class="split"><div class="card"><div class="ringrow"><div class="ring" style="--pct:${pct}%"><span>${pct}%</span></div><div><h3>🎓 Degree Journey</h3><p class="muted">WGU + Sophia, one bachelor's path.</p></div></div></div><div class="card"><div class="ringrow"><div class="ring" style="--pct:${hs.week}%"><span>${hs.week}%</span></div><div><h3>🌷 Habit Garden</h3><p class="muted">The home garden now reads the exact same habit history.</p></div></div></div></div><div class="card"><h2>🌱 Growing Garden</h2><div class="habitgrid">${D.habits.length?D.habits.map((h,i)=>{const w=Object.values(h.days||{}).filter(Boolean).length;return `<div class="habit"><div class="plant">${h.icon||flowers[i%flowers.length]}</div><b>${esc(h.name)}</b><div class="progress"><i style="width:${Math.min(100,w?Math.min(100,w*3):0)}%"></i></div><small>${w} completed days • ${streak(h)} day best streak</small></div>`}).join(''):'<div class="empty">🌱 Your real Habit Garden will appear here as it grows.</div>'}</div></div><div class="split"><div class="card"><h3>✨ Goals Growing</h3>${D.goals.slice(0,3).map(g=>`<div class="eventItem"><span>🌱</span><span class="grow"><b>${esc(g.goal||g.name)}</b><br><small>${g.progress||0}% • ${esc(g.why||'Growing with purpose')}</small></span></div>`).join('')||'<div class="empty">No goals planted yet.</div>'}</div><div class="card"><h3>🏆 Tiny win</h3><p class="muted">Pick one thing you did today that counts.</p><button class="primary" onclick="addWin()">＋ Celebrate a win</button></div></div>`)}
function addWin(){const t=prompt('What tiny win are we celebrating?');if(t){D.wins.push({id:uid(),text:t,date:today()});save('🏆 Win saved')}}
function planner(){const y=calCursor.getFullYear(),m=calCursor.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),off=first.getDay();let c=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<off;i++)c+='<div class="day empty"></div>';for(let d=1;d<=days;d++){const k=new Date(y,m,d).toISOString().slice(0,10),items=[...D.events,...D.reminders].filter(x=>x.date===k&&!x.completed);c+=`<button class="day ${k===today()?'today ':''}${k===selected?'selected':''}" data-date="${k}"><b>${d}</b>${items.slice(0,2).map(x=>`<span class="eventdot">${x.type==='bill'?'💸':'•'} ${esc(x.title)}</span>`).join('')}</button>`}const items=[...D.events,...D.reminders].filter(x=>x.date===selected&&!x.completed),day=D.days[selected]||{};return shell('📅 PLANNER • V16','Your calendar, without the planner inside the planner.',`<div class="calendar"><div class="calhead"><button onclick="moveMonth(-1)">‹</button><h2>${calCursor.toLocaleString(undefined,{month:'long',year:'numeric'})}</h2><button onclick="moveMonth(1)">›</button></div><div class="calgrid">${c}</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="ey">SELECTED DAY</div><h2>${new Date(selected+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</h2></div><button onclick="selected=today();calCursor=new Date();render()">Today</button></div>${items.map(x=>`<div class="eventItem"><span>${x.type==='bill'?'💸':'📌'}</span><span class="grow"><b>${esc(x.title)}</b><br><small>${esc(x.time||'')}</small></span><button onclick="archiveItem('${x.id}')">🗄️</button></div>`).join('')||'<div class="empty">No events yet. Blank canvas ♡</div>'}<div class="row"><button class="primary" onclick="addEvent()">＋ Add Event</button><button onclick="addBill()">💸 Add Bill</button><button onclick="editDay()">✏️ Edit Day</button></div><div class="card"><input id="dayMood" class="input" placeholder="Mood" value="${esc(day.mood||'')}"><textarea id="dayNotes" placeholder="Day notes / reflection">${esc(day.notes||'')}</textarea><button class="primary" onclick="saveDay()">💾 Save Day</button></div></div></div>`)}
function moveMonth(n){calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+n,1);render()}function addEvent(){const t=prompt('Event name?');if(!t)return;D.events.push({id:uid(),title:t,date:selected,time:prompt('Time? (optional)')||'',type:'event'});save('📌 Event added')}function addBill(){const t=prompt('Bill name?');if(!t)return;D.reminders.push({id:uid(),title:t,date:selected,type:'bill',amount:+prompt('Amount?')||0,completed:false});save('💸 Bill added')}function archiveItem(id){const x=[...D.events,...D.reminders].find(a=>a.id===id);if(!x)return;D.archive=D.archive||[];D.archive.push({...x,archivedAt:today()});D.events=D.events.filter(a=>a.id!==id);D.reminders=D.reminders.filter(a=>a.id!==id);save('🗄️ Archived')}function saveDay(){D.days[selected]={mood:document.getElementById('dayMood').value,notes:document.getElementById('dayNotes').value};save('📝 Day saved')}function editDay(){document.getElementById('dayMood')?.focus()}
function tasks(){const ts=D.tasks.filter(t=>t.date===today());return shell('📝 TASKS + ROUTINES','Break the day into tiny pieces.',`<div class="card"><h3>➕ Add Task</h3><div class="row"><input id="taskText" class="input" placeholder="Task name"><button class="primary" onclick="addTask()">Add</button></div></div><div class="card"><h2>🎀 Structured Routines</h2><p class="muted">Paste your daily structured routine below. Each line becomes its own checkbox, and every step is tracked by date.</p><div class="row"><input id="routineName" class="input" placeholder="Routine name"><select id="routineFreq" class="input"><option value="daily">Every day</option><option value="weekdays">Weekdays</option><option value="weekly">Weekly</option></select></div><textarea id="routineSteps" placeholder="Paste one routine step per line...\nWake up\nTake medication\nBrush teeth\nBreakfast\nGet dressed"></textarea><button class="primary" onclick="addRoutine()">🌱 Create Routine From Steps</button></div><div class="card"><div class="row"><button onclick="routineDate=shiftDate(routineDate,-1);render()">‹</button><input class="input" type="date" value="${routineDate}" onchange="routineDate=this.value;render()"><button onclick="routineDate=shiftDate(routineDate,1);render()">›</button></div><h3>📋 ${new Date(routineDate+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</h3>${D.routines.map(r=>`<div class="goal"><div style="display:flex;justify-content:space-between;gap:8px"><div><h3>${esc(r.name)}</h3><small>${r.steps.length} steps • ${r.frequency}</small></div><button class="danger" onclick="deleteRoutine('${r.id}')">🗑️</button></div><div class="steps">${r.steps.map((s,i)=>`<label class="step"><input type="checkbox" ${r.checks?.[routineDate]?.[i]?'checked':''} onchange="toggleRoutineStep('${r.id}',${i})"><span>${esc(s)}</span></label>`).join('')}</div><div class="progress"><i style="width:${routinePct(r,routineDate)}%"></i></div><small>${routinePct(r,routineDate)}% complete on this day</small></div>`).join('')||'<div class="empty">🎀 No routines yet. Paste your structured routine above.</div>'}</div>`)}
function shiftDate(k,n){const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function addTask(){const t=document.getElementById('taskText').value.trim();if(!t)return;D.tasks.push({id:uid(),text:t,date:today(),done:false});save('📝 Task added')}function addRoutine(){const name=document.getElementById('routineName').value.trim()||'Daily Routine',steps=document.getElementById('routineSteps').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!steps.length)return;D.routines.push({id:uid(),name,frequency:document.getElementById('routineFreq').value,steps,checks:{}});save('🎀 Routine created')}function toggleRoutineStep(id,i){const r=D.routines.find(x=>x.id===id);if(!r)return;r.checks=r.checks||{};r.checks[routineDate]=r.checks[routineDate]||{};r.checks[routineDate][i]=!r.checks[routineDate][i];save('✓ Routine step saved')}function routinePct(r,k){return r.steps.length?Math.round(Object.values(r.checks?.[k]||{}).filter(Boolean).length/r.steps.length*100):0}function deleteRoutine(id){D.routines=D.routines.filter(x=>x.id!==id);save('🗑️ Routine removed')}
function garden(){const hs=habitStats(),names=['🌱','🪴','🌷','🌸','🌺','🌻','🍓'];return shell('🌷 HABIT GARDEN • V16','My Habit Garden ♡',`<div class="hero" style="margin:0 0 10px"><div class="ey">GROW WHAT MATTERS</div><p class="muted">This brings back the old garden model: daily dots, weekly progress, best streaks, focus habits, and a visible home garden using the same data.</p><div class="row"><input id="habitName" class="input" placeholder="Add a habit…"><button class="primary" onclick="addHabit()">＋ Add Habit</button></div></div><div class="grid"><div class="stat"><small>TODAY</small><b>${hs.today}/${D.habits.length}</b></div><div class="stat"><small>THIS WEEK</small><b>${hs.week}%</b></div><div class="stat"><small>BEST STREAK</small><b>${hs.best} 🔥</b></div><div class="stat"><small>ACTIVE HABITS</small><b>${D.habits.length}</b></div></div><div class="card"><div class="habitgrid">${D.habits.length?D.habits.map((h,i)=>{const week=[];for(let j=0;j<7;j++){const d=new Date();d.setDate(d.getDate()-d.getDay()+j);week.push(d.toISOString().slice(0,10))}const w=week.filter(k=>h.days?.[k]).length;return `<article class="habit"><button style="position:absolute;right:9px;top:9px" onclick="deleteHabit('${h.id}')">×</button><div class="plant">${h.icon||names[i%names.length]}</div><h3>${esc(h.name)}</h3><p class="muted">${w}/7 days • ${Math.round(w/7*100)}%</p><div class="progress"><i style="width:${Math.round(w/7*100)}%"></i></div><div class="dots">${week.map(k=>`<button class="dot ${h.days?.[k]?'on':''}" onclick="toggleHabit('${h.id}','${k}')">${new Date(k+'T12:00:00').toLocaleDateString(undefined,{weekday:'narrow'})}</button>`).join('')}</div><small>Best streak: ${streak(h)} 🔥</small></article>`}).join(''):'<div class="empty">🌱 Your garden is waiting for its first seed.</div>'}</div></div><div class="split"><div class="card"><div class="ring" style="--pct:${hs.week}%"><span>${hs.week}%<br>Overall Progress</span></div></div><div class="card"><h3>🌸 Today's Focus</h3><p class="muted">Pick 1–2 habits to focus on today.</p>${D.habits.filter(h=>!h.days?.[today()]).slice(0,2).map(h=>`<button class="primary" style="width:100%;margin:4px 0" onclick="toggleHabit('${h.id}','${today()}')">🌷 Focus: ${esc(h.name)}</button>`).join('')||'<div class="empty">All checked in for today. ✨</div>'}</div></div>`)}
function addHabit(){const n=document.getElementById('habitName').value.trim();if(!n)return;if(D.habits.some(h=>h.name.toLowerCase()===n.toLowerCase()))return;D.habits.push({id:uid(),name:n,icon:'🌷',days:{}});save('🌱 Habit planted')}function toggleHabit(id,k){const h=D.habits.find(x=>x.id===id);if(!h)return;h.days=h.days||{};h.days[k]=!h.days[k];save('🌷 Garden updated')}function deleteHabit(id){D.habits=D.habits.filter(x=>x.id!==id);save('🗑️ Habit removed')}
function school(){const done=D.courses.filter(c=>['Completed','Transferred'].includes(c.status)).length,pct=D.totalClasses?Math.min(100,Math.round(done/D.totalClasses*100)):0,list=D.courses.filter(c=>c.school===activeSchool);return shell('🎀 SCHOOL HUB • V16','School, but actually interactive.',`<div class="grid"><div class="stat"><small>COMPLETED</small><b>${done}</b></div><div class="stat"><small>WGU</small><b>${D.courses.filter(c=>c.school==='WGU'&&['Completed','Transferred'].includes(c.status)).length}</b></div><div class="stat"><small>SOPHIA</small><b>${D.courses.filter(c=>c.school==='Sophia'&&['Completed','Transferred'].includes(c.status)).length}</b></div><div class="stat"><small>PROGRESS</small><b>${pct}%</b></div></div><div class="card"><div style="display:flex;justify-content:space-between"><b>🎓 Bachelor's Progress</b><b>${pct}%</b></div><div class="progress"><i style="width:${pct}%"></i></div><div class="row"><input id="totalClasses" class="input" type="number" value="${D.totalClasses||''}" placeholder="Total classes"><button class="primary" onclick="saveTotal()">Save</button></div></div><div class="card"><div class="row"><button class="${activeSchool==='WGU'?'primary':''}" onclick="activeSchool='WGU';render()">🎓 WGU</button><button class="${activeSchool==='Sophia'?'primary':''}" onclick="activeSchool='Sophia';render()">🌱 Sophia</button></div>${list.map(c=>courseCard(c)).join('')||'<div class="empty">No courses here yet.</div>'}</div><div class="card"><h3>${editingCourse?'✏️ Edit Course':'➕ Add Course'}</h3><div class="row"><input id="courseName" class="input" placeholder="Course name" value="${esc(editingCourse?.name||'')}"><select id="courseSchool" class="input"><option ${activeSchool==='WGU'?'selected':''}>WGU</option><option ${activeSchool==='Sophia'?'selected':''}>Sophia</option></select><select id="courseStatus" class="input">${['Not Started','In Progress','Completed','Transferred'].map(s=>`<option ${editingCourse?.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="row"><input id="courseGrade" class="input" placeholder="Grade" value="${esc(editingCourse?.grade||'')}"><input id="courseCredits" class="input" placeholder="Credits" value="${esc(editingCourse?.credits||'')}"><input id="courseAssignments" class="input" placeholder="Assignments" value="${esc(editingCourse?.assignments||'')}"><input id="courseFinish" class="input" type="date" value="${editingCourse?.finish||''}"></div><textarea id="courseReflection" placeholder="Class reflection: what did I learn, what was hard, what do I want to remember?">${esc(editingCourse?.reflection||'')}</textarea><div class="row"><button class="primary" onclick="saveCourse()">💾 Save Course</button><button onclick="editingCourse=null;render()">Clear</button></div></div>`)}
function courseCard(c){const steps=Math.max(1,Number(c.assignmentsTotal)||Number(c.assignments)||1),doneA=Number(c.assignmentsDone)||0,cp=c.status==='Completed'||c.status==='Transferred'?100:Math.min(99,Math.round(doneA/steps*100));return `<div class="goal"><div style="display:flex;justify-content:space-between;gap:8px"><div><h3>${esc(c.name)}</h3><span class="pill">${esc(c.status)}</span> <span class="pill">${esc(c.school)}</span></div><button onclick="editCourse('${c.id}')">✏️ Edit</button></div><div class="progress"><i style="width:${cp}%"></i></div><small>Course progress: ${cp}%${c.finish?' • Finish: '+esc(c.finish):''}</small><div class="reflection"><b>📖 Class reflection</b><div class="muted">${esc(c.reflection||'No reflection yet.')}</div></div></div>`}function saveTotal(){D.totalClasses=+document.getElementById('totalClasses').value||0;save('🎓 Degree total saved')}function editCourse(id){editingCourse=D.courses.find(c=>c.id===id)||null;render()}function saveCourse(){const c={id:editingCourse?.id||uid(),name:document.getElementById('courseName').value.trim()||'Untitled Course',school:document.getElementById('courseSchool').value,status:document.getElementById('courseStatus').value,grade:document.getElementById('courseGrade').value.trim(),credits:document.getElementById('courseCredits').value.trim(),assignments:document.getElementById('courseAssignments').value.trim(),finish:document.getElementById('courseFinish').value,reflection:document.getElementById('courseReflection').value.trim(),assignmentsTotal:editingCourse?.assignmentsTotal||0,assignmentsDone:editingCourse?.assignmentsDone||0};const i=D.courses.findIndex(x=>x.id===c.id);i>=0?D.courses[i]=c:D.courses.push(c);editingCourse=null;save('🎀 Course saved')} 
function moneyPage(){const m=D.money,total=(+m.income||0)+(+m.funds||0),left=total-(+m.bills||0)-(+m.spend||0)-(+m.saving||0)-(+m.debt||0);return shell('☕ MONEY CAFÉ • V16','What can I actually touch?',`<div class="grid"><div class="stat"><small>INCOME</small><input id="income" class="input" type="number" value="${m.income||''}"></div><div class="stat"><small>💗 CURRENT FUNDS</small><input id="funds" class="input" type="number" value="${m.funds||''}"></div><div class="stat"><small>COMBINED</small><b>${money(total)}</b></div><div class="stat"><small>LEFT AFTER PLAN</small><b>${money(left)}</b></div></div><div class="card"><div class="grid">${[['bills','BILLS'],['spend','SPENDING'],['saving','SAVINGS'],['debt','DEBT']].map(([k,l])=>`<div class="stat"><small>${l}</small><input id="${k}" class="input" type="number" value="${m[k]||''}"></div>`).join('')}</div><button class="primary" onclick="saveMoney()">💾 Save Money Snapshot</button></div>`)}function saveMoney(){['income','funds','bills','spend','saving','debt'].forEach(k=>D.money[k]=+document.getElementById(k).value||0);save('☕ Money saved')}
function reminders(){return shell('🔔 REMINDERS','Future-you’s sticky notes.',`<div class="card"><div class="row"><input id="remTitle" class="input" placeholder="Reminder or bill"><input id="remDate" class="input" type="date" value="${today()}"><button class="primary" onclick="addReminder()">＋ Add</button></div></div><div class="card">${D.reminders.map(r=>`<div class="eventItem"><button onclick="completeReminder('${r.id}')">${r.completed?'✓':'○'}</button><span class="grow"><b>${esc(r.title)}</b><br><small>${esc(r.date)}</small></span><button onclick="archiveItem('${r.id}')">🗄️</button></div>`).join('')||'<div class="empty">🔔 No reminders yet.</div>'}</div>`)}function addReminder(){const t=document.getElementById('remTitle').value.trim();if(!t)return;D.reminders.push({id:uid(),title:t,date:document.getElementById('remDate').value||today(),type:'reminder',completed:false});save('🔔 Reminder added')}function completeReminder(id){const r=D.reminders.find(x=>x.id===id);if(r){r.completed=!r.completed;save('✓ Reminder updated')}}
function brain(){return shell('📝 BRAIN DUMP','Get it out of your head.',`<div class="card"><textarea id="brainText">${esc(D.brain)}</textarea><button class="primary" onclick="D.brain=document.getElementById('brainText').value;save('🧠 Saved')">💾 Save Brain Dump</button></div>`)}
function wellness(){const w=D.wellness||{};return shell('🌸 WELLNESS','Check in, don’t judge.',`<div class="card"><div class="row"><input id="wmood" class="input" type="number" min="1" max="10" placeholder="Mood 1–10" value="${w.mood||''}"><input id="wenergy" class="input" type="number" min="1" max="10" placeholder="Energy 1–10" value="${w.energy||''}"></div><textarea id="wnote">${esc(w.note||'')}</textarea><button class="primary" onclick="D.wellness={mood:+document.getElementById('wmood').value||0,energy:+document.getElementById('wenergy').value||0,note:document.getElementById('wnote').value};save('🌸 Check-in saved')">🌸 Save Check-in</button></div>`)}
function goals(){return shell('✨ GOALS GARDEN • V16','Grow the things you want.',`<div class="card"><div class="ey">🌱 PLANT SOMETHING</div><h2>What are you growing?</h2><p class="muted">Back to the older goal garden model: goal, why it matters, deadline, next tiny step, visible progress, and growth controls.</p><div class="grid"><input id="goalName" class="input" placeholder="Goal"><input id="goalWhy" class="input" placeholder="Why does this matter?"><input id="goalDate" class="input" type="date"><input id="goalNext" class="input" placeholder="Next tiny step…"></div><button class="primary" style="margin-top:9px;width:100%" onclick="addGoal()">🌱 Plant Goal</button></div><div class="card"><div class="ey">🌷 YOUR GOALS</div><h2>Your little goal garden</h2>${D.goals.map((g,i)=>{const p=Math.max(0,Math.min(100,+g.progress||0)),date=g.deadline?new Date(g.deadline+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';return `<div class="goal"><div class="goaltop"><div class="seed">${['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7]}</div><div class="grow"><h3>${esc(g.goal||g.name||'Goal')}</h3>${g.why?`<div class="muted">${esc(g.why)}</div>`:''}<div style="margin-top:7px">${date?`<span class="pill">📅 ${date}</span>`:''} <span class="pill">${p===100?'🌸 Bloomed!':'🌱 Growing'}</span></div></div><div class="goalring" style="--p:${p}%"><span>${p}%</span></div></div><div class="progress"><i style="width:${p}%"></i></div><div class="row"><button onclick="changeGoal('${g.id}',10)">＋10%</button><button onclick="changeGoal('${g.id}',-10)">−10%</button><button onclick="archiveGoal('${g.id}')">🗄️ Archive</button></div><div class="reflection">🌱 Next: ${esc(g.next||'Choose one tiny next step.')}</div></div>`}).join('')||'<div class="empty">🌱 Nothing planted yet.</div>'}</div>`)}function addGoal(){const n=document.getElementById('goalName').value.trim();if(!n)return;D.goals.push({id:uid(),goal:n,why:document.getElementById('goalWhy').value.trim(),deadline:document.getElementById('goalDate').value,next:document.getElementById('goalNext').value.trim(),progress:0});save('✨ Goal planted')}function changeGoal(id,n){const g=D.goals.find(x=>x.id===id);if(g){g.progress=Math.max(0,Math.min(100,(+g.progress||0)+n));save('✨ Goal updated')}}function archiveGoal(id){const g=D.goals.find(x=>x.id===id);if(!g)return;D.archive=D.archive||[];D.archive.push({type:'goal',item:g,archivedAt:today()});D.goals=D.goals.filter(x=>x.id!==id);save('🗄️ Goal archived')}
function wins(){return shell('🏆 LITTLE WINS','Proof that you are doing things.',`<div class="card"><button class="primary" onclick="addWin()">＋ Celebrate another win</button></div>${[...D.wins].reverse().map(w=>`<div class="eventItem"><span>🏆</span><span class="grow"><b>${esc(w.text)}</b><br><small>${esc(w.date)}</small></span></div>`).join('')||'<div class="empty">🏆 Your wins will live here.</div>'}`)}function archive(){return shell('🗄️ ARCHIVE','Nothing disappears forever.',`<div class="card">${[...(D.archive||[])].reverse().map(x=>`<div class="eventItem"><span>${x.type==='goal'?'🌱':'🗄️'}</span><span class="grow"><b>${esc(x.item?.goal||x.item?.title||'Archived item')}</b><br><small>Archived ${esc(x.archivedAt||'')}</small></span></div>`).join('')||'<div class="empty">🗄️ Archive is empty.</div>'}</div>`)}
function render(){nav();const map={home,planner,tasks,garden,school,money:moneyPage,reminders,brain,wellness,goals,wins,archive};document.getElementById('pages').innerHTML=map[active]();if(active==='planner')document.querySelectorAll('.day[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()})}render();
</script></body></html>
