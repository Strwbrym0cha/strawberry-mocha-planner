<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner V16 🍓</title><style>:root{--pink:#e99ab7;--dark:#b96c88;--soft:#fff0f5;--cream:#fffaf6;--bg:#fbf5f2;--ink:#674941;--muted:#99817a;--line:#eadbd6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:15px;padding:10px 13px;font-weight:850;cursor:pointer}button.primary,.nav button.active{background:var(--soft);border-color:#efbfd0;color:var(--dark)}.app{max-width:1280px;margin:auto;padding:8px 14px 45px}.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 10px}.brand{font-weight:950;color:var(--dark);font-size:20px}.badge{font-size:9px;color:var(--dark);border:1px solid var(--line);border-radius:99px;padding:7px 10px;background:#fff}.nav{display:flex;gap:7px;overflow-x:auto;position:sticky;top:0;z-index:30;padding:8px 0 12px;background:#fbf5f2ee}.nav button{white-space:nowrap}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,#f6d6e2,#fff8ef);border-radius:30px;padding:25px;margin-bottom:12px}.ey{font-size:9px;letter-spacing:.16em;font-weight:950;color:var(--dark)}h1{font-size:36px;margin:7px 0}.muted{color:var(--muted);font-size:13px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.stat,.goal,.habit{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin:9px 0}.stat{background:var(--cream);margin:0}.stat small{display:block;color:var(--muted);font-size:9px;font-weight:950}.stat b{display:block;font-size:24px;margin-top:4px}.input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink)}textarea{min-height:100px}.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}.progress{height:11px;background:#f0e3e5;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;width:0;background:var(--pink);border-radius:99px}.pill{display:inline-block;background:var(--soft);border-radius:10px;padding:5px 8px;font-size:10px;color:var(--dark);font-weight:850}.eventItem{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:15px;padding:10px;margin:6px 0;background:var(--cream)}.grow{flex:1}.calendar{background:#fff;border:1px solid var(--line);border-radius:25px;padding:15px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:10px;font-weight:900;padding:6px}.day{min-height:70px;padding:7px;border-radius:14px;text-align:left}.day.today{background:var(--soft)}.day.selected{outline:2px solid var(--pink)}.habitgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.plant{text-align:center;font-size:54px;height:82px}.dots{display:flex;gap:4px;flex-wrap:wrap}.dot{width:28px;height:28px;padding:0;border-radius:50%;font-size:10px}.dot.on{background:var(--soft);border-color:#efbfd0}.ring{width:105px;height:105px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pink) var(--pct,0),#eee 0);position:relative}.ring:after{content:'';width:76px;height:76px;border-radius:50%;background:#fff;position:absolute}.ring span{z-index:1;font-weight:950}.ringrow{display:flex;gap:15px;align-items:center}.reflection{background:var(--cream);border-radius:14px;padding:11px;margin-top:9px}.empty{padding:20px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center;background:#fffaf8}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.habitgrid,.split{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.habitgrid,.split{grid-template-columns:1fr}.badge{display:none}h1{font-size:30px}}</style></head><body><div class="app"><header class="top"><div class="brand">🍓 Strawberry Mocha</div><div class="badge">V16 • INTERACTIVE</div></header><nav class="nav" id="nav"></nav><main id="pages"></main></div><script>
const KEY='sm_v16',pad=n=>String(n).padStart(2,'0'),localDate=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`},dateFrom=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)},shiftDate=(s,n)=>{const d=dateFrom(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+(Number(n)||0).toFixed(2);let db={data:{}};try{db=JSON.parse(localStorage.getItem(KEY)||'{"data":{}}')}catch(e){}const D=db.data||{};for(const k of ['events','reminders','tasks','routines','habits','goals','wins','courses','archive'])if(!Array.isArray(D[k]))D[k]=[];D.days=D.days&&typeof D.days==='object'?D.days:{};D.money=D.money||{income:0,funds:0,bills:0,spend:0,saving:0,debt:0};D.totalClasses=Number(D.totalClasses)||0;D.brain=D.brain||'';function save(){db.data=D;localStorage.setItem(KEY,JSON.stringify(db));render()}
let active=localStorage.getItem('sm_v16_page')||'home',selected=localDate(),routineDate=localDate(),month=new Date(),schoolFilter='WGU',editCourseId=null;const tabs=[['home','🏠 Home'],['planner','📅 Planner'],['tasks','📝 Tasks'],['garden','🌷 Habit Garden'],['school','🎀 School'],['money','☕ Money'],['reminders','🔔 Reminders'],['brain','📝 Brain Dump'],['wellness','🌸 Wellness'],['goals','✨ Goals'],['wins','🏆 Wins'],['archive','🗄️ Archive']];function nav(){document.getElementById('nav').innerHTML=tabs.map(x=>`<button class="${active===x[0]?'active':''}" onclick="active='${x[0]}';localStorage.setItem('sm_v16_page',active);render()">${x[1]}</button>`).join('')}function shell(a,b,c){return `<section class="page active"><div class="hero"><div class="ey">${a}</div><h1>${b}</h1></div>${c}</section>`}function streak(h){const a=Object.keys(h.days||{}).filter(k=>h.days[k]).sort().reverse();let best=0,run=0,last=null;for(const k of a){const d=dateFrom(k);run=!last||Math.round((last-d)/86400000)===1?run+1:1;best=Math.max(best,run);last=d}return best}function weekKeys(){const d=dateFrom(localDate());d.setDate(d.getDate()-d.getDay());const base=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;return Array.from({length:7},(_,i)=>shiftDate(base,i))}function habitPct(){const w=weekKeys(),possible=D.habits.length*7;return possible?Math.round(D.habits.reduce((n,h)=>n+w.filter(k=>h.days?.[k]).length,0)/possible*100):0}
function home(){const hp=habitPct(),done=D.courses.filter(c=>['Completed','Transferred'].includes(c.status)).length,deg=D.totalClasses?Math.min(100,Math.round(done/D.totalClasses*100)):0;return shell('🍓 STRAWBERRY MOCHA • V16','Good morning, Kat ♡',`<div class="grid"><div class="stat"><small>🎓 DEGREE</small><b>${deg}%</b></div><div class="stat"><small>🌷 HABITS</small><b>${hp}%</b></div><div class="stat"><small>☕ AVAILABLE</small><b>${money((+D.money.income||0)+(+D.money.funds||0))}</b></div><div class="stat"><small>🏆 WINS</small><b>${D.wins.length}</b></div></div><div class="split"><div class="card"><div class="ringrow"><div class="ring" style="--pct:${deg}%"><span>${deg}%</span></div><div><h3>🎓 Degree Journey</h3><p class="muted">${done} completed of ${D.totalClasses||0} total.</p></div></div></div><div class="card"><div class="ringrow"><div class="ring" style="--pct:${hp}%"><span>${hp}%</span></div><div><h3>🌷 Habit Garden</h3><p class="muted">Connected to the actual garden data.</p></div></div></div></div><div class="card"><h2>🌱 Growing Garden</h2><div class="habitgrid">${D.habits.map((h,i)=>`<div class="habit"><div class="plant">${h.icon||['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7]}</div><b>${esc(h.name)}</b><div class="progress"><i style="width:${Math.min(100,Object.values(h.days||{}).filter(Boolean).length*3)}%"></i></div><small>${Object.values(h.days||{}).filter(Boolean).length} completed days • ${streak(h)} best streak</small></div>`).join('')||'<div class="empty">🌱 Plant your first habit in Habit Garden.</div>'}</div></div>`)}
function planner(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0).getDate(),off=first.getDay();let c=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<off;i++)c+='<div></div>';for(let d=1;d<=last;d++){const k=`${y}-${pad(m+1)}-${pad(d)}`;c+=`<button class="day ${k===localDate()?'today':''} ${k===selected?'selected':''}" onclick="selected='${k}';render()"><b>${d}</b>${[...D.events,...D.reminders].filter(x=>x.date===k&&!x.completed).slice(0,2).map(x=>`<small style="display:block">• ${esc(x.title)}</small>`).join('')}</button>`}const its=[...D.events,...D.reminders].filter(x=>x.date===selected&&!x.completed),day=D.days[selected]||{};return shell('📅 PLANNER','Calendar + daily notes',`<div class="calendar"><div class="row"><button onclick="month=new Date(y,m-1,1);render()">‹</button><h2 style="flex:3;text-align:center">${month.toLocaleString(undefined,{month:'long',year:'numeric'})}</h2><button onclick="month=new Date(y,m+1,1);render()">›</button></div><div class="calgrid">${c}</div><div class="card"><h2>${dateFrom(selected).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h2>${its.map(x=>`<div class="eventItem"><span class="grow"><b>${esc(x.title)}</b> ${x.amount?money(x.amount):''}</span><button onclick="archiveItem('${x.id}')">🗄️</button></div>`).join('')||'<div class="empty">No events.</div>'}<div class="row"><button class="primary" onclick="addEvent()">＋ Event</button><button onclick="addBill()">💸 Bill</button></div><input id="mood" class="input" placeholder="Mood" value="${esc(day.mood||'')}"><textarea id="notes" placeholder="Day notes">${esc(day.notes||'')}</textarea><button class="primary" onclick="D.days[selected]={mood:mood.value,notes:notes.value};save()">💾 Save Day</button></div></div>`)}function addEvent(){const t=prompt('Event name?');if(t){D.events.push({id:uid(),title:t,date:selected,type:'event',completed:false});save()}}function addBill(){const t=prompt('Bill name?');if(t){D.reminders.push({id:uid(),title:t,date:selected,type:'bill',amount:+prompt('Amount?')||0,completed:false});save()}}function archiveItem(id){const x=[...D.events,...D.reminders].find(a=>a.id===id);if(!x)return;D.archive.push({item:x,type:x.type,archivedAt:localDate()});D.events=D.events.filter(a=>a.id!==id);D.reminders=D.reminders.filter(a=>a.id!==id);save()}
function tasks(){const ts=D.tasks.filter(t=>t.date===routineDate);return shell('📝 TASKS + ROUTINES','Every step counts.',`<div class="card"><h2>📌 Tasks for ${routineDate}</h2>${ts.map(t=>`<div class="eventItem"><button onclick="tDone('${t.id}')">${t.done?'✓':'○'}</button><span class="grow" style="${t.done?'text-decoration:line-through;opacity:.5':''}">${esc(t.text)}</span><button onclick="tDel('${t.id}')">🗑️</button></div>`).join('')||'<div class="empty">No tasks yet.</div>'}<div class="row"><input id="taskText" class="input" placeholder="Task"><button class="primary" onclick="addTask()">＋ Add</button></div></div><div class="card"><h2>🎀 Build a routine from your pasted routine</h2><div class="row"><input id="rName" class="input" placeholder="Routine name"><select id="rFreq"><option>daily</option><option>weekdays</option><option>weekly</option></select></div><textarea id="rSteps" placeholder="Paste one step per line...&#10;Wake up&#10;Brush teeth&#10;Breakfast"></textarea><button class="primary" onclick="addRoutine()">🌱 Create Routine</button></div><div class="card"><div class="row"><button onclick="routineDate=shiftDate(routineDate,-1);render()">‹</button><input class="input" type="date" value="${routineDate}" onchange="routineDate=this.value;render()"><button onclick="routineDate=shiftDate(routineDate,1);render()">›</button></div>${D.routines.map(r=>`<div class="goal"><h3>${esc(r.name)}</h3><small>${r.frequency} • ${r.steps.length} steps</small>${r.steps.map((s,i)=>`<label class="eventItem"><input type="checkbox" ${r.checks?.[routineDate]?.[i]?'checked':''} onchange="rToggle('${r.id}',${i})"><span>${esc(s)}</span></label>`).join('')}<div class="progress"><i style="width:${rPct(r)}%"></i></div><small>${rPct(r)}% complete for ${routineDate}</small></div>`).join('')||'<div class="empty">No routines yet.</div>'}</div>`)}function addTask(){const t=taskText.value.trim();if(!t)return;D.tasks.push({id:uid(),text:t,date:routineDate,done:false});save()}function tDone(id){const t=D.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save()}}function tDel(id){D.tasks=D.tasks.filter(x=>x.id!==id);save()}function addRoutine(){const steps=rSteps.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!steps.length)return;D.routines.push({id:uid(),name:rName.value.trim()||'Daily Routine',frequency:rFreq.value,steps,checks:{}});save()}function rToggle(id,i){const r=D.routines.find(x=>x.id===id);if(!r)return;r.checks=r.checks||{};r.checks[routineDate]=r.checks[routineDate]||{};r.checks[routineDate][i]=!r.checks[routineDate][i];save()}function rPct(r){return r.steps.length?Math.round(Object.values(r.checks?.[routineDate]||{}).filter(Boolean).length/r.steps.length*100):0}
function garden(){const w=weekKeys();return shell('🌷 HABIT GARDEN','The old garden model, restored',`<div class="grid"><div class="stat"><small>TODAY</small><b>${D.habits.filter(h=>h.days?.[localDate()]).length}/${D.habits.length}</b></div><div class="stat"><small>THIS WEEK</small><b>${habitPct()}%</b></div><div class="stat"><small>BEST STREAK</small><b>${Math.max(0,...D.habits.map(streak))} 🔥</b></div><div class="stat"><small>HABITS</small><b>${D.habits.length}</b></div></div><div class="card"><div class="row"><input id="hName" class="input" placeholder="New habit"><button class="primary" onclick="addHabit()">🌱 Plant</button></div></div><div class="habitgrid">${D.habits.map((h,i)=>`<div class="habit"><button style="float:right" onclick="delHabit('${h.id}')">×</button><div class="plant">${h.icon||['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7]}</div><h3>${esc(h.name)}</h3><small>${w.filter(k=>h.days?.[k]).length}/7 this week • ${streak(h)} best streak</small><div class="dots">${w.map(k=>`<button class="dot ${h.days?.[k]?'on':''}" onclick="hToggle('${h.id}','${k}')">${dateFrom(k).toLocaleDateString(undefined,{weekday:'narrow'})}</button>`).join('')}</div></div>`).join('')||'<div class="empty">🌱 Your garden is waiting.</div>'}</div>`)}function addHabit(){const n=hName.value.trim();if(!n)return;if(D.habits.some(h=>String(h.name).toLowerCase()===n.toLowerCase()))return;D.habits.push({id:uid(),name:n,icon:'🌷',days:{}});save()}function hToggle(id,k){const h=D.habits.find(x=>x.id===id);if(h){h.days=h.days||{};h.days[k]=!h.days[k];save()}}function delHabit(id){D.habits=D.habits.filter(x=>x.id!==id);save()}
function school(){const done=D.courses.filter(c=>['Completed','Transferred'].includes(c.status)).length,deg=D.totalClasses?Math.min(100,Math.round(done/D.totalClasses*100)):0,list=D.courses.filter(c=>c.school===schoolFilter),e=editCourseId?D.courses.find(c=>c.id===editCourseId):null;return shell('🎀 SCHOOL HUB','Courses with real progress',`<div class="grid"><div class="stat"><small>DEGREE</small><b>${deg}%</b></div><div class="stat"><small>COMPLETED</small><b>${done}</b></div><div class="stat"><small>WGU</small><b>${D.courses.filter(c=>c.school==='WGU'&&c.status==='Completed').length}</b></div><div class="stat"><small>SOPHIA</small><b>${D.courses.filter(c=>c.school==='Sophia'&&c.status==='Completed').length}</b></div></div><div class="card"><b>🎓 Bachelor's Progress</b><div class="progress"><i style="width:${deg}%"></i></div><div class="row"><input id="total" class="input" type="number" value="${D.totalClasses||''}" placeholder="Total classes"><button onclick="D.totalClasses=+total.value||0;save()">Save</button></div></div><div class="card"><div class="row"><button class="${schoolFilter==='WGU'?'primary':''}" onclick="schoolFilter='WGU';render()">🎓 WGU</button><button class="${schoolFilter==='Sophia'?'primary':''}" onclick="schoolFilter='Sophia';render()">🌱 Sophia</button></div>${list.map(c=>{const p=c.status==='Completed'||c.status==='Transferred'?100:Number(c.progress)||0;return `<div class="goal"><div style="display:flex;justify-content:space-between"><div><h3>${esc(c.name)}</h3><span class="pill">${esc(c.status)}</span></div><button onclick="editCourseId='${c.id}';render()">✏️ Edit</button></div><div class="progress"><i style="width:${p}%"></i></div><small>Progress: ${p}%${c.finish?' • Finish: '+c.finish:''}</small><div class="reflection"><b>📖 Class reflection</b><div class="muted">${esc(c.reflection||'No reflection yet.')}</div></div></div>`}).join('')||'<div class="empty">No courses yet.</div>'}</div><div class="card"><h3>${e?'✏️ Edit Course':'➕ Add Course'}</h3><input id="cName" class="input" placeholder="Course name" value="${esc(e?.name||'')}"><div class="row"><select id="cSchool"><option ${e?.school==='WGU'||!e?'selected':''}>WGU</option><option ${e?.school==='Sophia'?'selected':''}>Sophia</option></select><select id="cStatus">${['Not Started','In Progress','Completed','Transferred'].map(s=>`<option ${e?.status===s?'selected':''}>${s}</option>`).join('')}</select><input id="cProgress" class="input" type="number" min="0" max="100" value="${e?.progress??0}" placeholder="Progress %"></div><div class="row"><input id="cGrade" class="input" placeholder="Grade" value="${esc(e?.grade||'')}"><input id="cCredits" class="input" placeholder="Credits" value="${esc(e?.credits||'')}"><input id="cFinish" class="input" type="date" value="${e?.finish||''}"></div><textarea id="cReflection" placeholder="Class reflection...">${esc(e?.reflection||'')}</textarea><button class="primary" onclick="saveCourse()">💾 Save Course</button>${e?'<button onclick="editCourseId=null;render()">Cancel</button>':''}</div>`}function saveCourse(){const c={id:editCourseId||uid(),name:cName.value.trim()||'Untitled Course',school:cSchool.value,status:cStatus.value,progress:Math.max(0,Math.min(100,+cProgress.value||0)),grade:cGrade.value,credits:cCredits.value,finish:cFinish.value,reflection:cReflection.value};if(c.status==='Completed'||c.status==='Transferred')c.progress=100;const i=D.courses.findIndex(x=>x.id===c.id);i>=0?D.courses[i]=c:D.courses.push(c);editCourseId=null;save()}
function moneyPage(){return shell('☕ MONEY','Simple snapshot',`<div class="card"><div class="grid">${['income','funds','bills','spend','saving','debt'].map(k=>`<label><small>${k.toUpperCase()}</small><input id="m_${k}" class="input" type="number" value="${D.money[k]||''}"></label>`).join('')}</div><button class="primary" onclick="${['income','funds','bills','spend','saving','debt'].map(k=>`D.money.${k}=+m_${k}.value||0`).join(';')};save()">💾 Save</button></div>`)}function reminders(){return shell('🔔 REMINDERS','Future-you notes',`<div class="card"><div class="row"><input id="rem" class="input" placeholder="Reminder"><input id="rDate" class="input" type="date" value="${localDate()}"><button class="primary" onclick="addRem()">＋</button></div></div>${D.reminders.map(r=>`<div class="eventItem"><button onclick="remDone('${r.id}')">${r.completed?'✓':'○'}</button><span class="grow">${esc(r.title)}<br><small>${r.date}</small></span><button onclick="archiveItem('${r.id}')">🗄️</button></div>`).join('')||'<div class="empty">No reminders.</div>'}`)}function addRem(){if(!rem.value.trim())return;D.reminders.push({id:uid(),title:rem.value.trim(),date:rDate.value,completed:false});save()}function remDone(id){const r=D.reminders.find(x=>x.id===id);if(r){r.completed=!r.completed;save()}}
function brain(){return shell('📝 BRAIN DUMP','Get it out of your head',`<div class="card"><textarea id="brainText">${esc(D.brain)}</textarea><button class="primary" onclick="D.brain=brainText.value;save()">💾 Save</button></div>`)}function wellness(){const w=D.wellness||{};return shell('🌸 WELLNESS','Gentle check-in',`<div class="card"><div class="row"><input id="wm" class="input" type="number" min="1" max="10" placeholder="Mood 1–10" value="${w.mood||''}"><input id="we" class="input" type="number" min="1" max="10" placeholder="Energy 1–10" value="${w.energy||''}"></div><textarea id="wn">${esc(w.note||'')}</textarea><button class="primary" onclick="D.wellness={mood:+wm.value||0,energy:+we.value||0,note:wn.value};save()">🌸 Save</button></div>`)}
function goals(){return shell('✨ GOALS GARDEN','Grow what matters',`<div class="card"><h3>🌱 Plant a goal</h3><div class="grid"><input id="gName" class="input" placeholder="Goal"><input id="gWhy" class="input" placeholder="Why does this matter to me?"><input id="gDate" class="input" type="date"><input id="gNext" class="input" placeholder="Next tiny step"></div><button class="primary" onclick="addGoal()">🌱 Plant Goal</button></div><div class="card"><h2>🌷 Your Goal Garden</h2>${D.goals.map((g,i)=>{const p=Math.max(0,Math.min(100,+g.progress||0));return `<div class="goal"><h3>${['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7]} ${esc(g.goal||g.name)}</h3><p class="muted"><b>Why:</b> ${esc(g.why||'')}</p><small>${g.deadline?'📅 '+g.deadline:''}</small><div class="progress"><i style="width:${p}%"></i></div><div class="row"><button onclick="goalChange('${g.id}',10)">＋10%</button><button onclick="goalChange('${g.id}',-10)">−10%</button><button onclick="archiveGoal('${g.id}')">🗄️ Archive</button></div><div class="reflection">🌱 <b>Next:</b> ${esc(g.next||'Choose one tiny next step.')}</div></div>`}).join('')||'<div class="empty">🌱 Nothing planted yet.</div>'}</div>`)}function addGoal(){if(!gName.value.trim())return;D.goals.push({id:uid(),goal:gName.value.trim(),why:gWhy.value.trim(),deadline:gDate.value,next:gNext.value.trim(),progress:0});save()}function goalChange(id,n){const g=D.goals.find(x=>x.id===id);if(g){g.progress=Math.max(0,Math.min(100,(+g.progress||0)+n));save()}}function archiveGoal(id){const g=D.goals.find(x=>x.id===id);if(!g)return;D.archive.push({type:'goal',item:g,archivedAt:localDate()});D.goals=D.goals.filter(x=>x.id!==id);save()}
function wins(){return shell('🏆 LITTLE WINS','Proof you did things',`<button class="primary" onclick="const x=prompt('Tiny win?');if(x){D.wins.push({id:uid(),text:x,date:localDate()});save()}">＋ Celebrate a win</button>${D.wins.slice().reverse().map(w=>`<div class="eventItem">🏆 <span class="grow"><b>${esc(w.text)}</b><br><small>${w.date}</small></span></div>`).join('')}`)}function archive(){return shell('🗄️ ARCHIVE','Nothing disappears forever',`<div class="card">${D.archive.slice().reverse().map(x=>`<div class="eventItem">🗄️ <span>${esc(x.item?.goal||x.item?.title||'Archived item')}</span></div>`).join('')||'<div class="empty">Archive empty.</div>'}</div>`)}function render(){nav();const map={home,planner,tasks,garden,school,money:moneyPage,reminders,brain,wellness,goals,wins,archive};document.getElementById('pages').innerHTML=map[active]()}render();</script></body></html>
