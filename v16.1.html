<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner V16.1 🍓</title><style>html,body{margin:0;background:#fbf5f2}iframe{display:block;width:100%;height:100vh;min-height:900px;border:0}</style></head><body><iframe id="planner" src="./v16.html" title="Strawberry Mocha Planner V16.1"></iframe><script>(()=>{const f=document.getElementById('planner');function boot(){const w=f.contentWindow,d=f.contentDocument;if(!d)return;try{const s=JSON.parse(w.localStorage.getItem('sm_v16')||'{}');s.data=s.data||{};s.data.tasks=Array.isArray(s.data.tasks)?s.data.tasks:[];s.data.courses=Array.isArray(s.data.courses)?s.data.courses:[];s.data.habits=Array.isArray(s.data.habits)?s.data.habits:[];s.data.goals=Array.isArray(s.data.goals)?s.data.goals:[];s.data._stabilized=true;w.localStorage.setItem('sm_v16',JSON.stringify(s))}catch(e){};d.documentElement.style.overflow='visible';d.body.style.overflow='visible';f.style.height=Math.max(window.innerHeight,d.documentElement.scrollHeight,d.body.scrollHeight)+'px';patchTasks(w,d);patchCourses(w,d)}function patchTasks(w,d){if(w.__v161tasks)return;w.__v161tasks=true;const oldTasks=w.tasks;if(typeof oldTasks!=='function')return;w.tasks=function(){const out=oldTasks();return out.replace('<div class="card"><h2>🎀 Structured Routines</h2>','<div class="card"><h2>📌 Saved Tasks</h2><div id="v161Tasks">'+((JSON.parse(w.localStorage.getItem('sm_v16')||'{"data":{"tasks":[]}}').data.tasks||[]).filter(t=>t.date===(typeof w.localDate==='function'?w.localDate():new Date().toISOString().slice(0,10))).map(t=>'<div class="eventItem"><span class="grow">'+String(t.text||'')+'</span></div>').join('')||'<div class="empty">No tasks for this day.</div>')+'</div></div><div class="card"><h2>🎀 Structured Routines</h2>')} };}function patchCourses(w,d){if(w.__v161courses)return;w.__v161courses=true;const oldSchool=w.school;if(typeof oldSchool!=='function')return;w.school=function(){const html=oldSchool();return html.replace('placeholder="Course progress %"','placeholder="Course progress %" step="1"').replace('type="number" min="0" max="100" placeholder="Course progress %"','type="number" min="0" max="100" placeholder="Course progress %" step="1"')};}f.addEventListener('load',boot);window.addEventListener('resize',boot)})();</script></body></html>
