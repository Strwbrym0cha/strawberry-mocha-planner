<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strawberry Mocha Planner v10.1 🍓</title><style>html,body{margin:0;background:#fbf4f1}iframe{display:block;width:100%;height:100vh;min-height:700px;border:0}</style></head><body><iframe id="v10" src="./v10.html" title="Strawberry Mocha Planner v10"></iframe><script>const frame=document.getElementById('v10');function patch(){try{const v=frame.contentWindow,d=v.document,p=v.document.getElementById('pf');if(!p||!p.contentDocument)return;const pd=p.contentDocument;pd.querySelectorAll('.day').forEach(old=>{if(old.dataset.v101)return;const el=old.cloneNode(true);el.dataset.v101='1';old.replaceWith(el);el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const n=(el.innerText||'').trim().match(/^\\d+/);if(!n)return;const title=pd.querySelector('#monthName')?.textContent||'';const dt=new Date(title+' 1');if(Number.isNaN(dt.getTime()))return;const key=new Date(dt.getFullYear(),dt.getMonth(),Number(n[0])).toISOString().slice(0,10);if(typeof v.openDay==='function')v.openDay(key)},false)});}catch(e){console.log('V10.1 patch waiting',e)}}frame.addEventListener('load',()=>{setTimeout(patch,500);setTimeout(patch,1500);setTimeout(patch,3000)});setInterval(patch,2000);</script></body></html>
