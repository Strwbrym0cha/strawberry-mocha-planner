<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strawberry Mocha Planner v10.1 🍓</title><style>html,body{margin:0;background:#fbf4f1}iframe{display:block;width:100%;height:100vh;min-height:700px;border:0}</style></head><body><iframe id="v10" src="./v10.html" title="Strawberry Mocha Planner v10"></iframe><script>const frame=document.getElementById('v10');let hooked=null;function patch(){try{const v=frame.contentWindow,p=v.document.getElementById('pf');if(!p||!p.contentDocument)return;const pd=p.contentDocument;if(hooked===pd)return;hooked=pd;pd.addEventListener('click',function(e){const day=e.target.closest&&e.target.closest('.day');if(!day)return;const n=(day.innerText||'').trim().match(/^\d+/);if(!n)return;const title=pd.querySelector('#monthName')?.textContent||'';const dt=new Date(title+' 1');if(Number.isNaN(dt.getTime()))return;const key=new Date(dt.getFullYear(),dt.getMonth(),Number(n[0])).toISOString().slice(0,10);e.preventDefault();e.stopImmediatePropagation();if(typeof v.openDay==='function')v.openDay(key)},true)}catch(e){console.log('V10.1 patch waiting',e)}}frame.addEventListener('load',()=>{setTimeout(patch,300);setTimeout(patch,1000);setTimeout(patch,2500);setTimeout(patch,5000)});setInterval(patch,2000);</script></body></html>
