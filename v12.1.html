<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strawberry Mocha Planner V12.1 🍓</title>
<style>html,body{margin:0;background:#fbf5f2}iframe{display:block;width:100%;height:100vh;min-height:900px;border:0}</style>
</head>
<body>
<iframe id="plannerFrame" src="./v12.html" title="Strawberry Mocha Planner V12.1"></iframe>
<script>
(()=>{
const frame=document.getElementById('plannerFrame');
const KEY='sm_v10';
const money=n=>'$'+(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dateKey=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const parseKey=k=>{let a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const load=()=>{try{return JSON.parse(frame.contentWindow.localStorage.getItem(KEY)||'{}')}catch(e){return{}}};
const save=s=>frame.contentWindow.localStorage.setItem(KEY,JSON.stringify(s));
const data=s=>{s.v12=s.v12||{};s.v12.bills=s.v12.bills||[];s.v12.archive=s.v12.archive||[];return s};
function toast(t){let w=frame.contentWindow,d=w.document,x=d.getElementById('toast');if(x){x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1700)}}
function currentDue(b,ref=new Date()){
 let y=ref.getFullYear(),m=ref.getMonth()+1,day=Math.min(+b.dueDay||1,new Date(y,m,0).getDate());
 return dateKey(y,m,day);
}
function nextDue(b,ref){let d=currentDue(b,ref);let z=parseKey(d);if(z<new Date(ref.getFullYear(),ref.getMonth(),ref.getDate())){let y=z.getFullYear(),m=z.getMonth()+1;if(m===13){y++;m=1}let day=Math.min(+b.dueDay||1,new Date(y,m,0).getDate());return dateKey(y,m,day)}return d}
function paidFor(b,k){return (b.history||[]).some(h=>h.dueDate===k)}
function billDueInMonth(b,y,m){if(!b.active)return null;let day=Math.min(+b.dueDay||1,new Date(y,m,0).getDate());return dateKey(y,m,day)}
function injectStyle(d){if(d.getElementById('v121-style'))return;let st=d.createElement('style');st.id='v121-style';st.textContent=`
.v121-card{background:#fff;border:1px solid #eadbd6;border-radius:23px;padding:17px;box-shadow:0 12px 35px #67494110;margin:9px 0}.v121-list{margin-top:10px}.v121-bill{border:1px solid #eadbd6;border-radius:17px;padding:13px;margin:8px 0;background:#fffaf6}.v121-bill-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.v121-bill small{color:#99817a}.v121-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.v121-actions button{flex:1;min-width:110px}.v121-paid{background:#f4e9ee!important}.v121-archive{background:#fffaf6}.v121-history{margin-top:8px;padding-top:8px;border-top:1px solid #eadbd6}.v121-chip{display:inline-block;background:#fff0f5;color:#b96c88;border-radius:10px;padding:4px 7px;font-size:10px;font-weight:850;margin:2px}.v121-section{margin-top:12px}.v121-empty{color:#99817a;font-size:13px;padding:10px 0}.v121-calendar-dot{display:block;font-size:9px;color:#b96c88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.v121-calendar-dot.paid{color:#8b9b86}.v121-history-row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #eadbd6;font-size:12px}.v121-restore{background:#f6e6ed!important;color:#b96c88!important}
`;
d.head.appendChild(st)}
function getArchivePage(d){let p=d.getElementById('archive');if(p)return p;p=d.createElement('section');p.id='archive';p.className='page';p.innerHTML=`<div class="hero"><div class="ey">🗄️ ARCHIVE</div><h1>Nothing is really lost.</h1><p class="muted">Old bills, events, courses, habits and other records can live here until you need them again.</p></div><div id="v121ArchiveBills" class="v121-card"><h2>💰 Archived Bills</h2><div id="v121ArchiveBillList"></div></div><div class="v121-card"><h2>📦 Other Archived Items</h2><p class="muted">This space is ready for the rest of the planner as we connect more tabs to the archive.</p></div>`;d.querySelector('.app').appendChild(p);return p}
function addNav(d){let nav=d.getElementById('nav');if(!nav||d.getElementById('v121ArchiveNav'))return;let b=d.createElement('button');b.id='v121ArchiveNav';b.textContent='🗄️ Archive';b.dataset.page='archive';b.onclick=()=>{d.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='archive'));d.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));renderArchive(d)};nav.appendChild(b)}
function billManager(d){let moneyPage=d.getElementById('money');if(!moneyPage||d.getElementById('v121BillManager'))return;let card=d.createElement('div');card.id='v121BillManager';card.className='v121-card';card.innerHTML=`<div class="v121-bill-head"><div><div class="ey">💰 RECURRING BILLS</div><h2>Put bills on the calendar.</h2><p class="muted">Set a due day once and it repeats every month until you archive it.</p></div><span class="v121-chip">🔁 Monthly</span></div><div class="v121-section"><div class="row"><input id="v121BillName" class="input" placeholder="Bill name"><input id="v121BillAmount" class="input" type="number" step="0.01" placeholder="Amount"></div><div class="row"><input id="v121BillDue" class="input" type="number" min="1" max="31" placeholder="Due day (1–31)"><input id="v121BillCat" class="input" placeholder="Category"></div><div class="v121-actions"><button id="v121AddBill" class="primary">＋ Add Monthly Bill</button></div></div><div id="v121ActiveBills" class="v121-list"></div>`;moneyPage.appendChild(card);d.getElementById('v121AddBill').onclick=()=>addBill(d);renderBills(d)}
function addBill(d){let name=d.getElementById('v121BillName').value.trim();let amount=+d.getElementById('v121BillAmount').value||0;let due=Math.max(1,Math.min(31,+d.getElementById('v121BillDue').value||1));if(!name)return toast('Name the bill first 💰');let s=data(load());s.v12.bills.push({id:'bill_'+Date.now(),name,amount,dueDay:due,category:d.getElementById('v121BillCat').value.trim()||'Bill',active:true,createdAt:new Date().toISOString(),history:[]});save(s);['v121BillName','v121BillAmount','v121BillDue','v121BillCat'].forEach(id=>d.getElementById(id).value='');renderBills(d);renderCalendarBills(d);toast('Monthly bill added 💰')}
function archiveBill(d,id){let s=data(load()),i=s.v12.bills.findIndex(b=>b.id===id);if(i<0)return;let b=s.v12.bills.splice(i,1)[0];b.active=false;b.archivedAt=new Date().toISOString();s.v12.archive.push({type:'bill',item:b});save(s);renderBills(d);renderArchive(d);renderCalendarBills(d);toast('Bill archived 🗄️')}
function deleteBill(d,id){if(!confirm('Permanently delete this bill and its payment history?'))return;let s=data(load());s.v12.bills=s.v12.bills.filter(b=>b.id!==id);save(s);renderBills(d);renderCalendarBills(d);toast('Bill deleted')}
function payBill(d,id,k){let s=data(load()),b=s.v12.bills.find(x=>x.id===id);if(!b)return;if(!paidFor(b,k)){b.history=b.history||[];b.history.push({dueDate:k,paidDate:dateKey(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate()),amount:b.amount});save(s)}renderBills(d);renderCalendarBills(d);toast('Payment recorded ✓')}
function renderBills(d){let box=d.getElementById('v121ActiveBills');if(!box)return;let s=data(load()),arr=s.v12.bills.filter(b=>b.active);box.innerHTML=arr.length?arr.map(b=>{let due=nextDue(b,new Date()),paid=paidFor(b,due),last=(b.history||[]).slice(-1)[0];return `<div class="v121-bill"><div class="v121-bill-head"><div><b>${esc(b.name)}</b><div class="muted">${money(b.amount)} • ${esc(b.category)} • Due monthly on the ${b.dueDay}${b.dueDay==1?'st':b.dueDay==2?'nd':b.dueDay==3?'rd':'th'}</div><small>Next due: ${due}${last?' • Last paid: '+esc(last.paidDate):''}</small></div><span class="v121-chip">${paid?'✓ Paid':'Due'}</span></div><div class="v121-actions"><button class="${paid?'v121-paid':''}" onclick="window.v121PayBill('${b.id}','${due}')">${paid?'✓ Paid for '+due:'✓ Mark Paid'}</button><button onclick="window.v121ShowHistory('${b.id}')">📜 History</button><button onclick="window.v121ArchiveBill('${b.id}')">🗄️ Archive</button><button onclick="window.v121DeleteBill('${b.id}')">🗑️ Delete</button></div><div id="v121Hist_${b.id}" class="v121-history" style="display:none"></div></div>`}).join(''):'<div class="v121-empty">No recurring bills yet. Add one above and it will start appearing on the Planner calendar. 🍓</div>'}
function showHistory(d,id){let b=data(load()).v12.bills.find(x=>x.id===id)||data(load()).v12.archive.map(x=>x.item).find(x=>x.id===id);if(!b)return;let box=d.getElementById('v121Hist_'+id);if(!box){box=d.getElementById('v121ArchiveHist_'+id)}if(!box)return;let h=b.history||[];box.style.display=box.style.display==='none'?'block':'none';box.innerHTML=h.length?h.slice().reverse().map(x=>`<div class="v121-history-row"><span>Due ${esc(x.dueDate)}</span><span>Paid ${esc(x.paidDate)} • ${money(x.amount)}</span></div>`).join(''):'<div class="muted">No payments recorded yet.</div>'}
function renderArchive(d){let box=d.getElementById('v121ArchiveBillList');if(!box)return;let arr=data(load()).v12.archive.filter(x=>x.type==='bill').map(x=>x.item);box.innerHTML=arr.length?arr.map(b=>`<div class="v121-bill v121-archive"><div class="v121-bill-head"><div><b>${esc(b.name)}</b><div class="muted">${money(b.amount)} • Monthly on day ${b.dueDay} • ${esc(b.category)}</div><small>Archived: ${esc((b.archivedAt||'').slice(0,10)||'—')} • Last paid: ${esc((b.history||[]).slice(-1)[0]?.paidDate||'Never')}</small></div><span class="v121-chip">Archived</span></div><div class="v121-actions"><button class="v121-restore" onclick="window.v121RestoreBill('${b.id}')">↩️ Restore</button><button onclick="window.v121ShowArchiveHistory('${b.id}')">📜 Payment History</button></div><div id="v121ArchiveHist_${b.id}" class="v121-history" style="display:none"></div></div>`).join(''):'<div class="v121-empty">Your archive is empty. Future-you approves. ♡</div>'}
function restoreBill(d,id){let s=data(load()),i=s.v12.archive.findIndex(x=>x.type==='bill'&&x.item.id===id);if(i<0)return;let b=s.v12.archive[i].item;b.active=true;delete b.archivedAt;s.v12.bills.push(b);s.v12.archive.splice(i,1);save(s);renderArchive(d);renderBills(d);renderCalendarBills(d);toast('Bill restored ↩️')}
function calendarMonth(d){let txt=d.getElementById('month')?.textContent||'';let z=new Date(txt+' 1');if(Number.isNaN(z.getTime())){let now=new Date();return {y:now.getFullYear(),m:now.getMonth()+1}}return {y:z.getFullYear(),m:z.getMonth()+1}}
function renderCalendarBills(d){let cal=d.getElementById('cal');if(!cal)return;let {y,m}=calendarMonth(d),s=data(load()),bills=s.v12.bills.filter(b=>b.active);cal.querySelectorAll('.v121-calendar-dot').forEach(x=>x.remove());cal.querySelectorAll('.day[data-k]').forEach(day=>{let k=day.dataset.k;let billsHere=bills.filter(b=>billDueInMonth(b,y,m)===k);billsHere.forEach(b=>{let span=d.createElement('span');span.className='v121-calendar-dot '+(paidFor(b,k)?'paid':'');span.textContent=(paidFor(b,k)?'✓ ':'💰 ')+b.name;day.appendChild(span)})});appendSelectedBills(d)}
function appendSelectedBills(d){let events=d.getElementById('events');if(!events)return;events.querySelectorAll('.v121-selected-bill').forEach(x=>x.remove());let title=d.getElementById('selTitle')?.textContent||'';let z=new Date(title);if(Number.isNaN(z.getTime()))return;let k=dateKey(z.getFullYear(),z.getMonth()+1,z.getDate()),s=data(load());s.v12.bills.filter(b=>b.active&&billDueInMonth(b,z.getFullYear(),z.getMonth()+1)===k).forEach(b=>{let item=d.createElement('div');item.className='eventItem v121-selected-bill';let paid=paidFor(b,k);item.innerHTML=`<div><b>💰 ${esc(b.name)}</b><div class="muted">${money(b.amount)} • ${esc(b.category)} • Monthly bill</div></div><button onclick="window.v121PayBill('${b.id}','${k}')">${paid?'✓ Paid':'Mark Paid'}</button>`;events.appendChild(item)})}
function observePlanner(d){let cal=d.getElementById('cal'),events=d.getElementById('events');if(!cal||!events)return;cal.addEventListener('click',()=>setTimeout(()=>renderCalendarBills(d),20));new MutationObserver(()=>renderCalendarBills(d)).observe(cal,{childList:true});new MutationObserver(()=>appendSelectedBills(d)).observe(events,{childList:true})}
function expose(d){window.v121PayBill=(id,k)=>payBill(d,id,k);window.v121ArchiveBill=id=>archiveBill(d,id);window.v121DeleteBill=id=>deleteBill(d,id);window.v121ShowHistory=id=>showHistory(d,id);window.v121ShowArchiveHistory=id=>showHistory(d,id);window.v121RestoreBill=id=>restoreBill(d,id)}
frame.addEventListener('load',()=>{let d=frame.contentDocument;injectStyle(d);addNav(d);getArchivePage(d);billManager(d);expose(d);renderArchive(d);observePlanner(d);renderCalendarBills(d);});
})();
</script>
</body>
</html>
