name: Sync live planner source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.head_commit.message != 'Sync live planner from docs source' && github.event.head_commit.message != 'Sync live planner and Mochini atlases' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy latest planner into the live iframe source
        run: cp docs/planner-app.html planner-app.html
      - name: Assemble approved Mochini atlases
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'v5/assets/mochini/encoded-v1/face-*.b64' > /dev/null && compgen -G 'v5/assets/mochini/encoded-v1/mode-*.b64' > /dev/null; then
            cat v5/assets/mochini/encoded-v1/face-*.b64 | base64 --decode > v5/assets/mochini/mochini-face-atlas-v1.webp
            cat v5/assets/mochini/encoded-v1/mode-*.b64 | base64 --decode > v5/assets/mochini/mochini-mode-atlas-v1.webp
            test "$(stat -c%s v5/assets/mochini/mochini-face-atlas-v1.webp)" -eq 150226
            test "$(stat -c%s v5/assets/mochini/mochini-mode-atlas-v1.webp)" -eq 366852
            echo "e9b0a74150778e3a6beba67cfec46fd7fef645144a16f5fde67832317f1f9b01  v5/assets/mochini/mochini-face-atlas-v1.webp" | sha256sum -c -
            echo "67865092a2206e42a64c44c3048646e2a60a6da01d149c56f08b25f3087aba97  v5/assets/mochini/mochini-mode-atlas-v1.webp" | sha256sum -c -
          fi
      - name: Commit live source and Mochini atlases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planner-app.html v5/assets/mochini/mochini-face-atlas-v1.webp v5/assets/mochini/mochini-mode-atlas-v1.webp
          git diff --cached --quiet && exit 0
          git commit -m "Sync live planner and Mochini atlases"
          git push
