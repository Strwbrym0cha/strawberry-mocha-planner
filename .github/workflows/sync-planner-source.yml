name: Sync live planner source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.head_commit.message != 'Sync live planner from docs source' && github.event.head_commit.message != 'Sync live planner and Mochini atlases' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy latest planner into the live iframe source
        run: cp docs/planner-app.html planner-app.html
      - name: Assemble and verify approved Mochini atlases when source is complete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          specs = {
              'face': (Path('v5/assets/mochini/mochini-face-atlas-v1.webp'), 150226, 'e9b0a74150778e3a6beba67cfec46fd7fef645144a16f5fde67832317f1f9b01'),
              'mode': (Path('v5/assets/mochini/mochini-mode-atlas-v1.webp'), 366852, '67865092a2206e42a64c44c3048646e2a60a6da01d149c56f08b25f3087aba97'),
          }
          root = Path('v5/assets/mochini/encoded-v1')

          for prefix, (out, expected_size, expected_sha) in specs.items():
              # If the exact approved atlas is already committed, keep it untouched.
              if out.exists():
                  data = out.read_bytes()
                  sha = hashlib.sha256(data).hexdigest()
                  if len(data) == expected_size and sha == expected_sha:
                      print(prefix, 'approved atlas already present:', len(data), sha)
                      continue
                  print(f'::warning::{prefix} atlas exists but does not match approved integrity; leaving it untouched')

              parts = sorted(root.glob(f'{prefix}-*.b64'))
              if not parts:
                  print(f'::warning::No {prefix} chunks found; planner sync will continue without rebuilding this atlas')
                  continue

              texts = [p.read_text().strip() for p in parts]
              print(prefix, [(p.name, len(t)) for p, t in zip(parts, texts)])

              candidates = []
              try:
                  candidates.append(('continuous', base64.b64decode(''.join(texts), validate=True)))
              except Exception as e:
                  print(prefix, 'continuous decode failed:', repr(e))

              try:
                  candidates.append(('per-chunk', b''.join(base64.b64decode(t, validate=True) for t in texts)))
              except Exception as e:
                  print(prefix, 'per-chunk decode failed:', repr(e))

              matched = False
              for strategy, data in candidates:
                  sha = hashlib.sha256(data).hexdigest()
                  print(prefix, strategy, 'size=', len(data), 'sha256=', sha)
                  if len(data) == expected_size and sha == expected_sha:
                      out.write_bytes(data)
                      print(prefix, 'matched approved atlas with', strategy)
                      matched = True
                      break

              if not matched:
                  print(f'::warning::{prefix} chunks are incomplete or do not match the approved atlas; planner sync will continue')
          PY
      - name: Commit live source and any verified Mochini atlases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planner-app.html
          for atlas in \
            v5/assets/mochini/mochini-face-atlas-v1.webp \
            v5/assets/mochini/mochini-mode-atlas-v1.webp
          do
            if [ -f "$atlas" ]; then
              git add "$atlas"
            fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "Sync live planner and Mochini atlases"
          git push
