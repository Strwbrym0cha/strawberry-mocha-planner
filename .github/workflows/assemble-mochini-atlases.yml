name: Assemble Mochini approved atlases

on:
  push:
    branches: [main]
    paths:
      - 'v5/assets/mochini/encoded-v1/**'
      - '.github/workflows/assemble-mochini-atlases.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-mochini-atlases
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Assemble approved Mochini atlases
        shell: bash
        run: |
          set -euo pipefail
          cat v5/assets/mochini/encoded-v1/face-*.b64 | base64 --decode > v5/assets/mochini/mochini-face-atlas-v1.webp
          cat v5/assets/mochini/encoded-v1/mode-*.b64 | base64 --decode > v5/assets/mochini/mochini-mode-atlas-v1.webp

          test "$(stat -c%s v5/assets/mochini/mochini-face-atlas-v1.webp)" -eq 150226
          test "$(stat -c%s v5/assets/mochini/mochini-mode-atlas-v1.webp)" -eq 366852

          echo "e9b0a74150778e3a6beba67cfec46fd7fef645144a16f5fde67832317f1f9b01  v5/assets/mochini/mochini-face-atlas-v1.webp" | sha256sum -c -
          echo "67865092a2206e42a64c44c3048646e2a60a6da01d149c56f08b25f3087aba97  v5/assets/mochini/mochini-mode-atlas-v1.webp" | sha256sum -c -

      - name: Commit production atlases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v5/assets/mochini/mochini-face-atlas-v1.webp v5/assets/mochini/mochini-mode-atlas-v1.webp
          if git diff --cached --quiet; then
            echo "Approved atlases already current."
            exit 0
          fi
          git commit -m "Add Mochini approved production atlases"
          git push origin HEAD:main
