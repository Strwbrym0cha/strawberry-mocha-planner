name: Restore planner app

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.event.head_commit.message != 'Restore planner app' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore stable V9 planner
        run: git show dfe957d5291b346d55866a8091a6c66da954859c:docs/v9.html > planner-app.html

      - name: Commit restored planner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planner-app.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore planner app"
          git push