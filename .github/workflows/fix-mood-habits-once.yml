name: One-time mood and habit fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Apply direct mood and habit renderer fix' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch the actual planner source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/planner-app.html')
          s=p.read_text()
          old_h="$('todayHabits').innerHTML=$('habits').innerHTML=d.habits.map((x,i)=>`<div class=item><input type=checkbox ${x[1][DAY()]?'checked':''} onchange=\"habitToggle(${i})\"><span class=${x[1][DAY()]?'done':''}>${esc(x[0])}</span></div>`).join('');"
          new_h="$('todayHabits').innerHTML=$('habits').innerHTML=d.habits.map((x,i)=>`<div class=item><input type=checkbox ${x[1][DAY()]?'checked':''} onchange=\"habitToggle(${i})\"><span class=${x[1][DAY()]?'done':''}>${esc(x[0])}</span><button class=x type=button onclick=\"removeHabit(${i})\" title=\"Remove habit\">×</button></div>`).join('');"
          if old_h in s:
              s=s.replace(old_h,new_h,1)
          elif new_h not in s:
              raise SystemExit('Habit renderer not found')

          old_m="$('moods').innerHTML=['😄','🙂','😐','😕','😴'].map(x=>`<button class=${d.mood===x?'sel':''} onclick=\"moodPick('${x}')\">${x}</button>`).join('');"
          moods="[['🥰','Loved'],['😊','Happy'],['😌','Calm'],['🥹','Tender'],['🤩','Excited'],['😎','Confident'],['🙂','Okay'],['😐','Meh'],['😶','Blank'],['😴','Sleepy'],['🥱','Drained'],['😮‍💨','Overwhelmed'],['😔','Sad'],['🥺','Sensitive'],['😣','Frustrated'],['😤','Irritated'],['🤯','Overloaded'],['🫠','Melting'],['🧸','Need comfort'],['🌱','Hopeful'],['🧠','Focused'],['🎀','Feeling cute']]"
          new_m="$('moods').className='smMoodGrid';$('moods').innerHTML="+moods+".map(x=>`<button type=button class=smMood ${hist().mood===x[1]?'on':''} onclick=\"moodPick('${x[1]}')\"><b>${x[0]}</b><small>${x[1]}</small></button>`).join('')+'<div class=smMoodNote>Pick what feels true. There is no wrong mood. ♡</div>';"
          if old_m in s:
              s=s.replace(old_m,new_m,1)
          elif new_m not in s:
              raise SystemExit('Mood renderer not found')

          p.write_text(s)
          PY
      - name: Commit direct fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planner-app.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply direct mood and habit renderer fix"
          git push