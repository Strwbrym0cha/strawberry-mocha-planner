e6;border-radius:99px;margin-top:5px;overflow:hidden}.v13bar i{display:block;height:100%;background:#e99ab7;border-radius:99px}.v13cute{background:linear-gradient(135deg,#fff0f5,#fffaf5);border:1px solid #f0dfe3;border-radius:25px;padding:17px;margin:10px 0}.v13rem{display:flex;align-items:center;gap:10px;background:#fffaf6;border:1px solid #f0dfe3;border-radius:19px;padding:12px;margin:8px 0}.v13rem .bell{font-size:25px}.v13rem .body{flex:1}.v13rem b{display:block;font-size:13px}.v13rem small{color:#99817a}.v13goal{background:#fffaf6;border:1px solid #f0dfe3;border-radius:21px;padding:14px;margin:9px 0}.v13ghead{display:flex;gap:10px;align-items:flex-start}.v13ghead .seed{font-size:34px}.v13ghead .info{flex:1}.v13ring{width:58px;height:58px;border-radius:50%;background:conic-gradient(#e99ab7 var(--p),#f0e4e6 0);display:grid;place-items:center;position:relative}.v13ring:after{content:'';position:absolute;width:44px;height:44px;border-radius:50%;background:#fff}.v13ring span{position:relative;z-index:1;font-size:10px;font-weight:950;color:#b96c88}.v13goal .meta{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.v13step{background:#fff0f5;border-radius:12px;padding:8px;font-size:11px;margin-top:8px}.v13actions{display:flex;gap:7px;margin-top:9px}.v13actions button{flex:1}@media(max-width:600px){.v13garden{grid-template-columns:repeat(2,1fr)}}';d.head.appendChild(s)}function syncGarden(d){const home=d.getElementById('home'),garden=home&&home.querySelector('.garden');if(!garden)return;let h={};try{h=JSON.parse(d.defaultView.localStorage.getItem('sm_habit_history')||'{}')}catch(e){}const a=Object.values(h),today=new Date().toISOString().slice(0,10),x=new Date();x.setHours(12,0,0,0);x.setDate(x.getDate()-x.getDay());const ws=x.toISOString().slice(0,10);garden.innerHTML='<div class="v13garden">'+(a.length?a.map((q,i)=>{const days=q.days||{},n=Object.keys(days).filter(k=>days[k]&&k>=ws).length,p=Math.min(100,Math.round(n/7*100)),em=['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7];return '<div class="v13plant"><div class="e">'+em+'</div><b>'+esc(q.name||'Habit')+'</b><small>'+n+'/7 this week'+(days[today]?' • ✓ today':'')+'</small><div class="v13bar"><i style="width:'+p+'%"></i></div></div>'}).join(''):'<div class="v13plant" style="grid-column:1/-1"><div class="e">🌱</div><b>Your garden is waiting</b><small>Plant a habit in Garden to grow it here.</small></div>')+'</div>';const pct=a.length?Math.round(a.reduce((n,q)=>n+Object.keys(q.days||{}).filter(k=>q.days[k]&&k>=ws).length,0)/(a.length*7)*100):0;const hh=d.getElementById('hh'),hr=d.getElementById('hr');if(hh)hh.textContent=pct+'%';if(hr){hr.style.setProperty('--pct',pct+'%');const sp=hr.querySelector('span');if(sp)sp.textContent=pct+'%'}}function reminders(d){const p=d.querySelector('section.page#reminders');if(!p)return;const s=load(d),v=V(s),items=v.reminders||[];p.innerHTML='<div class="hero"><div class="ey">🔔 REMINDERS • V13</div><h1>Little notes for future-you.</h1><p class="muted">Keep the tiny things somewhere safe so your brain doesn't have to.</p></div><div class="v13cute"><div class="ey">🎀 ADD A REMINDER</div><h2>Leave yourself a little note.</h2><div class="row"><input id="v13rt" class="input" placeholder="What do you need to remember?"><input id="v13rd" class="input" type="date"><button id="v13addReminder" class="primary">＋ Add</button></div></div><div class="card"><div class="topline"><div><div class="ey">🔔 YOUR REMINDERS</div><h2>Future-you's inbox</h2></div><span class="pill">'+items.length+' saved</span></div><div id="v13remList">'+(items.length?items.map((x,i)=>'<div class="v13rem"><div class="bell">'+(i%3===0?'🔔':i%3===1?'🎀':'🍓')+'</div><div class="body"><b>'+esc(x.text||x.name||'Reminder')+'</b><small>📅 '+esc(x.date||'Anytime')+'</small></div><button data-rdel="'+i+'">✓</button></div>').join(''):'<div class="v13cute" style="text-align:center"><div style="font-size:36px">🧸</div><b>Your reminder basket is empty.</b><p class="muted">Add something small and let your brain put it down. ♡</p></div>')+'</div></div>';d.getElementById('v13addReminder').onclick=()=>{const text=d.getElementById('v13rt').value.trim();if(!text)return;const s=load(d),v=V(s);v.reminders=v.reminders||[];v.reminders.push({text,date:d.getElementById('v13rd').value});save(d,s);reminders(d);resize()};p.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{const s=load(d),v=V(s);v.reminders=(v.reminders||[]).filter((_,j)=>j!==+b.dataset.rdel);save(d,s);reminders(d);resize()})}function goals(d){const p=d.querySelector('section.page#goals');if(!p)return;const s=load(d),v=V(s),items=v.goals||[];p.innerHTML='<div class="hero"><div class="ey">✨ GOALS GARDEN • V13</div><h1>Let's grow something beautiful.</h1><p class="muted">Your goals are little seeds. You don't have to water the whole garden today. 🌷</p></div><div class="v13cute"><div class="ey">🌱 PLANT A GOAL</div><h2>What are we growing?</h2><div class="row"><input id="v13gn" class="input" placeholder="Goal"><input id="v13gs" class="input" placeholder="Next tiny step"><button id="v13ga" class="primary">🌱 Plant</button></div></div><div class="card"><div class="topline"><div><div class="ey">🌷 YOUR LITTLE GARDEN</div><h2>Growing at your pace</h2></div><span class="pill">'+items.length+' planted</span></div><div id="v13goalList">'+(items.length?items.map((x,i)=>{const pct=Math.max(0,Math.min(100,+x.progress||0)),em=['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7];return '<div class="v13goal"><div class="v13ghead"><div class="seed">'+em+'</div><div class="info"><h3>'+esc(x.goal||x.name||'Goal')+'</h3><div class="muted">'+(x.step||x.next?'Next: '+esc(x.step||x.next):'Choose one tiny next step when you are ready. ♡')+'</div></div><div class="v13ring" style="--p:'+pct+'%"><span>'+pct+'%</span></div></div><div class="meta"><span class="pill">'+(pct===100?'🌸 Bloomed!':'🌱 Growing')+'</span></div><div class="progress"><i style="width:'+pct+'%"></i></div><div class="v13actions"><button data-gup="'+i+'">＋10%</button><button data-gdown="'+i+'">−10%</button><button data-gdone="'+i+'">🌸 Done</button></div></div>'}).join(''):'<div class="v13cute" style="text-align:center"><div style="font-size:42px">🌱</div><b>Nothing planted yet.</b><p class="muted">Your garden is waiting for its first little seed. ♡</p></div>')+'</div></div>';d.getElementById('v13ga').onclick=()=>{const n=d.getElementById('v13gn').value.trim();if(!n)return;const s=load(d),v=V(s);v.goals=v.goals||[];v.goals.push({goal:n,step:d.getElementById('v13gs').value.trim(),progress:0});save(d,s);goals(d);resize()};p.querySelectorAll('[data-gup]').forEach(b=>b.onclick=()=>{const s=load(d),v=V(s),x=v.goals[+b.dataset.gup];x.progress=Math.min(100,(+x.progress||0)+10);save(d,s);goals(d);resize()});p.querySelectorAll('[data-gdown]').forEach(b=>b.onclick=()=>{const s=load(d),v=V(s),x=v.goals[+b.dataset.gdown];x.progress=Math.max(0,(+x.progress||0)-10);save(d,s);goals(d);resize()});p.querySelectorAll('[data-gdone]').forEach(b=>b.onclick=()=>{const s=load(d),v=V(s),x=v.goals[+b.dataset.gdone];x.progress=100;save(d,s);goals(d);resize()})}function boot(){const d=doc();if(!d)return;d.documentElement.style.overflow='visible';d.body.style.overflow='visible';d.body.style.minHeight='100%';addStyle(d);syncGarden(d);const nav=d.getElementById('nav');if(nav&&!nav.dataset.v13){nav.dataset.v13='1';nav.addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;setTimeout(()=>{if(b.dataset.page==='goals')goals(d);else if(b.dataset.page==='reminders')reminders(d);else if(b.dataset.page==='home')syncGarden(d);resize()},30)})}if(mo)mo.disconnect();mo=new MutationObserver(()=>resize());mo.observe(d.body,{childList:true,subtree:true});setTimeout(resize,100);setTimeout(resize,500);setTimeout(resize,1200)}f.addEventListener('load',()=>setTimeout(boot,150));window.addEventListener('resize',resize)})();</script></body></html>
