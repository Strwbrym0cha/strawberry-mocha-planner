<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4dce7"><title>Strawberry Mocha Planner V13 🍓</title><style>html,body{margin:0;width:100%;min-height:100%;background:#fbf5f2;overflow:auto}#app{display:block;width:100%;min-height:100vh;height:100vh;border:0;overflow:auto;-webkit-overflow-scrolling:touch}</style></head><body><iframe id="app" src="./v12.html?v13=5" title="Strawberry Mocha Planner V13"></iframe><script>(()=>{const f=document.getElementById('app');const KEY='sm_v10';const load=()=>{try{return JSON.parse(f.contentWindow.localStorage.getItem(KEY)||'{}')}catch(e){return{}}};const save=s=>f.contentWindow.localStorage.setItem(KEY,JSON.stringify(s));const V=s=>(s.v12=s.v12||{},s.v12);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let timer=null,observer=null;function fit(){try{const d=f.contentDocument;if(!d)return;d.documentElement.style.overflow='visible';d.body.style.overflow='visible';d.body.style.minHeight='100%';const p=d.querySelector('.page.active');f.style.height=Math.max(900,p?p.scrollHeight:d.body.scrollHeight,d.documentElement.scrollHeight)+'px'}catch(e){}}function polish(d){if(d.getElementById('v13cuteStyle'))return;const s=d.createElement('style');s.id='v13cuteStyle';s.textContent='.v13box{background:linear-gradient(135deg,#fff0f5,#fffaf5);border:1px solid #f0dfe3;border-radius:25px;padding:17px;margin:10px 0}.v13item{background:#fffaf6;border:1px solid #f0dfe3;border-radius:20px;padding:14px;margin:9px 0;box-shadow:0 8px 22px #67494108}.v13head{display:flex;gap:11px;align-items:flex-start}.v13icon{font-size:30px;line-height:1}.v13info{flex:1}.v13info b{font-size:15px}.v13small{display:block;color:#99817a;font-size:11px;margin-top:4px}.v13ring{width:52px;height:52px;border-radius:50%;background:conic-gradient(#e99ab7 var(--p),#f0e4e6 0);display:grid;place-items:center;position:relative;flex:none}.v13ring:after{content:"";position:absolute;width:39px;height:39px;border-radius:50%;background:#fff}.v13ring span{position:relative;z-index:1;font-size:9px;font-weight:950;color:#b96c88}.v13actions{display:flex;gap:7px;margin-top:10px}.v13actions button{flex:1;border-radius:12px;background:#fff;border-color:#efbfd0;color:#b96c88}.v13empty{text-align:center;padding:24px 10px}.v13empty .big{font-size:42px}.v13tag{display:inline-block;background:#fff0f5;border-radius:10px;padding:5px 8px;font-size:10px;color:#b96c88;font-weight:850;margin-top:8px}';d.head.appendChild(s)}function goals(d){const p=d.getElementById('goals');if(!p||p.classList.contains('v13fixed'))return;const s=load(),v=V(s),items=v.goals||[];p.classList.add('v13fixed');p.innerHTML='<div class="hero"><div class="ey">✨ GOALS GARDEN • V13</div><h1>Let's grow something beautiful.</h1><p class="muted">Your goals are little seeds. You only have to water one today. 🌷</p></div><div class="v13box"><div class="ey">🌱 PLANT A GOAL</div><h2>What are we growing?</h2><div class="row"><input id="v13goalName" class="input" placeholder="Goal"><input id="v13goalStep" class="input" placeholder="Next tiny step"><button id="v13goalAdd" class="primary">🌱 Plant</button></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="ey">🌷 YOUR LITTLE GARDEN</div><h2>Growing at your pace</h2></div><span class="pill">'+items.length+' planted</span></div><div id="v13goalList">'+(items.length?items.map((x,i)=>{const q=Math.max(0,Math.min(100,+x.progress||0)),em=['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7];return '<div class="v13item"><div class="v13head"><div class="v13icon">'+em+'</div><div class="v13info"><b>'+esc(x.goal||'Goal')+'</b><span class="v13small">'+(x.step?'Next: '+esc(x.step):'Choose one tiny next step when you are ready. ♡')+'</span></div><div class="v13ring" style="--p:'+q+'%"><span>'+q+'%</span></div></div><span class="v13tag">'+(q===100?'🌸 Bloomed!':'🌱 Growing')+'</span><div class="progress" style="margin-top:8px"><i style="width:'+q+'%"></i></div><div class="v13actions"><button data-up="'+i+'">＋10%</button><button data-down="'+i+'">−10%</button><button data-done="'+i+'">🌸 Done</button></div></div>'}).join(''):'<div class="v13empty"><div class="big">🌱</div><b>Nothing planted yet.</b><p class="muted">Your little garden is waiting for its first seed. ♡</p></div>')+'</div></div>';d.getElementById('v13goalAdd').onclick=()=>{const n=d.getElementById('v13goalName').value.trim();if(!n)return;const s=load(),v=V(s);v.goals=v.goals||[];v.goals.push({goal:n,step:d.getElementById('v13goalStep').value.trim(),progress:0});save(s);goals(d);fit()};p.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>changeGoal(d,+b.dataset.up,10));p.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>changeGoal(d,+b.dataset.down,-10));p.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>changeGoal(d,+b.dataset.done,100,true));fit()}function changeGoal(d,i,amount,done){const s=load(),v=V(s),x=(v.goals||[])[i];if(!x)return;x.progress=done?100:Math.max(0,Math.min(100,(+x.progress||0)+amount));if(done){v.wins=(v.wins||0)+1;v.completedGoals=(v.completedGoals||0)+1}save(s);goals(d);fit()}function reminders(d){const p=d.getElementById('reminders');if(!p||p.classList.contains('v13fixed'))return;const s=load(),v=V(s),items=v.reminders||[];p.classList.add('v13fixed');p.innerHTML='<div class="hero"><div class="ey">🔔 REMINDERS • V13</div><h1>Little notes for future-you.</h1><p class="muted">Put the tiny things somewhere safe so your brain can let them go. ♡</p></div><div class="v13box"><div class="ey">🎀 ADD A REMINDER</div><h2>Leave yourself a little note.</h2><div class="row"><input id="v13remText" class="input" placeholder="What do you need to remember?"><input id="v13remDate" class="input" type="date"><button id="v13remAdd" class="primary">＋ Add</button></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="ey">🔔 YOUR REMINDERS</div><h2>Future-you's basket</h2></div><span class="pill">'+items.length+' saved</span></div><div id="v13remList">'+(items.length?items.map((x,i)=>'<div class="v13item"><div class="v13head"><div class="v13icon">'+(i%3===0?'🔔':i%3===1?'🎀':'🍓')+'</div><div class="v13info"><b>'+esc(x.text||'Reminder')+'</b><span class="v13small">📅 '+esc(x.date||'Anytime')+'</span></div><button data-rdone="'+i+'">✓</button></div></div>').join(''):'<div class="v13empty"><div class="big">🧸</div><b>Your reminder basket is empty.</b><p class="muted">Add something small and let your brain put it down. ♡</p></div>')+'</div></div>';d.getElementById('v13remAdd').onclick=()=>{const text=d.getElementById('v13remText').value.trim();if(!text)return;const s=load(),v=V(s);v.reminders=v.reminders||[];v.reminders.push({text,date:d.getElementById('v13remDate').value});save(s);reminders(d);fit()};p.querySelectorAll('[data-rdone]').forEach(b=>b.onclick=()=>{const s=load(),v=V(s);v.reminders=(v.reminders||[]).filter((_,j)=>j!==+b.dataset.rdone);save(s);reminders(d);fit()});fit()}function repair(){try{const d=f.contentDocument;if(!d)return;polish(d);const g=d.querySelector('.page.active#goals');const r=d.querySelector('.page.active#reminders');if(g&&!g.classList.contains('v13fixed'))goals(d);if(r&&!r.classList.contains('v13fixed'))reminders(d);fit()}catch(e){}}function boot(){repair();if(observer)observer.disconnect();observer=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(repair,20)});observer.observe(f.contentDocument.body,{childList:true,subtree:true});setInterval(repair,800)}f.addEventListener('load',()=>setTimeout(boot,200));window.addEventListener('resize',fit)})();</script></body></html>
