<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4dce7"><title>Strawberry Mocha Planner V13 🍓</title><style>html,body{margin:0;width:100%;min-height:100%;background:#fbf5f2;overflow:auto}#app{display:block;width:100%;min-height:100vh;height:100vh;border:0;overflow:auto;-webkit-overflow-scrolling:touch}</style></head><body><iframe id="app" src="./v12.html?v13=6" title="Strawberry Mocha Planner V13"></iframe><script>(()=>{const f=document.getElementById('app');const KEY='sm_v10';let timer;function data(){try{return JSON.parse(f.contentWindow.localStorage.getItem(KEY)||'{}')}catch(e){return{}}}function save(x){f.contentWindow.localStorage.setItem(KEY,JSON.stringify(x))}function v(x){x.v12=x.v12||{};return x.v12}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function style(d){if(d.getElementById('v13style'))return;const s=d.createElement('style');s.id='v13style';s.textContent='.v13wrap{max-width:900px;margin:auto}.v13box{background:linear-gradient(135deg,#fff0f5,#fffaf5);border:1px solid #eedde1;border-radius:27px;padding:20px;margin:10px 0;box-shadow:0 10px 28px #6749410b}.v13item{background:#fff;border:1px solid #eedde1;border-radius:21px;padding:15px;margin:10px 0;box-shadow:0 8px 22px #6749410a}.v13top{display:flex;gap:12px;align-items:flex-start}.v13icon{font-size:30px;line-height:1}.v13info{flex:1}.v13info b{font-size:16px}.v13small{display:block;color:#99817a;font-size:11px;margin-top:5px}.v13actions{display:flex;gap:7px;margin-top:11px}.v13actions button{flex:1}.v13empty{text-align:center;padding:30px 12px}.v13empty .big{font-size:48px}.v13progress{height:9px;background:#f0e4e6;border-radius:99px;overflow:hidden;margin-top:10px}.v13progress i{display:block;height:100%;background:#e99ab7;border-radius:99px}.v13badge{display:inline-block;background:#fff0f5;color:#b96c88;border-radius:10px;padding:5px 9px;font-size:10px;font-weight:850;margin-top:8px}';d.head.appendChild(s)}function basePage(d,id,title,sub,ey){const p=d.getElementById(id);if(!p)return null;p.innerHTML='<div class="v13wrap"><div class="hero"><div class="ey">'+ey+'</div><h1>'+title+'</h1><p class="muted">'+sub+'</p></div><div id="v13content"></div></div>';return p.querySelector('#v13content')}function activate(d,id){d.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));d.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));window.scrollTo(0,0);fit()}function fit(){try{const d=f.contentDocument,p=d.querySelector('.page.active');f.style.height=Math.max(900,p?p.scrollHeight:d.documentElement.scrollHeight)+'px'}catch(e){}}function goals(d){style(d);const c=basePage(d,'goals','Let’s grow something beautiful.','Your goals are little seeds. You only have to water one today. 🌷','✨ GOALS GARDEN • V13');if(!c)return;const s=data(),v=vdata(s),items=v.goals||[];c.innerHTML='<div class="v13box"><div class="ey">🌱 PLANT A GOAL</div><h2>What are we growing?</h2><div class="row"><input id="v13gn" class="input" placeholder="Goal"><input id="v13gs" class="input" placeholder="Next tiny step"><button id="v13ga" class="primary">🌱 Plant</button></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="ey">🌷 YOUR LITTLE GARDEN</div><h2>Growing at your pace</h2></div><span class="pill">'+items.length+' planted</span></div><div id="v13gl">'+(items.length?items.map((x,i)=>'<div class="v13item"><div class="v13top"><div class="v13icon">'+['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7]+'</div><div class="v13info"><b>'+esc(x.goal||'Goal')+'</b><span class="v13small">'+(x.step?'Next: '+esc(x.step):'Choose one tiny next step when you are ready. ♡')+'</span><span class="v13badge">'+((+x.progress||0)>=100?'🌸 Bloomed!':'🌱 Growing')+'</span></div></div><div class="v13progress"><i style="width:'+Math.max(0,Math.min(100,+x.progress||0))+'%"></i></div><div class="v13actions"><button data-gup="'+i+'">＋10%</button><button data-gdone="'+i+'">🌸 Complete</button><button data-gdel="'+i+'">🗑️</button></div></div>').join(''):'<div class="v13empty"><div class="big">🌱</div><b>Nothing planted yet.</b><p class="muted">Your little garden is waiting for its first seed. ♡</p></div>')+'</div></div>';c.querySelector('#v13ga').onclick=()=>{const n=d.getElementById('v13gn').value.trim();if(!n)return;const s=data(),z=vdata(s);z.goals=z.goals||[];z.goals.push({goal:n,step:d.getElementById('v13gs').value.trim(),progress:0});save(s);goals(d);fit()};c.querySelectorAll('[data-gup]').forEach(b=>b.onclick=()=>goalChange(d,+b.dataset.gup,10));c.querySelectorAll('[data-gdone]').forEach(b=>b.onclick=()=>goalChange(d,+b.dataset.gdone,100,true));c.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>{const s=data(),z=vdata(s);z.goals.splice(+b.dataset.gdel,1);save(s);goals(d);fit()});fit()}function vdata(s){s.v12=s.v12||{};return s.v12}function goalChange(d,i,n,complete){const s=data(),v=vdata(s),x=(v.goals||[])[i];if(!x)return;x.progress=complete?100:Math.min(100,(+x.progress||0)+n);if(complete){v.wins=(v.wins||0)+1;v.completedGoals=(v.completedGoals||0)+1}save(s);goals(d);fit()}function reminders(d){style(d);const c=basePage(d,'reminders','Little notes for future-you.','Put the tiny things somewhere safe so your brain can let them go. ♡','🔔 REMINDERS • V13');if(!c)return;const s=data(),v=vdata(s),items=v.reminders||[];c.innerHTML='<div class="v13box"><div class="ey">🎀 ADD A REMINDER</div><h2>Leave yourself a little note.</h2><div class="row"><input id="v13rt" class="input" placeholder="What do you need to remember?"><input id="v13rd" class="input" type="date"><button id="v13ra" class="primary">＋ Add</button></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="ey">🔔 YOUR REMINDERS</div><h2>Future-you’s basket</h2></div><span class="pill">'+items.length+' saved</span></div><div>'+((items.length)?items.map((x,i)=>'<div class="v13item"><div class="v13top"><div class="v13icon">'+['🔔','🎀','🍓'][i%3]+'</div><div class="v13info"><b>'+esc(x.text||'Reminder')+'</b><span class="v13small">📅 '+esc(x.date||'Anytime')+'</span></div></div><div class="v13actions"><button data-rdel="'+i+'">✓ Done</button></div></div>').join(''):'<div class="v13empty"><div class="big">🧸</div><b>Your reminder basket is empty.</b><p class="muted">Add something small and let your brain put it down. ♡</p></div>')+'</div></div>';c.querySelector('#v13ra').onclick=()=>{const t=d.getElementById('v13rt').value.trim();if(!t)return;const s=data(),z=vdata(s);z.reminders=z.reminders||[];z.reminders.push({text:t,date:d.getElementById('v13rd').value});save(s);reminders(d);fit()};c.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{const s=data(),z=vdata(s);z.reminders.splice(+b.dataset.rdel,1);save(s);reminders(d);fit()});fit()}function hook(d){style(d);const g=d.querySelector('#nav button[data-page="goals"]'),r=d.querySelector('#nav button[data-page="reminders"]');if(g){g.onclick=e=>{e.preventDefault();activate(d,'goals');goals(d)}}if(r){r.onclick=e=>{e.preventDefault();activate(d,'reminders');reminders(d)}}fit()}function boot(){try{const d=f.contentDocument;if(!d)return;hook(d)}catch(e){}}f.addEventListener('load',()=>setTimeout(boot,150));setInterval(boot,1000);window.addEventListener('resize',fit)})();</script></body></html>
