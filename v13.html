<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4dce7"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Strawberry Mocha Planner V13 🍓</title><style>html,body{margin:0;width:100%;height:100%;background:#fbf5f2;overflow:hidden}#app{display:block;width:100%;height:100%;border:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none}</style></head><body><iframe id="app" src="./v12.html?v13=1" title="Strawberry Mocha Planner V13"></iframe><script>(()=>{const f=document.getElementById('app');const KEY='sm_v10';function doc(){return f.contentDocument}function boot(){const d=doc();if(!d)return;d.documentElement.style.overflow='hidden';d.body.style.overflowY='auto';d.body.style.overflowX='hidden';d.body.style.minHeight='100%';d.body.style.overscrollBehavior='none';const nav=d.getElementById('nav');if(nav&&!nav.dataset.v13){nav.dataset.v13='1';nav.addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;requestAnimationFrame(()=>{const p=d.getElementById(b.dataset.page);if(p&&p.classList.contains('active'))d.defaultView.scrollTo(0,0)})},true)}const home=d.getElementById('home');const garden=home&&home.querySelector('.garden');if(!garden||garden.dataset.v13)return;if(!d.getElementById('v13style')){const s=d.createElement('style');s.id='v13style';s.textContent='.v13garden{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:170px;align-items:end}.v13plant{background:#fffaf6;border:1px solid #eadbd6;border-radius:18px;padding:9px;text-align:center}.v13plant .e{font-size:38px;line-height:1}.v13plant b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v13plant small{font-size:8px;color:#99817a}.v13bar{height:5px;background:#f0e4e6;border-radius:99px;margin-top:5px;overflow:hidden}.v13bar i{display:block;height:100%;background:#e99ab7;border-radius:99px}@media(max-width:600px){.v13garden{grid-template-columns:repeat(2,1fr)}}';d.head.appendChild(s)}function read(){try{return JSON.parse(d.defaultView.localStorage.getItem('sm_habit_history')||'{}')}catch(e){return{}}}function weekStart(){const x=new Date();x.setHours(12,0,0,0);x.setDate(x.getDate()-x.getDay());return x.toISOString().slice(0,10)}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sync(){const h=Object.values(read()),today=new Date().toISOString().slice(0,10),ws=weekStart();garden.dataset.v13='1';garden.innerHTML='<div class="v13garden">'+(h.length?h.map((x,i)=>{const days=x.days||{},n=Object.keys(days).filter(k=>days[k]&&k>=ws).length,p=Math.min(100,Math.round(n/7*100)),em=['🌱','🪴','🌷','🌸','🌺','🌻','🍓'][i%7];return '<div class="v13plant"><div class="e">'+em+'</div><b>'+esc(x.name)+'</b><small>'+n+'/7 this week'+(days[today]?' • ✓ today':'')+'</small><div class="v13bar"><i style="width:'+p+'%"></i></div></div>'}).join(''):'<div class="v13plant" style="grid-column:1/-1"><div class="e">🌱</div><b>Your garden is waiting</b><small>Plant a habit in Garden to grow it here.</small></div>')+'</div>';const total=h.length?Math.round(h.reduce((a,x)=>a+Object.keys(x.days||{}).filter(k=>x.days[k]&&k>=ws).length,0)/(h.length*7)*100):0;const hh=d.getElementById('hh'),hr=d.getElementById('hr');if(hh)hh.textContent=total+'%';if(hr){hr.style.setProperty('--pct',total+'%');const sp=hr.querySelector('span');if(sp)sp.textContent=total+'%'}}sync();nav.addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b&&b.dataset.page==='home')setTimeout(sync,80)},false)}f.addEventListener('load',()=>setTimeout(boot,150));})();</script></body></html>
