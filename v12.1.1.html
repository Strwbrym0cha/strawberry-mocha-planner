<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strawberry Mocha Planner V12.1.1 🍓</title><style>html,body{margin:0;background:#fbf5f2}iframe{display:block;width:100%;height:100vh;min-height:900px;border:0}</style></head><body><iframe id="v121" src="./v12.1.html" title="Strawberry Mocha Planner V12.1.1"></iframe><script>(()=>{const outer=document.getElementById('v121');function boot(){const mid=outer.contentWindow;const f=mid.document.getElementById('plannerFrame');if(!f)return;const repair=()=>{const d=f.contentDocument;if(!d||!d.getElementById('goals'))return;const page=d.getElementById('goals');let listId='v121GoalList';page.innerHTML=`<div class="hero"><div class="ey">✨ GOALS</div><h1>Leave breadcrumbs for future you.</h1><p class="muted">Turn big ideas into tiny, visible steps.</p></div><div class="card"><div class="row"><input id="goal" class="input" placeholder="Goal"><input id="step" class="input" placeholder="Next tiny step"><button id="addGoal" class="primary">＋ Save</button></div><div id="${listId}"></div></div>`;const KEY='sm_v10';const load=()=>{try{return JSON.parse(d.defaultView.localStorage.getItem(KEY)||'{}')}catch(e){return{}}};const save=s=>d.defaultView.localStorage.setItem(KEY,JSON.stringify(s));const v=s=>(s.v12=s.v12||{},s.v12);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=t=>{let x=d.getElementById('toast');if(x){x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1600)}};function render(){let g=v(load()).goals||[],list=d.getElementById(listId);list.innerHTML=g.length?g.map((x,i)=>`<div class="course"><b>${esc(x.goal)}</b><p class="muted">Next: ${esc(x.step||'Choose one tiny next step.')}</p><button data-i="${i}" class="goalDone">✓ Complete</button><button data-a="${i}" class="goalArchive">🗄️ Archive</button></div>`).join(''):'<p class="muted">No goals yet. Add one tiny thing to start. ♡</p>';list.querySelectorAll('.goalDone').forEach(b=>b.onclick=()=>{let s=load();v(s).goals.splice(+b.dataset.i,1);v(s).wins=(v(s).wins||0)+1;v(s).completedGoals=(v(s).completedGoals||0)+1;save(s);render();toast('Goal completed! 🏆')});list.querySelectorAll('.goalArchive').forEach(b=>b.onclick=()=>{let s=load();v(s).archive=v(s).archive||[];let g=v(s).goals.splice(+b.dataset.a,1)[0];v(s).archive.push({type:'goal',item:g,archivedAt:new Date().toISOString()});save(s);render();toast('Goal archived 🗄️')})}d.getElementById('addGoal').onclick=()=>{let goal=d.getElementById('goal').value.trim(),step=d.getElementById('step').value.trim();if(!goal){toast('Name the goal first ✨');return}let s=load();v(s).goals=v(s).goals||[];s.v12.goals.push({goal,step,createdAt:new Date().toISOString()});save(s);d.getElementById('goal').value='';d.getElementById('step').value='';render();toast('Goal saved ✨')};let nav=d.getElementById('nav');let btn=nav&&nav.querySelector('[data-page="goals"]');if(btn){btn.onclick=()=>{d.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p===page));d.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===btn));render()}}render()}if(f.contentDocument&&f.contentDocument.readyState==='complete')repair();else f.addEventListener('load',repair,{once:true})}outer.addEventListener('load',boot);})();</script></body></html>
